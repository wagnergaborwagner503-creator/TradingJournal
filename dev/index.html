<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trading Journal">
  <meta name="theme-color" content="#070b0f">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b0f'/%3E%3Crect x='4' y='4' width='24' height='24' rx='5' fill='%230d1520' stroke='%2300d4aa' stroke-width='1.5'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-weight='700' font-size='14' fill='%2300d4aa'%3ETJ%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070b0f; --surface: #0d1520; --surface2: #111d2e;
      --border: #1a2535; --border2: #243347;
      --accent: #00d4aa; --accent-dim: rgba(0,212,170,0.12);
      --green: #00e676; --green-dim: rgba(0,230,118,0.12);
      --red: #ff3d71; --red-dim: rgba(255,61,113,0.12);
      --yellow: #ffd740; --orange: #ff9100;
      --text: #dce8f5; --text-2: #7a93b0; --text-3: #3d5470;
      --mono: 'IBM Plex Mono', monospace; --sans: 'Syne', sans-serif;
      --radius: 8px; --radius-lg: 14px;
    }
    html, body, #root { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .app { display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 240px; min-width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; user-select: none; }
    .brand { padding: 22px 20px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 38px; height: 38px; background: var(--accent); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 600; font-size: 13px; color: #000; flex-shrink: 0; }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
    .brand-sub { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
    .nav-section { flex: 1; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
    .nav-btn { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 7px; border: none; background: transparent; color: var(--text-2); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-align: left; width: 100%; }
    .nav-btn:hover { background: var(--surface2); color: var(--text); }
    .nav-btn.active { background: var(--accent-dim); color: var(--accent); }
    .nav-btn svg { flex-shrink: 0; }
    .sidebar-stats { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .ss-row { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12px; }
    .ss-label { color: var(--text-3); }
    .ss-val { font-weight: 600; color: var(--text-2); }
    .main { flex: 1; overflow-y: auto; background: var(--bg); }
    .main::-webkit-scrollbar { width: 5px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
    .page { padding: 32px 38px; max-width: 1700px; }
    .page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .page-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .count-badge { padding: 3px 10px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--border2); font-family: var(--mono); font-size: 11px; color: var(--text-2); }
    .page-actions { margin-left: auto; display: flex; gap: 8px; }

    /* KPI */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; }
    .kpi-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-3); margin-bottom: 9px; }
    .kpi-value { font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: -0.5px; line-height: 1; }
    .kpi-sub { font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-top: 6px; }

    /* Charts */
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 16px; }
    .chart-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-3); margin-bottom: 16px; }
    .chart-wrap { position: relative; height: 240px; width: 100%; }
    .chart-wrap-sm { position: relative; height: 160px; width: 100%; }
    .chart-wrap-4x3 { position: relative; width: 100%; padding-bottom: 75%; }
    .chart-wrap-4x3 > canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; }
    .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* Buttons */
    button { cursor: pointer; font-family: var(--sans); }
    .btn-primary { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; background: var(--accent); color: #000; font-size: 13px; font-weight: 700; border: none; border-radius: var(--radius); transition: opacity 0.15s; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-secondary { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; border: 1px solid var(--border2); border-radius: var(--radius); transition: all 0.15s; }
    .btn-secondary:hover { border-color: var(--text-3); color: var(--text); }
    .btn-ghost { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: transparent; color: var(--text-3); font-size: 13px; font-weight: 500; border: none; border-radius: var(--radius); transition: color 0.15s; }
    .btn-ghost:hover { color: var(--text); }
    .btn-danger { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--red-dim); color: var(--red); font-size: 13px; font-weight: 500; border: 1px solid rgba(255,61,113,0.3); border-radius: var(--radius); transition: all 0.15s; }
    .btn-danger:hover { background: rgba(255,61,113,0.2); }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-3); transition: all 0.15s; }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .icon-btn.del:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }

    /* Toggle */
    .toggle-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .toggle-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text-3); font-size: 12px; font-weight: 600; transition: all 0.12s; }
    .toggle-btn:hover { border-color: var(--text-3); color: var(--text-2); }
    .toggle-btn.on-accent { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
    .toggle-btn.on-green { border-color: var(--green); background: var(--green-dim); color: var(--green); }
    .toggle-btn.on-red { border-color: var(--red); background: var(--red-dim); color: var(--red); }
    .toggle-btn.on-yellow { border-color: var(--yellow); background: rgba(255,215,64,0.1); color: var(--yellow); }
    .toggle-btn.on-orange { border-color: var(--orange); background: rgba(255,145,0,0.1); color: var(--orange); }

    /* Form */
    .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
    .form-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-3); }
    .form-group input, .form-group select {
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 9px 12px; color: var(--text); font-family: var(--mono); font-size: 13px;
      outline: none; transition: border-color 0.15s; width: 100%;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    .form-group input::placeholder { color: var(--text-3); }
    .form-group select { cursor: pointer; }
    .form-group select option { background: var(--surface2); }
    .form-section { margin-bottom: 20px; }
    .form-section > label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-3); margin-bottom: 10px; }

    /* Notes textarea */
    .notes-field {
      width: 100%; min-height: 130px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      line-height: 1.75;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      resize: vertical;
      letter-spacing: 0.01em;
    }
    .notes-field:focus { border-color: var(--accent); background: rgba(0,212,170,0.03); }
    .notes-field::placeholder { color: var(--text-3); font-style: italic; }

    /* Strategy textarea */
    .strategy-field {
      width: 100%; min-height: 400px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      line-height: 1.8;
      outline: none;
      transition: border-color 0.15s;
      resize: vertical;
    }
    .strategy-field:focus { border-color: var(--accent); }
    .strategy-field::placeholder { color: var(--text-3); font-style: italic; }

    .tag-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-2); font-size: 12px; font-weight: 500; transition: all 0.12s; }
    .tag-btn:hover { border-color: var(--border2); color: var(--text); }
    .tag-btn.tm { border-color: var(--red); background: var(--red-dim); color: var(--red); }
    .tag-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .form-actions { display: flex; gap: 10px; padding-top: 8px; }
    .auto-label { font-family: var(--mono); font-size: 10px; color: var(--accent); background: var(--accent-dim); padding: 1px 5px; border-radius: 4px; margin-left: 6px; }

    /* Setup badges */
    .setup-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 700; border: 1px solid; }

    /* Bias */
    .bias-toggle { display: flex; gap: 4px; }
    .bias-btn { flex: 1; padding: 7px 4px; border-radius: 6px; border: 1px solid var(--border2); background: transparent; font-size: 11px; font-weight: 600; color: var(--text-3); cursor: pointer; transition: all 0.12s; text-align: center; }

    /* TP table */
    .tp-section { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 20px; }
    .tp-header { display: grid; grid-template-columns: 40px 1fr 1fr 60px 44px; gap: 0; padding: 8px 12px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); }
    .tp-header span { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-3); }
    .tp-row { display: grid; grid-template-columns: 40px 1fr 1fr 60px 44px; gap: 0; padding: 6px 12px; border-bottom: 1px solid var(--border); align-items: center; }
    .tp-row:last-child { border-bottom: none; }
    .tp-label { font-family: var(--mono); font-size: 12px; color: var(--text-3); font-weight: 600; }
    .tp-rr { font-family: var(--mono); font-size: 11px; color: var(--accent); text-align: center; }
    .tp-input { background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 4px 6px; color: var(--text); font-family: var(--mono); font-size: 12px; outline: none; width: 100%; transition: border-color 0.12s; }
    .tp-input:focus { border-color: var(--accent); }
    .tp-input::placeholder { color: var(--text-3); }
    .tp-check { display: flex; align-items: center; justify-content: center; }
    .tp-check input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--green); }

    /* Safety protocol */
    .safety-box { background: rgba(255,215,64,0.06); border: 1px solid rgba(255,215,64,0.2); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px; }
    .safety-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .safety-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,215,64,0.15); }
    .safety-opt { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; }
    .safety-opt input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--yellow); cursor: pointer; }

    /* No-trade */
    .notrade-banner { background: rgba(0,212,170,0.07); border: 1px solid rgba(0,212,170,0.2); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--accent); font-weight: 600; }

    /* Table */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-bar select, .filter-bar input[type="date"] { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--text-2); font-family: var(--mono); font-size: 12px; outline: none; }
    .filter-bar select:focus, .filter-bar input:focus { border-color: var(--accent); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .trade-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .trade-table thead tr { background: var(--surface2); border-bottom: 1px solid var(--border); }
    .trade-table th { padding: 9px 11px; text-align: left; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-3); white-space: nowrap; cursor: pointer; user-select: none; }
    .trade-table th:hover { color: var(--text-2); }
    .trade-table td { padding: 8px 11px; border-bottom: 1px solid var(--border); font-family: var(--mono); color: var(--text-2); white-space: nowrap; }
    .trade-table tbody tr:last-child td { border-bottom: none; }
    .trade-table tbody tr:hover { background: var(--surface2); }
    .trade-table tbody tr.notrade-row td { opacity: 0.6; font-style: italic; }
    .table-footer { padding: 9px 14px; background: var(--surface); border: 1px solid var(--border); border-top: none; border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg); font-family: var(--mono); font-size: 11px; color: var(--text-3); }

    /* Badges */
    .inst-badge { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; background: rgba(0,212,170,0.1); color: var(--accent); border: 1px solid rgba(0,212,170,0.2); }
    .dir-badge { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; }
    .dir-badge.long { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,230,118,0.2); }
    .dir-badge.short { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255,61,113,0.2); }
    .result-badge { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; }
    .result-badge.win { background: var(--green-dim); color: var(--green); }
    .result-badge.loss { background: var(--red-dim); color: var(--red); }
    .result-badge.be { background: rgba(255,215,64,0.1); color: var(--yellow); }
    .result-badge.nt { background: rgba(0,212,170,0.08); color: var(--accent); }

    /* Colors */
    .c-green { color: var(--green) !important; }
    .c-red { color: var(--red) !important; }
    .c-acc { color: var(--accent) !important; }
    .c-muted { color: var(--text-3) !important; }
    .c-yellow { color: var(--yellow) !important; }

    /* Stats */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .stat-grid-full { grid-column: 1 / -1; }
    .stat-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; grid-column: 1 / -1; }
    .stat-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px 24px; }
    .stat-block h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-3); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .stat-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; }
    .stat-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-3); }
    .stat-table td { padding: 8px 8px; border-bottom: 1px solid var(--border); color: var(--text-2); }
    .stat-table tr:last-child td { border-bottom: none; }
    .stat-table td:first-child { color: var(--text-3); font-size: 12px; }
    .highlight-trade { background: var(--surface2); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 10px; }
    .highlight-label { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 5px; }
    .highlight-detail { font-family: var(--mono); font-size: 13px; color: var(--text-2); }

    /* Calendar */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .cal-nav-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .cal-monthly-total { font-family: var(--mono); font-size: 14px; font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-grid-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px; }
    .cal-day-header { text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-3); padding: 8px 0; }
    .cal-week-inline { font-family: var(--mono); font-size: 11px; font-weight: 700; margin-top: 5px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.1); }
    .cal-day { min-height: 110px; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 9px; position: relative; background: var(--surface); cursor: default; transition: border-color 0.15s; }
    .cal-day:hover { border-color: var(--border2); }
    .cal-day.empty { background: transparent; border-color: transparent; }
    .cal-day.weekend { background: rgba(0,0,0,0.2); }
    .cal-day.day-win { background: rgba(0,230,118,0.07); border-color: rgba(0,230,118,0.2); }
    .cal-day.day-loss { background: rgba(255,61,113,0.07); border-color: rgba(255,61,113,0.2); }
    .cal-day.day-be { background: rgba(255,215,64,0.07); border-color: rgba(255,215,64,0.2); }
    .cal-day.day-notrade { background: rgba(120,140,160,0.06); border-color: rgba(120,140,160,0.18); }
    .cal-day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .cal-date { font-size: 13px; font-weight: 700; color: var(--text-3); margin-bottom: 4px; }
    .cal-pnl { font-family: var(--mono); font-size: 13px; font-weight: 600; }
    .cal-meta { font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-top: 3px; }
    .cal-bias-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .cal-week-cell { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text-3); border: 1px solid transparent; }
    .cal-card-section { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); }

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── CONSTANTS ──────────────────────────────────────────────────────────────
const INSTRUMENTS = ['MNQ', 'MES', 'NQ', 'ES', 'SPX500', 'NAS100'];

// Default dollar-per-point values for common futures/CFDs

const BIAS_LABELS = { 1:'Bearish', 2:'Slightly Bearish', 3:'Neutral', 4:'Slightly Bullish', 5:'Bullish' };
const BIAS_COLORS = { 1:'#ff3d71', 2:'#ff9100', 3:'#7a93b0', 4:'#69f0ae', 5:'#00e676' };

  'A':  { color:'#69f0ae', bg:'rgba(105,240,174,0.10)', border:'rgba(105,240,174,0.35)' },

const MISTAKES = ['Nincs hiba','Korai belépés','Késői belépés','SL módosítás','BE kivétele','Rossz pozíció méret','Szabálysértés','Overtrade','Revenge trade','Re-entry'];

];
const HU_DAYS  = ['V','H','K','Sze','Cs','P','Szo'];

// ── SUPABASE CLOUD SYNC ───────────────────────────────────────────────────────
// ⚙️  Másold ide a saját Supabase adataidat (supabase.com → Project Settings → API):
const SB_KEY = ''; // DEV MODE — no auth, localStorage only

let _sb = null;
let _syncState = 'ok';
const _syncListeners = new Set();
let _syncQueue = {};
let _syncTimer = null;

const SB_URL = 'https://ictggxmwmghcnpgsyvzn.supabase.co';
const SB_URL_OVERRIDE_KEY = 'tj_sb_url';

function isSBConfigured() {
  return SB_KEY.startsWith('sb_publishable_') && SB_KEY.length > 30;
}
function getSBUrl() {
  return localStorage.getItem(SB_URL_OVERRIDE_KEY) || SB_URL;
}
function getSB() {
  if (!_sb && window.supabase && isSBConfigured()) {
    const url = getSBUrl();
    if (!url) return null;
    try {
      _sb = window.supabase.createClient(url, SB_KEY, {
        auth: { persistSession: true, storageKey: 'tj_sb_session' }
      });
    } catch(e) { console.warn('[TJ] Supabase init failed', e); return null; }
  }
  return _sb;
}
function _setSyncState(s) { _syncState = s; _syncListeners.forEach(fn => fn(s)); }
function onSyncChange(fn) {
  _syncListeners.add(fn);
  fn(_syncState);
  return () => _syncListeners.delete(fn);
}
const LS_KEY_MAP = {
  trades:'tj_v2', accounts:'tj_accounts', account:'tj_account',
  strategy:'tj_strategy', inst:'tj_inst',
  business:'tj_business', subscriptions:'tj_subscriptions',
};
async function _pushBatch(batch) {
  const sb = getSB(); if (!sb) { console.warn('[TJ] _pushBatch: no SB client'); return false; }
  let session;
  try {
    const { data } = await sb.auth.getSession();
    session = data?.session;
  } catch(e) { console.warn('[TJ] _pushBatch: getSession error', e); return false; }
  if (!session) { console.warn('[TJ] _pushBatch: no session – skip sync'); return false; }
  const rows = Object.entries(batch).map(([key,value])=>({
    user_id: session.user.id, key, value, updated_at: new Date().toISOString()
  }));
  const upsertPromise = sb.from('tj_data').upsert(rows, { onConflict:'user_id,key' });
  const timeoutPromise = new Promise((_, reject) =>
    setTimeout(() => reject(new Error('sync timeout after 10s')), 10000)
  );
  const { error } = await Promise.race([upsertPromise, timeoutPromise]);
  if (error) { console.warn('[TJ] _pushBatch: upsert error', error); throw error; }
  console.log('[TJ] _pushBatch: ok, rows:', rows.length);
  return true;
}
function queueSync(key, jsonValue) {
  if (!isSBConfigured()) return;
  _syncQueue[key] = jsonValue;
  clearTimeout(_syncTimer);
  if (!navigator.onLine) { _setSyncState('pending'); return; }
  _syncTimer = setTimeout(async () => {
    const batch = {..._syncQueue}; _syncQueue = {};
    _setSyncState('syncing');
    try {
      await _pushBatch(batch);
      _setSyncState('ok');
    }
    catch(e) { console.warn('[TJ] sync error', e); _setSyncState('error'); }
  }, 1500);
}
async function pullFromCloud() {
  const sb = getSB(); if (!sb) return false;
  let session;
  try {
    const { data } = await sb.auth.getSession();
    session = data?.session;
  } catch(e) { return false; }
  if (!session) return false;
  const { data, error } = await sb.from('tj_data').select('key,value').eq('user_id', session.user.id);
  if (error) return false;
  // Cloud üres, de lokálisan van adat → feltöltjük az összes kulcsot
  if (!data || !data.length) {
    const batch = {};
    Object.entries(LS_KEY_MAP).forEach(([syncKey, lsKey]) => {
      const val = localStorage.getItem(lsKey);
      if (val) batch[syncKey] = val;
    });
    if (Object.keys(batch).length) {
      console.log('[TJ] cloud üres – lokális adatok feltöltése...', Object.keys(batch));
      try { await _pushBatch(batch); _setSyncState('ok'); console.log('[TJ] kezdeti feltöltés kész'); }
      catch(e) { console.warn('[TJ] kezdeti feltöltés hiba', e); _setSyncState('error'); }
    }
    return false;
  }
  // Cloud-ban van adat – lokálisan hiányzó kulcsok feltöltése
  const cloudKeys = new Set(data.map(r => r.key));
  const missingBatch = {};
  Object.entries(LS_KEY_MAP).forEach(([syncKey, lsKey]) => {
    if (!cloudKeys.has(syncKey)) {
      const val = localStorage.getItem(lsKey);
      if (val) missingBatch[syncKey] = val;
    }
  });
  if (Object.keys(missingBatch).length) {
    console.log('[TJ] hiányzó cloud kulcsok feltöltése:', Object.keys(missingBatch));
    try { await _pushBatch(missingBatch); } catch(e) {}
  }
  let changed = false;
  data.forEach(({ key, value }) => {
    const lsKey = LS_KEY_MAP[key];
    if (lsKey && localStorage.getItem(lsKey) !== value) {
      localStorage.setItem(lsKey, value);
      changed = true;
    }
  });
  return changed;
}
async function deleteCloudData() {
  const sb = getSB(); if (!sb) return;
  try {
    const { data } = await sb.auth.getSession();
    if (!data?.session) return;
    await sb.from('tj_data').delete().eq('user_id', data.session.user.id);
  } catch(e) { console.warn('[TJ] deleteCloudData error', e); }
}
window.addEventListener('online', () => {
  if (Object.keys(_syncQueue).length > 0) {
    clearTimeout(_syncTimer);
    _syncTimer = setTimeout(async () => {
      const batch = {..._syncQueue}; _syncQueue = {};
      _setSyncState('syncing');
      try { await _pushBatch(batch); _setSyncState('ok'); }
      catch(e) { console.warn('[TJ] sync error (reconnect)', e); _setSyncState('error'); }
    }, 500);
  } else {
    _setSyncState('ok');
  }
});
window.addEventListener('offline', () => {
  _setSyncState(Object.keys(_syncQueue).length > 0 ? 'pending' : 'offline');
});

// ── UTILS ──────────────────────────────────────────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const loadTrades    = () => { try { return JSON.parse(localStorage.getItem('tj_v2') || '[]'); } catch { return []; } };
const saveTrades    = (t) => { const v=JSON.stringify(t); localStorage.setItem('tj_v2',v); queueSync('trades',v); };
const loadStrategy  = () => localStorage.getItem('tj_strategy') || '';
const saveStrategy  = (s) => { localStorage.setItem('tj_strategy',s); queueSync('strategy',s); };
const loadAccount   = () => { try { return JSON.parse(localStorage.getItem('tj_account') || '{}'); } catch { return {}; } };
const saveAccount   = (a) => { const v=JSON.stringify(a); localStorage.setItem('tj_account',v); queueSync('account',v); };
const loadAccounts  = () => { try { return JSON.parse(localStorage.getItem('tj_accounts') || '[]'); } catch { return []; } };
const saveAccounts  = (a) => { const v=JSON.stringify(a); localStorage.setItem('tj_accounts',v); queueSync('accounts',v); };
// Payouts are stored inside the account object: account.payouts = [{id,date,amount,note}]
const saveAccountPayouts = (accountId, payouts) => {
  const list = loadAccounts().map(a => a.id === accountId ? {...a, payouts} : a);
  saveAccounts(list);
};
const loadInstSettings  = () => { try { return JSON.parse(localStorage.getItem('tj_inst') || '{}'); } catch { return {}; } };
const saveInstSettings  = (s) => { const v=JSON.stringify(s); localStorage.setItem('tj_inst',v); queueSync('inst',v); };
const getPointValue     = (inst) => {
  const custom = loadInstSettings();
  const v = custom[inst];
  return (v !== undefined && v !== '') ? parseFloat(v)||0 : (POINT_VALUES_DEFAULT[inst] || 0);
};
const n    = (v, d=2) => (parseFloat(v)||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pnlFmt = (v) => { const x=parseFloat(v)||0; return (x>=0?'+':'')+n(x,2); };
const setupStyle = (cls) => SETUP_STYLE[cls] || SETUP_STYLE['A'];
// Returns the "effective" P&L for a trade:
// if any accountPositions have a pnl value, sum those; otherwise use global pnl
const effectiveTradePnL = (t) => {
  const withPnl = (t.accountPositions||[]).filter(p => p.pnl !== '' && p.pnl !== null && p.pnl !== undefined && !isNaN(parseFloat(p.pnl)));
  if (withPnl.length > 0) return withPnl.reduce((s,p) => s + (parseFloat(p.pnl)||0), 0);
  return parseFloat(t.pnl)||0;
};

function getISOWeek(dateStr) {
  const d = new Date(dateStr);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const ys = new Date(d.getFullYear(),0,1);
  const wk = Math.ceil(((d-ys)/86400000+1)/7);
  return `${d.getFullYear()}-W${wk}`;
}


function recalcFromTP(trade) {
  const ep = parseFloat(trade.entryPrice);
  const sl = parseFloat(trade.stopLoss);
  if (!ep || !sl || ep === sl) return trade;
  const riskPerUnit = Math.abs(ep - sl);
  const filled = (trade.tpLevels||[]).filter(tp => tp.price && tp.contracts && parseFloat(tp.price) && parseFloat(tp.contracts));
  const totalContracts = filled.reduce((s,tp) => s + parseFloat(tp.contracts), 0);
  if (!filled.length || !totalContracts) return trade;
  const plannedReward = filled.reduce((s,tp) => s + Math.abs(parseFloat(tp.price)-ep)*parseFloat(tp.contracts), 0);
  const plannedRR = (plannedReward / (riskPerUnit * totalContracts)).toFixed(2);
  const hitTPs = filled.filter(tp => tp.hit);
  let actualRR = trade.actualRR;
  if (hitTPs.length > 0) {
    const actualReward = hitTPs.reduce((s,tp) => s + Math.abs(parseFloat(tp.price)-ep)*parseFloat(tp.contracts), 0);
    actualRR = (actualReward / (riskPerUnit * totalContracts)).toFixed(2);
  }
  return { ...trade, plannedRR, actualRR };
}

// ── STATS ENGINE ───────────────────────────────────────────────────────────
function calcStats(trades, startingCapital = 0) {
  const real = trades.filter(t => !t.isNoTrade);
  if (!real.length) return null;
  const sorted = [...real].sort((a,b) => {
    const da = a.date + 'T' + (a.exitTime||a.entryTime||'00:00');
    const db = b.date + 'T' + (b.exitTime||b.entryTime||'00:00');
    return da.localeCompare(db);
  });
  const total  = sorted.length;
  const wins   = sorted.filter(t => t.result==='Win');
  const losses = sorted.filter(t => t.result==='Loss');
  const bes    = sorted.filter(t => t.result==='BE');
  const decisive = wins.length + losses.length;
  const winRate  = decisive > 0 ? wins.length / decisive * 100 : 0;   // excl BE, all trades
  const winChance= total > 0 ? wins.length / total * 100 : 0;          // incl BE
  const totalPnL = sorted.reduce((s,t) => s+(parseFloat(t.pnl)||0), 0);

  // Clean = no rule break
  const ruleBreakCount = sorted.filter(t => t.isRuleBreak).length;
  const clean = sorted.filter(t => !t.isRuleBreak);
  const cleanWins   = clean.filter(t => t.result==='Win');
  const cleanLosses = clean.filter(t => t.result==='Loss');
  const cleanDecisive = cleanWins.length + cleanLosses.length;
  const cleanWinRate  = cleanDecisive > 0 ? cleanWins.length / cleanDecisive * 100 : 0;

  // P&L stats from clean trades only
  const grossProfit = cleanWins.reduce((s,t) => s+(parseFloat(t.pnl)||0), 0);
  const grossLoss   = Math.abs(cleanLosses.reduce((s,t) => s+(parseFloat(t.pnl)||0), 0));
  const profitFactor= grossLoss>0 ? grossProfit/grossLoss : grossProfit>0 ? Infinity : 0;
  const avgWin  = cleanWins.length>0 ? grossProfit/cleanWins.length : 0;
  const avgLoss = cleanLosses.length>0 ? grossLoss/cleanLosses.length : 0;
  // Actual RR: csak clean Win trade-ek (BE = 0R, Loss = -1R → nem torzítja a stratégia átlagos RR-jét)
  const cleanBes = clean.filter(t => t.result==='BE');
  const rrVals  = cleanWins.filter(t=>t.actualRR && parseFloat(t.actualRR)>0).map(t=>parseFloat(t.actualRR));
  const avgRR   = rrVals.length>0 ? rrVals.reduce((s,v)=>s+v,0)/rrVals.length : 0;
  // Expectancy per trade including BE (BE contributes $0, so expectancy = pWin*avgWin - pLoss*avgLoss)
  const cleanTotal = cleanDecisive + cleanBes.length;
  const pWin  = cleanTotal > 0 ? cleanWins.length / cleanTotal : 0;
  const pLoss = cleanTotal > 0 ? cleanLosses.length / cleanTotal : 0;
  const expectancy = pWin * avgWin - pLoss * avgLoss;

  // Daily aggregation
  const dailyMap = {};
  sorted.forEach(t => {
    if (!dailyMap[t.date]) dailyMap[t.date] = 0;
    dailyMap[t.date] += parseFloat(t.pnl)||0;
  });
  const dailyDates = Object.keys(dailyMap).sort();
  const sc = parseFloat(startingCapital) || 0;
  let eq = sc, peak = sc, maxDD = 0, maxDDpct = 0;
  const equityCurve = dailyDates.map(date => {
    eq += dailyMap[date];
    if (eq > peak) peak = eq;
    const dd = peak > 0 ? (peak - eq) / peak * 100 : 0;
    if (peak - eq > maxDD) maxDD = peak - eq;
    if (dd > maxDDpct) maxDDpct = dd;
    return { label:date.slice(5), equity:Math.round(eq*100)/100, dd, fullDate:date };
  });
  const currentEquity = sc + totalPnL;
  const totalReturnPct = sc > 0 ? (totalPnL / sc) * 100 : 0;

  const tradingDays = dailyDates.length;
  const dailyAvg = tradingDays>0 ? totalPnL/tradingDays : 0;

  const weeklyMap = {};
  dailyDates.forEach(d => { const wk=getISOWeek(d); if(!weeklyMap[wk]) weeklyMap[wk]=0; weeklyMap[wk]+=dailyMap[d]; });
  const weeklyVals = Object.values(weeklyMap);
  const weeklyAvg  = weeklyVals.length>0 ? weeklyVals.reduce((s,v)=>s+v,0)/weeklyVals.length : 0;

  const monthlyMap = {};
  dailyDates.forEach(d => { const mk=d.slice(0,7); if(!monthlyMap[mk]) monthlyMap[mk]=0; monthlyMap[mk]+=dailyMap[d]; });
  const monthlyVals = Object.values(monthlyMap);
  const monthlyAvg  = monthlyVals.length>0 ? monthlyVals.reduce((s,v)=>s+v,0)/monthlyVals.length : 0;

  // By setup
  const bySetup = SETUPS.map(cls => {
    const sub = sorted.filter(t=>t.setupClass===cls);
    if (!sub.length) return null;
    const sw = sub.filter(t=>t.result==='Win');
    const sl = sub.filter(t=>t.result==='Loss');
    const gp = sw.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
    const gl = Math.abs(sl.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0));
    const dec= sw.length+sl.length;
    const planRRs = sub.filter(t=>t.plannedRR).map(t=>parseFloat(t.plannedRR));
    const actRRs  = sw.filter(t=>t.actualRR).map(t=>parseFloat(t.actualRR));
    const sbe = sub.filter(t=>t.result==='BE');
    return { class:cls, total:sub.length, wins:sw.length, losses:sl.length, bes:sbe.length,
      winRate:dec>0?(sw.length/dec*100).toFixed(1):0,
      pf:gl>0?(gp/gl).toFixed(2):'∞',
      avgPlanRR: planRRs.length>0 ? planRRs.reduce((s,v)=>s+v,0)/planRRs.length : null,
      avgActRR:  actRRs.length>0  ? actRRs.reduce((s,v)=>s+v,0)/actRRs.length   : null };
  }).filter(Boolean);

  const byInst = INSTRUMENTS.map(inst => {
    const sub = sorted.filter(t=>t.instrument===inst);
    if (!sub.length) return null;
    const sw = sub.filter(t=>t.result==='Win');
    const sl = sub.filter(t=>t.result==='Loss');
    const sbe2 = sub.filter(t=>t.result==='BE');
    const dec= sw.length+sl.length;
    const sp = sub.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
    return { instrument:inst, total:sub.length, wins:sw.length, losses:sl.length, bes:sbe2.length,
      winRate:dec>0?(sw.length/dec*100).toFixed(1):0, pnl:sp.toFixed(0) };
  }).filter(Boolean);

  const dayNames=['Vasárnap','Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat'];
  const byDay = [1,2,3,4,5].map(di => {
    const sub = sorted.filter(t=>new Date(t.date).getDay()===di);
    const sw = sub.filter(t=>t.result==='Win');
    const sl = sub.filter(t=>t.result==='Loss');
    const sbe3 = sub.filter(t=>t.result==='BE');
    const dec= sw.length+sl.length;
    const planRRs2 = sub.filter(t=>t.plannedRR).map(t=>parseFloat(t.plannedRR));
    const actRRs2  = sw.filter(t=>t.actualRR).map(t=>parseFloat(t.actualRR));
    return { day:dayNames[di], total:sub.length, wins:sw.length, losses:sl.length, bes:sbe3.length,
      winRate:dec>0?(sw.length/dec*100).toFixed(1):0,
      avgPlanRR: planRRs2.length>0 ? planRRs2.reduce((s,v)=>s+v,0)/planRRs2.length : null,
      avgActRR:  actRRs2.length>0  ? actRRs2.reduce((s,v)=>s+v,0)/actRRs2.length   : null };
  });

  const rev=[...sorted].reverse();
  let streakN=0, streakT='';
  for (const t of rev) {
    if (t.result==='BE') continue;
    if (!streakT) { streakT=t.result; streakN=1; }
    else if (t.result===streakT) streakN++;
    else break;
  }
  const best  = sorted.reduce((b,t)=>(!b||(parseFloat(t.pnl)>parseFloat(b.pnl)))?t:b,null);
  const worst = sorted.reduce((w,t)=>(!w||(parseFloat(t.pnl)<parseFloat(w.pnl)))?t:w,null);

  return {
    total, wins:wins.length, losses:losses.length, bes:bes.length,
    winRate, cleanWinRate, ruleBreakCount,
    cleanWins:cleanWins.length, cleanLosses:cleanLosses.length,
    winChance, totalPnL, grossProfit, grossLoss, profitFactor,
    avgRR, avgWin, avgLoss, maxDD, maxDDpct, equityCurve,
    bySetup, byInst, byDay,
    streakN, streakT, best, worst, expectancy,
    dailyAvg, weeklyAvg, monthlyAvg, tradingDays,
    currentEquity, startingCapital: sc, totalReturnPct
  };
}

// ── CHARTS ──────────────────────────────────────────────────────────────────
function EquityChart({ data, goal, compact, startingCapital, maxDailyLoss, maxTotalLoss }) {
  const ref = useRef(null);
  const chart = useRef(null);
  useEffect(() => {
    if (!ref.current || !data?.length) return;
    if (chart.current) chart.current.destroy();
    const ctx = ref.current.getContext('2d');
    const g = ctx.createLinearGradient(0,0,0,200);
    g.addColorStop(0,'rgba(0,212,170,0.22)'); g.addColorStop(1,'rgba(0,212,170,0.0)');
    const vals = data.map(d=>d.equity);
    const goalVal    = goal ? parseFloat(goal) : null;
    const maxDailyVal = maxDailyLoss ? parseFloat(maxDailyLoss) : null;
    const mllVal      = maxTotalLoss ? parseFloat(maxTotalLoss) : null;
    const sc = parseFloat(startingCapital) || 0;
    // Trailing MLL floor: follows equity peak, only moves up
    const trailingMLL = mllVal ? data.map((d,i) => {
      let peak = sc;
      for (let j = 0; j <= i; j++) peak = Math.max(peak, data[j].equity);
      return peak - mllVal;
    }) : null;
    // Daily loss floor: each day's floor = previous close - maxDailyLoss
    const dailyFloor = maxDailyVal ? data.map((d,i) => {
      const prevEq = i===0 ? sc : data[i-1].equity;
      return prevEq - maxDailyVal;
    }) : null;

    const allVals = [...vals];
    if (goalVal)     allVals.push(goalVal);
    if (trailingMLL) allVals.push(...trailingMLL);
    if (dailyFloor)  allVals.push(...dailyFloor);
    const minV = Math.min(...allVals);
    const maxV = Math.max(...allVals);
    const pad  = Math.max((maxV-minV)*0.1, 100);

    const datasets = [
      { data:vals, borderColor:'#00d4aa', backgroundColor:g, borderWidth:2,
        pointRadius:data.length>30?0:3, pointHoverRadius:5, fill:true, tension:0.08, label:'Equity' }
    ];
    if (goalVal) {
      datasets.push({
        data: data.map(()=>goalVal),
        borderColor:'rgba(100,200,255,0.85)', backgroundColor:'transparent',
        borderWidth:1.5, borderDash:[6,4], pointRadius:0, fill:false, tension:0, label:'Cél'
      });
    }
    if (trailingMLL) {
      datasets.push({
        data: trailingMLL,
        borderColor:'rgba(255,61,113,0.75)', backgroundColor:'transparent',
        borderWidth:1.5, borderDash:[8,4], pointRadius:0, fill:false, tension:0, label:'MLL (trailing)'
      });
    }
    if (dailyFloor) {
      datasets.push({
        data: dailyFloor,
        borderColor:'rgba(255,152,0,0.7)', backgroundColor:'transparent',
        borderWidth:1.5, borderDash:[4,4], pointRadius:0, fill:false, tension:0, label:'Napi limit'
      });
    }

    const hasLegend = !!(goalVal || trailingMLL || dailyFloor);
    chart.current = new Chart(ctx, {
      type:'line',
      data:{ labels:data.map(d=>d.label), datasets },
      options:{
        responsive:true, maintainAspectRatio:false,
        animation:false,
        plugins:{
          legend:{ display:hasLegend, labels:{color:'#7a93b0',font:{size:11,family:"'IBM Plex Mono'"},boxWidth:24} },
          tooltip:{ backgroundColor:'#0d1520', borderColor:'#1a2535', borderWidth:1,
            titleColor:'#7a93b0', bodyColor:'#dce8f5', callbacks:{ label:c=>' $'+n(c.raw,2) }}
        },
        scales:{
          x:{ display:false },
          y:{ min:minV-pad, max:maxV+pad, grid:{color:'#1a2535'}, border:{display:false},
            ticks:{ color:'#3d5470', font:{family:"'IBM Plex Mono'",size:10}, callback:v=>'$'+n(v,0) }}
        },
        interaction:{intersect:false, mode:'index'}
      }
    });
    return ()=>{ if(chart.current) chart.current.destroy(); };
  }, [data, goal, startingCapital, maxDailyLoss, maxTotalLoss]);
  if (compact) {
    return (
      <div style={{maxWidth:560, margin:'0 auto'}}>
        <div className="chart-wrap-4x3"><canvas ref={ref}/></div>
      </div>
    );
  }
  return <div className="chart-wrap"><canvas ref={ref}/></div>;
}

        plugins:{ legend:{labels:{color:'#3d5470',font:{size:10,family:"'IBM Plex Mono'"}}},
          tooltip:{backgroundColor:'#0d1520',borderColor:'#1a2535',borderWidth:1,bodyColor:'#dce8f5'}},
        scales:{
          x:{ grid:{display:false}, ticks:{color:'#7a93b0'}, border:{display:false} },
          y:{ position:'left', grid:{color:'#1a2535'}, ticks:{color:'#3d5470',callback:v=>v+'%'}, border:{display:false}, min:0, max:100 },
          y1:{ position:'right', grid:{display:false}, ticks:{color:'#3d5470',callback:v=>v+'R'}, border:{display:false}, min:0 }
        }
      }
    });
    return ()=>{ if(chart.current) chart.current.destroy(); };
  }, [data]);
  return <div className="chart-wrap" style={{height:190}}><canvas ref={ref}/></div>;
}

function DayChart({ data }) {
  const ref = useRef(null); const chart = useRef(null);
  useEffect(() => {
    if (!ref.current || !data?.length) return;
    if (chart.current) chart.current.destroy();
    chart.current = new Chart(ref.current.getContext('2d'), {
      type:'bar',
      data:{ labels:data.map(d=>d.day.slice(0,3)),
        datasets:[{ data:data.map(d=>parseFloat(d.pnl)),
          backgroundColor:data.map(d=>parseFloat(d.pnl)>=0?'rgba(0,230,118,0.7)':'rgba(255,61,113,0.65)'),
          borderRadius:4 }]},
      options:{
        responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{display:false}, tooltip:{ backgroundColor:'#0d1520', borderColor:'#1a2535', borderWidth:1,
          bodyColor:'#dce8f5', callbacks:{label:c=>` $${n(c.raw,2)}`}}},
        scales:{
          x:{ grid:{display:false}, ticks:{color:'#7a93b0'}, border:{display:false} },
          y:{ grid:{color:'#1a2535'}, ticks:{color:'#3d5470',callback:v=>'$'+n(v,0)}, border:{display:false} }
        }
      }
    });
    return ()=>{ if(chart.current) chart.current.destroy(); };
  }, [data]);
  return <div className="chart-wrap" style={{height:190}}><canvas ref={ref}/></div>;
}

// ── DASHBOARD ───────────────────────────────────────────────────────────────
function Dashboard({ trades, goal, startingCapital, maxDailyLoss, maxTotalLoss, onGoToStats }) {
  const sc = parseFloat(startingCapital) || 0;
  const [dashFrom, setDashFrom] = useState(() => localStorage.getItem('tj_dash_from') || '');
  const [dashTo,   setDashTo]   = useState(() => localStorage.getItem('tj_dash_to')   || '');

  useEffect(() => { localStorage.setItem('tj_dash_from', dashFrom); }, [dashFrom]);
  useEffect(() => { localStorage.setItem('tj_dash_to',   dashTo);   }, [dashTo]);

  // Apply date range filter
  const filteredTrades = useMemo(() => {
    if (!dashFrom && !dashTo) return trades;
    return trades.filter(t => (!dashFrom || t.date >= dashFrom) && (!dashTo || t.date <= dashTo));
  }, [trades, dashFrom, dashTo]);
  const isFiltered = !!(dashFrom || dashTo);

  // stats = filtered trades → win rate, RR, streak, expectancy, setup breakdown
  const stats = useMemo(()=>calcStats(filteredTrades, sc),[filteredTrades, sc]);
  const allAccounts = useMemo(() => loadAccounts().filter(a => a.status === 'active'), []);
  const acctProgress = useMemo(() =>
    allAccounts.map(acct => ({ acct, p: calcAccountProgress(filteredTrades, acct) }))
  , [allAccounts, filteredTrades]);

  // Funded + live trades only (P&L replaced with per-account values)
  const flAcctIds = useMemo(() =>
    new Set(loadAccounts().filter(a => a.type==='funded' || a.type==='live').map(a=>a.id))
  , []);
  const flTrades = useMemo(() =>
    filteredTrades.filter(t=>!t.isNoTrade).reduce((acc,t) => {
      const flPos = (t.accountPositions||[]).filter(p=>flAcctIds.has(p.accountId));
      if (!flPos.length) return acc;
      const pnl = flPos.reduce((s,p)=>s+(p.pnl!==undefined&&p.pnl!==''?parseFloat(p.pnl)||0:parseFloat(t.pnl)||0),0);
      acc.push({...t, pnl:String(pnl)});
      return acc;
    }, [])
  , [filteredTrades, flAcctIds]);
  // eqStats = funded+live only → for Total P&L, equity curve, drawdown, daily/weekly avg
  const eqStats = useMemo(()=>calcStats(flTrades, sc),[flTrades, sc]);

  if (!stats) return (
    <div className="page"><div className="empty">
      <div className="empty-icon">📊</div>
      <h3>Nincsenek trade-ek</h3>
      <p>Rögzítsd az első trade-et, hogy megjelenjenek a statisztikák.</p>
    </div></div>
  );
  const flPf = eqStats ? (eqStats.profitFactor===Infinity?'∞':n(eqStats.profitFactor)) : '–';
  return (
    <div className="page">
      <div className="page-header">
        <h1 className="page-title">Dashboard</h1>
        <span className="count-badge">{stats.total} trade · {stats.tradingDays} nap</span>
      </div>
      {/* Date range filter */}
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 14px',marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:8}}>Időszak</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:8}}>
          {[
            {label:'7 nap',   days:7},  {label:'14 nap', days:14},
            {label:'30 nap',  days:30}, {label:'90 nap',  days:90},
            {label:'180 nap', days:180},{label:'Összes',  days:0},
          ].map(({label,days})=>{
            const from = days>0 ? new Date(Date.now()-days*86400000).toISOString().split('T')[0] : '';
            const active = dashFrom===from && dashTo==='';
            return (
              <button key={label} onClick={()=>{setDashFrom(from);setDashTo('');}}
                style={{padding:'4px 10px',borderRadius:6,border:'none',cursor:'pointer',fontSize:11,fontWeight:600,
                  background:active?'var(--accent)':'var(--surface2)',
                  color:active?'#000':'var(--text-3)'}}>

        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:8}}>
          <input type="date" value={dashFrom} onChange={e=>{setDashFrom(e.target.value);}}

              padding:'4px 8px',color:'var(--text)',fontSize:12,fontFamily:'var(--mono)',flex:'1 1 120px',minWidth:0}}/>
          <span style={{color:'var(--text-3)',fontSize:11}}>→</span>
          <input type="date" value={dashTo} onChange={e=>{setDashTo(e.target.value);}}
