          </div>
        )}
        {isChallenge && (
          <div className="form-group">
            <label>Consistency rule (max % egy napból) <span style={{fontSize:10,color:'var(--text-3)'}}>0 = nincs</span></label>
            <input type="number" min="0" max="100" step="1" value={f.consistencyRule} onChange={e=>s('consistencyRule',e.target.value)}
              placeholder="30"/>
          </div>
        )}
        {!isChallenge && !isLive && (
          <div className="form-group">
            <label>Min. napi nyereség qualifying naphoz ($) <span style={{fontSize:10,color:'var(--text-3)'}}>0 = csak pozitív nap kell</span></label>
            <input type="number" min="0" step="0.01" value={f.minDailyProfit} onChange={e=>s('minDailyProfit',e.target.value)}
              placeholder="200.00"/>
          </div>
        )}
        {/* Live account extra risk management rules */}
        {isLive && (<>
          <div className="form-group">
            <label>Max. kockázat trade-enként (%) <span style={{fontSize:10,color:'var(--text-3)'}}>a tőke %-ában · 0 = nincs</span></label>
            <input type="number" min="0" max="100" step="0.1" value={f.maxRiskPerTrade||''} onChange={e=>s('maxRiskPerTrade',e.target.value)}
              placeholder="1.0"/>
          </div>
          <div className="form-group">
            <label>Max. trade / nap <span style={{fontSize:10,color:'var(--text-3)'}}>0 = nincs limit</span></label>
            <input type="number" min="0" step="1" value={f.maxTradesPerDay||''} onChange={e=>s('maxTradesPerDay',e.target.value)}
              placeholder="3"/>
          </div>
          <div className="form-group">
            <label>Heti veszteség limit ($) <span style={{fontSize:10,color:'var(--text-3)'}}>0 = nincs</span></label>
            <input type="number" step="0.01" value={f.weeklyLossLimit||''} onChange={e=>s('weeklyLossLimit',e.target.value)}
              placeholder="2000.00"/>
          </div>
        </>)}
      </div>

      {/* Funded: payout rules */}
      {!isChallenge && !isLive && (
        <>
          <div style={{gridColumn:'1/-1',fontSize:12,fontWeight:700,color:'rgba(100,200,255,0.9)',
            borderBottom:'1px solid var(--border)',paddingBottom:6,marginBottom:4}}>
            💰 Kifizetési Szabályok
          </div>
          <div className="form-group">
            <label>Min. qualifying napok száma (kifizetéshez)</label>
            <input type="number" min="1" step="1" value={f.payMinDays||''} onChange={e=>s('payMinDays',e.target.value)} placeholder="5"/>
          </div>
          <div className="form-group">
            <label>Kifizetési időköz (napok)</label>
            <input type="number" min="1" step="1" value={f.payIntervalDays||''} onChange={e=>s('payIntervalDays',e.target.value)} placeholder="14"/>
          </div>
          <div className="form-group">
            <label>Min. kifizetés ($)</label>
            <input type="number" min="0" step="0.01" value={f.payMinAmount||''} onChange={e=>s('payMinAmount',e.target.value)} placeholder="200"/>
          </div>
          <div className="form-group">
            <label>Max. kifizetés ($)</label>
            <input type="number" min="0" step="0.01" value={f.payMaxAmount||''} onChange={e=>s('payMaxAmount',e.target.value)} placeholder="1500"/>
          </div>
          <div className="form-group">
            <label>Consistency limit (max nap % az össz profitból)</label>
            <input type="number" min="0" max="100" step="1" value={f.payConsistencyPct||''} onChange={e=>s('payConsistencyPct',e.target.value)} placeholder="40"/>
          </div>
        </>
      )}
      <div className="form-group" style={{marginBottom:14}}>
        <label>Megjegyzés</label>
        <input type="text" value={f.notes} onChange={e=>s('notes',e.target.value)}
          placeholder="opcionális megjegyzés..."/>
      </div>

      <div style={{display:'flex',gap:10}}>
        <button className="btn-primary" onClick={()=>onSave(f)}>
          {initial ? '✓ Mentés' : '+ Hozzáadás'}
        </button>
        <button onClick={onCancel} style={{background:'transparent',border:'1px solid var(--border)',
          borderRadius:8,padding:'8px 18px',color:'var(--text-2)',cursor:'pointer',fontSize:13}}>
          Mégse
        </button>
      </div>
    </div>
  );
}

function AccountEntriesSection({ trades, showToast }) {
  const [accounts, setAccountsState] = useState(loadAccounts);
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [filter, setFilter] = useState('all'); // 'all' | 'challenge' | 'funded' | 'live'

  const save = (list) => { saveAccounts(list); setAccountsState(list); };

  const onSave = (entry) => {
    const list = accounts.find(a=>a.id===entry.id)
      ? accounts.map(a=>a.id===entry.id?entry:a)
      : [...accounts, entry];
    save(list);
    setEditing(null);
    setShowForm(false);
    showToast('✓ Mentve');
  };
  const onDelete = (id) => {
    if (!window.confirm('Biztosan törlöd?')) return;
    save(accounts.filter(a=>a.id!==id));
    showToast('Törölve');
  };

  const filtered   = filter==='all' ? accounts : accounts.filter(a=>a.type===filter);
  const challenges = accounts.filter(a=>a.type==='challenge');
  const funded     = accounts.filter(a=>a.type==='funded');
  const live       = accounts.filter(a=>a.type==='live');

  return (<>
    <div className="section-divider"><span>Számlák – Challenge / Funded / Live</span></div>

    {/* Filter + Add button */}
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
      <div style={{display:'flex',gap:6}}>
        {[['all','Összes'],['challenge','Challenge'],['funded','Funded'],['live','Live']].map(([v,l])=>{
          const cnt = v==='all'?accounts.length:v==='challenge'?challenges.length:v==='funded'?funded.length:live.length;
          return (
            <button key={v} onClick={()=>setFilter(v)}
              style={{padding:'5px 13px',borderRadius:6,fontSize:12,cursor:'pointer',fontWeight:600,
                background: filter===v ? 'var(--accent)' : 'transparent',
                border: filter===v ? '1px solid var(--accent)' : '1px solid var(--border)',
                color: filter===v ? '#000' : 'var(--text-2)'}}>
              {l} ({cnt})
            </button>
          );
        })}
      </div>
      <button className="btn-primary" onClick={()=>setShowForm(true)}>
        + Új hozzáadása
      </button>
    </div>

    {/* Add / Edit modal */}
    {(showForm || editing) && (
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:500,
        display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}}
        onClick={e=>{if(e.target===e.currentTarget){setShowForm(false);setEditing(null);}}}>
        <div style={{background:'var(--surface)',borderRadius:16,border:'1px solid var(--border)',
          width:'100%',maxWidth:680,maxHeight:'90vh',overflowY:'auto',position:'relative'}}>
          <button onClick={()=>{setShowForm(false);setEditing(null);}}
            style={{position:'absolute',top:14,right:14,zIndex:1,background:'var(--surface2)',
              border:'none',borderRadius:7,width:32,height:32,cursor:'pointer',
              color:'var(--text-2)',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
          <AccountEntryForm
            initial={editing||null}
            onSave={onSave}
            onCancel={()=>{setShowForm(false);setEditing(null);}}/>
        </div>
      </div>
    )}

    {/* Active account cards – 2 per row */}
    {(() => {
      const activeAccounts   = filtered.filter(a => a.status === 'active');
      const inactiveAccounts = filtered.filter(a => a.status !== 'active');

      return (<>
        {activeAccounts.length === 0 && !showForm && (
          <div style={{textAlign:'center',padding:'28px 0',color:'var(--text-3)',fontFamily:'var(--mono)',fontSize:12,
            border:'1px dashed var(--border)',borderRadius:10,marginBottom:14}}>
            {filter==='all' ? 'Nincs aktív számla.' :
             filter==='challenge' ? 'Nincs aktív challenge.' :
             filter==='funded' ? 'Nincs aktív funded számla.' : 'Nincs aktív live számla.'}
          </div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:14,marginBottom:inactiveAccounts.length?24:0}}>
          {activeAccounts.map(account=>(
            editing?.id === account.id ? null : (
              <AccountEntryCard
                key={account.id}
                account={account}
                trades={trades}
                onEdit={()=>{ setEditing(account); setShowForm(false); }}
                onDelete={()=>onDelete(account.id)}
                onPayoutSaved={()=>{ const list=loadAccounts(); save(list); }}/>
            )
          ))}
        </div>

        {/* Inactive accounts (bukott / teljesített) – compact table */}
        {inactiveAccounts.length > 0 && (
          <div style={{marginTop:8}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',
              color:'var(--text-3)',marginBottom:10}}>
              Inaktív számlák ({inactiveAccounts.length})
            </div>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{borderBottom:'1px solid var(--border)'}}>
                  <th style={{textAlign:'left',padding:'6px 10px',color:'var(--text-3)',fontWeight:600,fontSize:11}}>Számla</th>
                  <th style={{textAlign:'left',padding:'6px 10px',color:'var(--text-3)',fontWeight:600,fontSize:11}}>Típus</th>
                  <th style={{textAlign:'left',padding:'6px 10px',color:'var(--text-3)',fontWeight:600,fontSize:11}}>Állapot</th>
                  <th style={{textAlign:'right',padding:'6px 10px',color:'var(--text-3)',fontWeight:600,fontSize:11}}>Tőke</th>
                  <th style={{textAlign:'left',padding:'6px 10px',color:'var(--text-3)',fontWeight:600,fontSize:11}}>Kezdés</th>
                  <th style={{textAlign:'right',padding:'6px 10px',color:'var(--text-3)',fontWeight:600,fontSize:11}}>P&L</th>
                  <th style={{textAlign:'right',padding:'6px 10px',color:'var(--text-3)',fontWeight:600,fontSize:11}}></th>
                </tr>
              </thead>
              <tbody>
                {inactiveAccounts.map(account => {
                  const tColor = account.type==='challenge'?'var(--accent)':account.type==='funded'?'rgba(100,200,255,0.8)':'rgba(180,130,255,0.8)';
                  const tLabel = account.type==='challenge'?'Challenge':account.type==='funded'?'Funded':'Live';
                  const sColor = account.status==='passed'?'var(--green)':'var(--red)';
                  const sLabel = account.status==='passed'?'✓ Teljesítve':'✗ Bukott';
                  const p = calcAccountProgress(trades, account);
                  const pnlVal = p.currentEquity - p.sc;
                  return (
                    <tr key={account.id} style={{borderBottom:'1px solid rgba(255,255,255,0.04)',
                      background: editing?.id===account.id ? 'rgba(255,255,255,0.03)' : 'transparent'}}>
                      <td style={{padding:'8px 10px',fontWeight:600,color:'var(--text)'}}>{account.name}</td>
                      <td style={{padding:'8px 10px'}}><span style={{fontSize:10,fontWeight:700,color:tColor}}>{tLabel}</span></td>
                      <td style={{padding:'8px 10px'}}><span style={{fontSize:10,fontWeight:700,color:sColor}}>{sLabel}</span></td>
                      <td style={{padding:'8px 10px',textAlign:'right',fontFamily:'var(--mono)',color:'var(--text-2)'}}>
                        ${n(parseFloat(account.startCapital)||0,0)}
                      </td>
                      <td style={{padding:'8px 10px',color:'var(--text-3)',fontSize:11}}>
                        {account.startDate||'–'}
                      </td>
                      <td style={{padding:'8px 10px',textAlign:'right',fontFamily:'var(--mono)',fontWeight:700,
                        color:pnlVal>=0?'var(--green)':'var(--red)'}}>
                        {pnlVal>=0?'+':''}{pnlFmt(pnlVal)}
                      </td>
                      <td style={{padding:'8px 10px',textAlign:'right'}}>
                        <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                          <button className="icon-btn" title="Szerkesztés"
                            onClick={()=>{ setEditing(account); setShowForm(false); }}>{Ico.edit}</button>
                          <button className="icon-btn" title="Törlés"
                            onClick={()=>onDelete(account.id)} style={{color:'var(--red)'}}>{Ico.trash}</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </>);
    })()}
  </>);
}

function InstSettings({ showToast }) {
  const [vals, setVals] = useState(() => loadInstSettings());
  const [saved, setSaved] = useState(true);

  const setV = (inst, v) => { setVals(p=>({...p,[inst]:v})); setSaved(false); };
  const handleSave = () => { saveInstSettings(vals); setSaved(true); if(showToast) showToast('✓ Instrument beállítások mentve'); };
  const handleReset = (inst) => { setVals(p=>{ const n={...p}; delete n[inst]; return n; }); setSaved(false); };

  return (
    <div style={{marginBottom:28}}>
      <div style={{fontSize:12,color:'var(--text-3)',fontFamily:'var(--mono)',marginBottom:12}}>
        Add meg az egyes instrumentek dollár/pont értékét. Ha üresen hagyod, az alapértelmezett értéket használja.
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:10,marginBottom:14}}>
        {INSTRUMENTS.map(inst => {
          const def = POINT_VALUES_DEFAULT[inst];
          const cur = vals[inst];
          return (
            <div key={inst} style={{background:'var(--surface2)',border:'1px solid var(--border)',
              borderRadius:8,padding:'10px 12px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <span style={{fontFamily:'var(--mono)',fontWeight:700,fontSize:13,color:'var(--text)'}}>{inst}</span>
                {cur !== undefined && cur !== '' && (
                  <button onClick={()=>handleReset(inst)}
                    style={{fontSize:10,color:'var(--text-3)',background:'transparent',border:'none',cursor:'pointer',padding:'1px 4px'}}>
                    ↩ reset
                  </button>
                )}
              </div>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <span style={{fontSize:11,color:'var(--text-3)',fontFamily:'var(--mono)'}}>$</span>
                <input type="number" step="0.01" min="0"
                  value={cur !== undefined ? cur : ''}
                  onChange={e=>setV(inst,e.target.value)}
                  placeholder={def ? String(def) : '0.00'}
                  style={{flex:1,background:'var(--surface)',border:'1px solid var(--border)',
                    borderRadius:6,padding:'6px 8px',color:'var(--text)',fontFamily:'var(--mono)',fontSize:13,
                    outline:'none',width:'100%'}}/>
                <span style={{fontSize:10,color:'var(--text-3)',whiteSpace:'nowrap'}}>/pont</span>
              </div>
              {def && (
                <div style={{fontSize:10,color:'var(--text-3)',fontFamily:'var(--mono)',marginTop:4}}>
                  Alapért.: ${n(def,2)}/pont
                </div>
              )}
            </div>
          );
        })}
      </div>
      <button className="btn-primary" onClick={handleSave}>
        {Ico.save} {saved ? 'Mentve ✓' : 'Mentés'}
      </button>
      {!saved && <span style={{marginLeft:12,fontFamily:'var(--mono)',fontSize:12,color:'var(--yellow)'}}>● Nem mentett változás</span>}
    </div>
  );
}

function AccountPage({ trades, showToast }) {
  const [acct, setAcct] = useState(()=>({
    startingCapital:'', goalBalance:'',
    payoutRules: false, minProfitDays:'', minDailyProfit:'',
    ...loadAccount()
  }));
  const [strategy, setStrategy] = useState(loadStrategy);
  const [stratSaved, setStratSaved] = useState(true);
  const [acctSaved, setAcctSaved] = useState(true);

  const setA = (k,v) => { setAcct(p=>({...p,[k]:v})); setAcctSaved(false); };
  const saveAcct = () => { saveAccount(acct); setAcctSaved(true); showToast('✓ Fiók beállítások mentve'); };
  const saveStrat = () => { saveStrategy(strategy); setStratSaved(true); showToast('✓ Stratégia mentve'); };

  const sc                = parseFloat(acct.startingCapital) || 0;
  const goal              = parseFloat(acct.goalBalance) || 0;
  const minDays           = parseInt(acct.minProfitDays) || 0;
  const minDaily          = parseFloat(acct.minDailyProfit) || 0;
  const payoutStartDate   = acct.payoutStartDate || '';
  const payoutTargetBal   = parseFloat(acct.payoutTargetBalance) || 0;
  const stats      = useMemo(()=>calcStats(trades, sc), [trades, sc]);
  const currentEquity = stats ? stats.currentEquity : sc;
  const earned     = currentEquity - sc;
  const needed     = goal > 0 ? goal - currentEquity : 0;
  const progress   = goal > sc ? Math.min(100, Math.max(0, (currentEquity - sc) / (goal - sc) * 100)) : 0;
  const goalReached = goal > 0 && currentEquity >= goal;

  // Payout qualifying days
  const qualDays = useMemo(()=>{
    const byDate = {};
    trades
      .filter(t=>!t.isNoTrade && (!payoutStartDate || t.date >= payoutStartDate))
      .forEach(t=>{
        byDate[t.date] = (byDate[t.date]||0) + (parseFloat(t.pnl)||0);
      });
    return Object.entries(byDate)
      .map(([date, pnl])=>({ date, pnl }))
      .filter(d => d.pnl > 0 && (minDaily === 0 || d.pnl >= minDaily))
      .sort((a,b)=>a.date.localeCompare(b.date));
  }, [trades, minDaily, payoutStartDate]);

  const daysProgress = minDays > 0 ? Math.min(100, qualDays.length / minDays * 100) : 0;
  const daysReached  = minDays > 0 && qualDays.length >= minDays;

  const fmtDateShort = (d) => new Date(d+'T12:00:00').toLocaleDateString('hu-HU',{month:'short',day:'numeric'});

  const ProgBar = ({pct, reached, color='var(--accent)'}) => (
    <div style={{position:'relative',height:24,background:'var(--surface2)',borderRadius:7,border:'1px solid var(--border)',overflow:'hidden',marginBottom:8}}>
      <div style={{position:'absolute',left:0,top:0,height:'100%',width:`${pct}%`,
        background: reached ? 'linear-gradient(90deg,#00e676,#00d4aa)' : `linear-gradient(90deg,${color},#00d4aa)`,
        borderRadius:7,transition:'width 0.4s ease',minWidth:pct>0?6:0}}/>
      {pct>6 && pct<94 && (
        <div style={{position:'absolute',left:`${pct}%`,top:'50%',transform:'translate(-50%,-50%)',
          fontFamily:'var(--mono)',fontSize:11,fontWeight:700,color:'#000',
          background:'var(--accent)',padding:'1px 6px',borderRadius:4,whiteSpace:'nowrap'}}>
          {pct.toFixed(1)}%
        </div>
      )}
    </div>
  );

  const StatBox = ({label, value, color='var(--text)', sub}) => (
    <div style={{background:'var(--surface2)',borderRadius:8,padding:'12px 14px',border:'1px solid var(--border)'}}>
      <div style={{fontSize:10,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:5}}>{label}</div>
      <div style={{fontFamily:'var(--mono)',fontSize:18,fontWeight:700,color}}>{value}</div>
      {sub && <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text-3)',marginTop:3}}>{sub}</div>}
    </div>
  );

  return (
    <div className="page">
      <div className="page-header"><h1 className="page-title">Fiók & Stratégia</h1></div>

      {/* ── ACCOUNT SETTINGS ── */}
      <div className="section-divider"><span>Fiók Beállítások</span></div>
      <div className="form-grid-2" style={{marginBottom:8}}>
        <div className="form-group">
          <label>Indulótőke ($)</label>
          <input type="number" step="0.01" value={acct.startingCapital}
            onChange={e=>setA('startingCapital',e.target.value)} placeholder="50000.00"/>
        </div>
        <div className="form-group">
          <label>Cél Egyenleg ($) <span style={{fontSize:10,color:'var(--text-3)',fontWeight:400}}>(payout / challenge cél)</span></label>
          <input type="number" step="0.01" value={acct.goalBalance}
            onChange={e=>setA('goalBalance',e.target.value)} placeholder="54000.00"/>
        </div>
        <div className="form-group">
          <label>
            Max. össz. veszteség ($)
            <span style={{fontSize:10,color:'rgba(255,61,113,0.8)',fontWeight:400,marginLeft:6}}>— piros vonal az equity görbén</span>
          </label>
          <input type="number" step="0.01" min="0" value={acct.maxTotalLoss||''}
            onChange={e=>setA('maxTotalLoss',e.target.value)} placeholder="2500.00"/>
        </div>
        <div className="form-group">
          <label>
            Max. napi veszteség ($)
            <span style={{fontSize:10,color:'rgba(255,152,0,0.85)',fontWeight:400,marginLeft:6}}>— narancssárga vonal az equity görbén</span>
          </label>
          <input type="number" step="0.01" min="0" value={acct.maxDailyLoss||''}
            onChange={e=>setA('maxDailyLoss',e.target.value)} placeholder="1000.00"/>
        </div>
      </div>



      <div style={{marginBottom:28}}>
        <button className="btn-primary" onClick={saveAcct}>
          {Ico.save} {acctSaved?'Mentve ✓':'Mentés'}
        </button>
        {!acctSaved && <span style={{marginLeft:12,fontFamily:'var(--mono)',fontSize:12,color:'var(--yellow)'}}>● Nem mentett változás</span>}
      </div>

      {/* ── INSTRUMENT SETTINGS ── */}
      <div className="section-divider"><span>Instrument Beállítások (Dollar / pont)</span></div>
      <InstSettings showToast={showToast}/>

      {/* ── BALANCE GOAL PROGRESS ── */}
      {sc > 0 && goal > 0 && (
        <>
          <div className="section-divider"><span>Egyenleg Cél – Előrehaladás</span></div>
          <div className="stat-block" style={{marginBottom:24}}>
            <div style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--text-3)',marginBottom:8,display:'flex',justifyContent:'space-between'}}>
              <span>Indulótőke: <strong style={{color:'var(--text-2)'}}>${n(sc,2)}</strong></span>
              <span>Cél: <strong style={{color:'var(--yellow)'}}>${n(goal,2)}</strong></span>
            </div>
            <ProgBar pct={progress} reached={goalReached}/>
            <div className="acct-progress-grid" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginTop:14}}>
              <StatBox label="Jelenlegi" value={`$${n(currentEquity,2)}`} color={currentEquity>=sc?'var(--green)':'var(--red)'}/>
              <StatBox label="Nyereség"  value={pnlFmt(earned)} color={earned>=0?'var(--green)':'var(--red)'}/>
              <StatBox label="Hátralévő"
                value={goalReached ? '✓ Elérve!' : `-$${n(needed,2)}`}
                color={goalReached?'var(--green)':'var(--yellow)'}/>
              <StatBox label="Hozam %"
                value={(sc>0?(earned/sc*100).toFixed(2):'0.00')+'%'}
                color={earned>=0?'var(--green)':'var(--red)'}/>
            </div>
          </div>
        </>
      )}


      {/* ── CHALLENGES & FUNDED ACCOUNTS ── */}
      <AccountEntriesSection trades={trades} showToast={showToast}/>

      {/* ── STRATEGY ── */}
      <div className="section-divider"><span>Trading Stratégia</span></div>
      <div style={{marginBottom:10,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--text-3)'}}>
          A stratégiádat ide rögzítheted. Az Excel exportban külön munkalapként szerepel.
          {!stratSaved && <span style={{color:'var(--yellow)',marginLeft:12}}>● Nem mentett változás</span>}
        </div>
        <button className="btn-primary" onClick={saveStrat}>
          {Ico.save} {stratSaved?'Mentve ✓':'Mentés'}
        </button>
      </div>
      <textarea className="strategy-field"
        value={strategy}
        onChange={e=>{ setStrategy(e.target.value); setStratSaved(false); }}
        placeholder={`Trading Stratégia Leírása\n\nPl:\n- Setup definíciók (A+, A, B, C, D osztályok)\n- Belépési feltételek\n- SL és TP szabályok\n- Kockázatkezelés\n- Safety protocol feltételei\n- Milyen napokon nem tradeelek\n- Mentális szabályok...`}
      />
      <div style={{marginTop:8,fontFamily:'var(--mono)',fontSize:11,color:'var(--text-3)'}}>
        {strategy.length} karakter · {strategy.split('\n').length} sor
      </div>

      {/* ── RESET ── */}
      <div style={{marginTop:40,paddingTop:24,borderTop:'1px solid rgba(255,61,113,0.2)'}}>
        <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',color:'rgba(255,61,113,0.5)',marginBottom:10}}>Veszélyzóna</div>
        <ResetSection showToast={showToast}/>
      </div>
    </div>
  );
}

function ResetSection({ showToast }) {
  const [step, setStep] = React.useState(0); // 0=idle, 1=first confirm, 2=second confirm
  const handleReset = async () => {
    localStorage.removeItem('tj_v2');
    localStorage.removeItem('tj_account');
    localStorage.removeItem('tj_accounts');
    localStorage.removeItem('tj_strategy');
    localStorage.removeItem('tj_inst');
    localStorage.removeItem('tj_business');
    localStorage.removeItem('tj_subscriptions');
    localStorage.setItem('tj_noseed', '1');
    try { await deleteCloudData(); } catch(e) { console.warn('[TJ] deleteCloudData error', e); }
    showToast('✓ Minden adat törölve (helyi + felhő) – oldal újratöltés...');
    setTimeout(() => window.location.reload(), 1500);
  };
  if (step === 0) return (
    <button onClick={()=>setStep(1)} style={{
      padding:'8px 18px',borderRadius:7,border:'1px solid rgba(255,61,113,0.4)',
      background:'rgba(255,61,113,0.08)',color:'var(--red)',fontWeight:700,
      fontSize:13,cursor:'pointer',letterSpacing:'0.3px'
    }}>🗑 Összes adat törlése</button>
  );
  if (step === 1) return (
    <div style={{background:'rgba(255,61,113,0.08)',border:'1px solid rgba(255,61,113,0.35)',borderRadius:10,padding:'16px 20px',maxWidth:480}}>
      <div style={{fontWeight:700,color:'var(--red)',marginBottom:8}}>⚠ Biztosan törlöd az összes adatot?</div>
      <div style={{fontSize:12,color:'var(--text-2)',marginBottom:14}}>Ez véglegesen törli az összes rögzített trade-et, számlákat, beállításokat és stratégiát. Ez a művelet nem vonható vissza.</div>
      <div style={{display:'flex',gap:10}}>
        <button onClick={()=>setStep(2)} style={{padding:'7px 16px',borderRadius:6,border:'none',background:'rgba(255,61,113,0.25)',color:'var(--red)',fontWeight:700,fontSize:12,cursor:'pointer'}}>Igen, törlöm</button>
        <button onClick={()=>setStep(0)} style={{padding:'7px 16px',borderRadius:6,border:'1px solid var(--border)',background:'var(--surface2)',color:'var(--text-2)',fontWeight:600,fontSize:12,cursor:'pointer'}}>Mégsem</button>
      </div>
    </div>
  );
  return (
    <div style={{background:'rgba(255,61,113,0.12)',border:'2px solid rgba(255,61,113,0.6)',borderRadius:10,padding:'16px 20px',maxWidth:480}}>
      <div style={{fontWeight:700,color:'var(--red)',fontSize:14,marginBottom:8}}>🚨 UTOLSÓ FIGYELMEZTETÉS</div>
      <div style={{fontSize:12,color:'var(--text-2)',marginBottom:14}}>Ez az utolsó lehetőség a visszalépésre. Az összes trade, számla és beállítás <strong>véglegesen</strong> törlésre kerül.</div>
      <div style={{display:'flex',gap:10}}>
        <button onClick={handleReset} style={{padding:'7px 16px',borderRadius:6,border:'none',background:'var(--red)',color:'#fff',fontWeight:700,fontSize:12,cursor:'pointer'}}>🗑 IGEN, VÉGLEGESEN TÖRLÖM</button>
        <button onClick={()=>setStep(0)} style={{padding:'7px 16px',borderRadius:6,border:'1px solid var(--border)',background:'var(--surface2)',color:'var(--text-2)',fontWeight:600,fontSize:12,cursor:'pointer'}}>Mégsem</button>
      </div>
    </div>
  );
}

// ── PAYOUT TRACKER ────────────────────────────────────────────────────────────
function PayoutTracker({ trades }) {
  const accounts = useMemo(()=>loadAccounts(),[]);
  const fundedAccts = useMemo(()=>accounts.filter(a=>a.type==='funded'),[accounts]);

  // Aggregate all payouts across funded accounts
  const allPayouts = useMemo(()=>{
    const arr = [];
    fundedAccts.forEach(acct=>{
      (acct.payouts||[]).forEach(py=>{
        arr.push({...py, amount:parseFloat(py.amount)||0, accountId:acct.id, accountName:acct.name});
      });
    });
    return arr.filter(p=>p.amount>0&&p.date).sort((a,b)=>a.date.localeCompare(b.date));
  },[fundedAccts]);

  // Monthly payout aggregation
  const monthlyPayouts = useMemo(()=>{
    const map = {};
    allPayouts.forEach(p=>{
      const m = p.date.slice(0,7);
      if (!map[m]) map[m] = { total:0, byAccount:{} };
      map[m].total += p.amount;
      map[m].byAccount[p.accountName] = (map[m].byAccount[p.accountName]||0) + p.amount;
    });
    return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0])).map(([m,v])=>({month:m,...v}));
  },[allPayouts]);

  // Monthly trading P&L (funded accounts only, from dailyArr)
  const monthlyPnL = useMemo(()=>{
    const map = {};
    fundedAccts.forEach(acct=>{
      const p = calcAccountProgress(trades, acct);
      p.dailyArr.forEach(d=>{
        const m = d.date.slice(0,7);
        map[m] = (map[m]||0) + d.pnl;
      });
    });
    return map;
  },[fundedAccts, trades]);

  const totalPayouts = allPayouts.reduce((s,p)=>s+p.amount,0);
  const chartRef = useRef(null);
  const chartInst = useRef(null);

  useEffect(()=>{
    if (!chartRef.current || !monthlyPayouts.length) return;
    if (chartInst.current) chartInst.current.destroy();
    const labels = monthlyPayouts.map(m=>{
      const [y,mo] = m.month.split('-');
      return `${HU_MONTHS[parseInt(mo)-1]?.slice(0,3)} ${y.slice(2)}`;
    });
    chartInst.current = new Chart(chartRef.current.getContext('2d'),{
      type:'bar',
      data:{
        labels,
        datasets:[
          { label:'Kifizetés ($)', data:monthlyPayouts.map(m=>m.total),
            backgroundColor:'rgba(60,160,255,0.5)', borderColor:'rgba(60,160,255,0.9)',
            borderWidth:1.5, borderRadius:4 },
          { label:'Trading P&L ($)', data:monthlyPayouts.map(m=>monthlyPnL[m.month]||0),
            backgroundColor:'rgba(0,212,170,0.35)', borderColor:'rgba(0,212,170,0.8)',
            borderWidth:1.5, borderRadius:4, type:'bar' },
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{legend:{labels:{color:'rgba(255,255,255,0.6)',font:{size:11}}},
          tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: $${n(ctx.parsed.y,2)}`}}},
        scales:{
          x:{ticks:{color:'rgba(255,255,255,0.5)',font:{size:11}},grid:{color:'rgba(255,255,255,0.04)'}},
          y:{ticks:{color:'rgba(255,255,255,0.5)',font:{size:11},callback:v=>`$${n(v,0)}`},grid:{color:'rgba(255,255,255,0.06)'}},
        }
      }
    });
    return ()=>{ if(chartInst.current){chartInst.current.destroy();chartInst.current=null;}};
  },[monthlyPayouts, monthlyPnL]);

  return (
    <div className="page">
      <div className="page-header">
        <h1 className="page-title">💰 Kifizetések</h1>
        <span className="count-badge">{allPayouts.length} kifizetés · ${n(totalPayouts,2)} összesen</span>
      </div>

      {allPayouts.length === 0 ? (
        <div className="empty"><div className="empty-icon">💰</div><h3>Még nincs rögzített kifizetés</h3><p>A kifizetéseket a Fiók oldalon lehet rögzíteni.</p></div>
      ) : (<>
        {/* KPI row */}
        <div className="kpi-grid" style={{marginBottom:16}}>
          <div className="kpi"><div className="kpi-label">Összes kifizetés</div><div className="kpi-value" style={{color:'rgba(60,160,255,0.9)'}}>${n(totalPayouts,2)}</div></div>
          <div className="kpi"><div className="kpi-label">Kifizetési alkalmak</div><div className="kpi-value">{allPayouts.length}</div></div>
          <div className="kpi"><div className="kpi-label">Átlag kifizetés</div><div className="kpi-value">${n(totalPayouts/allPayouts.length,2)}</div></div>
          <div className="kpi"><div className="kpi-label">Számlák száma</div><div className="kpi-value">{fundedAccts.filter(a=>(a.payouts||[]).length>0).length}</div></div>
        </div>

        {/* Bar chart */}
        {monthlyPayouts.length > 0 && (
          <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,padding:'16px 18px',marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--text-3)',marginBottom:12}}>Havi Kifizetések vs. Trading P&L</div>
            <div style={{height:220}}><canvas ref={chartRef}/></div>
          </div>
        )}

        {/* Monthly breakdown */}
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,padding:'16px 18px',marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--text-3)',marginBottom:12}}>Havi Bontás</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {monthlyPayouts.map(m=>{
              const [my,mm] = m.month.split('-');
              const label = `${HU_MONTHS[parseInt(mm)-1]?.slice(0,3)} ${my}`;
              return (
                <div key={m.month} style={{background:'rgba(60,160,255,0.07)',border:'1px solid rgba(60,160,255,0.25)',borderRadius:8,padding:'10px 14px',minWidth:120}}>
                  <div style={{fontSize:10,color:'var(--text-3)',fontWeight:600,marginBottom:4}}>{label}</div>
                  <div style={{fontFamily:'var(--mono)',fontSize:14,fontWeight:700,color:'rgba(60,160,255,0.9)',marginBottom:4}}>${n(m.total,2)}</div>
                  {Object.entries(m.byAccount).map(([name,amt])=>(
                    <div key={name} style={{fontSize:10,color:'var(--text-3)',fontFamily:'var(--mono)'}}>{name.length>12?name.slice(0,12)+'…':name}: ${n(amt,2)}</div>
                  ))}
                </div>
              );
            })}
          </div>
        </div>

        {/* Per-account payout table */}
        {fundedAccts.filter(a=>(a.payouts||[]).length>0).map(acct=>(
          <div key={acct.id} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,padding:'14px 18px',marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:700,color:'rgba(100,200,255,0.9)',marginBottom:10}}>{acct.name}</div>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead><tr style={{color:'var(--text-3)',fontFamily:'var(--mono)',fontSize:11}}>
                <th style={{textAlign:'left',paddingBottom:6,fontWeight:600}}>Dátum</th>
                <th style={{textAlign:'right',paddingBottom:6,fontWeight:600}}>Összeg</th>
                <th style={{textAlign:'left',paddingBottom:6,fontWeight:600,paddingLeft:12}}>Megjegyzés</th>
              </tr></thead>
              <tbody>
                {(acct.payouts||[]).filter(p=>p.amount>0).sort((a,b)=>a.date.localeCompare(b.date)).map(py=>(
                  <tr key={py.id} style={{borderTop:'1px solid var(--border)'}}>
                    <td style={{padding:'6px 0',fontFamily:'var(--mono)',color:'var(--text-2)'}}>{py.date}</td>
                    <td style={{textAlign:'right',fontFamily:'var(--mono)',fontWeight:700,color:'rgba(60,160,255,0.9)',padding:'6px 0'}}>${n(parseFloat(py.amount),2)}</td>
                    <td style={{padding:'6px 0',paddingLeft:12,color:'var(--text-3)',fontSize:11}}>{py.note||'–'}</td>
                  </tr>
                ))}
                <tr style={{borderTop:'2px solid var(--border2)'}}>
                  <td style={{padding:'6px 0',fontWeight:700,color:'var(--text)'}}>Összesen</td>
                  <td style={{textAlign:'right',fontFamily:'var(--mono)',fontWeight:700,color:'rgba(60,160,255,0.9)',padding:'6px 0'}}>
                    ${n((acct.payouts||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0),2)}
                  </td>
                  <td/>
                </tr>
              </tbody>
            </table>
          </div>
        ))}
      </>)}
    </div>
  );
}

// ── BUSINESS TRACKER ─────────────────────────────────────────────────────────
const BIZ_KEY  = 'tj_business';
const SUB_KEY  = 'tj_subscriptions';
const BIZ_CATS = ['Challenge vásárlás','Activation fee','Kifizetés kapott','Egyéb kiadás','Egyéb bevétel'];
const BIZ_CAT_TYPES = {
  'Challenge vásárlás':'expense','Activation fee':'expense',
  'Kifizetés kapott':'income','Egyéb kiadás':'expense','Egyéb bevétel':'income'
};
const SUB_CYCLES = ['Havi','Heti','Kétheti','Negyedéves','Éves','Egyszeri'];

function loadBizEntries()  { try { return JSON.parse(localStorage.getItem(BIZ_KEY)||'[]'); }  catch{return [];} }
function saveBizEntries(a) { const v=JSON.stringify(a); localStorage.setItem(BIZ_KEY,v); queueSync('business',v); }
function loadSubs()        { try { return JSON.parse(localStorage.getItem(SUB_KEY)||'[]'); }  catch{return [];} }
function saveSubs(a)       { const v=JSON.stringify(a); localStorage.setItem(SUB_KEY,v); queueSync('subscriptions',v); }

function BusinessTracker({ showToast }) {
  const [entries, setEntries]     = useState(()=>loadBizEntries());
  const [subs,    setSubs]        = useState(()=>loadSubs());
  const [showForm,  setShowForm]  = useState(false);
  const [showSubForm, setShowSubForm] = useState(false);
  const [editId,   setEditId]     = useState(null);
  const [editSubId, setEditSubId] = useState(null);
  const [form,    setForm]        = useState({ date:new Date().toISOString().split('T')[0], category:'Challenge vásárlás', amount:'', note:'' });
  const [subForm, setSubForm]     = useState({ name:'', amount:'', cycle:'Havi', active:true, note:'' });
  const chartRef2  = useRef(null);
  const chartInst2 = useRef(null);

  // ── entries CRUD ──
  const saveEntry = () => {
    if (!form.date || !form.amount) { alert('Dátum és összeg kötelező.'); return; }
    const amt = parseFloat(form.amount);
    if (isNaN(amt) || amt <= 0) { alert('Érvényes összeget adj meg.'); return; }
    let updated = editId
      ? entries.map(e=>e.id===editId?{...e,...form,amount:amt}:e)
      : [...entries, {id:uid(),...form,amount:amt}];
    updated.sort((a,b)=>a.date.localeCompare(b.date));
    saveBizEntries(updated); setEntries(updated);
    setShowForm(false); setEditId(null);
    setForm({date:new Date().toISOString().split('T')[0],category:'Challenge vásárlás',amount:'',note:''});
    showToast('✓ Bejegyzés mentve');
  };
  const delEntry = id=>{ if(!confirm('Törlöd?')) return; const u=entries.filter(e=>e.id!==id); saveBizEntries(u); setEntries(u); showToast('✓ Törölve'); };
  const editEntry = e=>{ setEditId(e.id); setForm({date:e.date,category:e.category,amount:String(e.amount),note:e.note||''}); setShowForm(true); setShowSubForm(false); };

  // ── subscriptions CRUD ──
  const saveSub = () => {
    if (!subForm.name || !subForm.amount) { alert('Név és összeg kötelező.'); return; }
    const amt = parseFloat(subForm.amount);
    if (isNaN(amt) || amt <= 0) { alert('Érvényes összeget adj meg.'); return; }
    let updated = editSubId
      ? subs.map(s=>s.id===editSubId?{...s,...subForm,amount:amt}:s)
      : [...subs, {id:uid(),...subForm,amount:amt}];
    saveSubs(updated); setSubs(updated);
    setShowSubForm(false); setEditSubId(null);
    setSubForm({name:'',amount:'',cycle:'Havi',active:true,note:''});
    showToast('✓ Előfizetés mentve');
  };
  const delSub  = id=>{ if(!confirm('Törlöd?')) return; const u=subs.filter(s=>s.id!==id); saveSubs(u); setSubs(u); showToast('✓ Törölve'); };
  const editSub = s=>{ setEditSubId(s.id); setSubForm({name:s.name,amount:String(s.amount),cycle:s.cycle,active:s.active,note:s.note||''}); setShowSubForm(true); setShowForm(false); };
  const toggleSubActive = id=>{ const u=subs.map(s=>s.id===id?{...s,active:!s.active}:s); saveSubs(u); setSubs(u); };

  const totalIncome  = entries.filter(e=>BIZ_CAT_TYPES[e.category]==='income').reduce((s,e)=>s+e.amount,0);
  const totalExpense = entries.filter(e=>BIZ_CAT_TYPES[e.category]==='expense').reduce((s,e)=>s+e.amount,0);
  const netResult    = totalIncome - totalExpense;
  const monthlySubCost = subs.filter(s=>s.active).reduce((sum,s)=>{
    const m = {Havi:1,Heti:4.33,Kétheti:2.17,Negyedéves:1/3,Éves:1/12,Egyszeri:0}[s.cycle]||1;
    return sum + s.amount * m;
  }, 0);

  // ── Equity curve (cumulative net profit) ──
  const equityCurve = useMemo(()=>{
    const sorted = [...entries].sort((a,b)=>a.date.localeCompare(b.date));
    let running = 0;
    return sorted.map(e=>{
      const isInc = BIZ_CAT_TYPES[e.category]==='income';
      running += isInc ? e.amount : -e.amount;
      return { label: e.date.slice(5).replace('-','.'), net: Math.round(running*100)/100 };
    });
  },[entries]);

  useEffect(()=>{
    if (!chartRef2.current || !equityCurve.length) return;
    if (chartInst2.current) chartInst2.current.destroy();
    const ctx = chartRef2.current.getContext('2d');
    const last = equityCurve[equityCurve.length-1]?.net ?? 0;
    const color = last >= 0 ? '#00d4aa' : '#ff3d71';
    const g = ctx.createLinearGradient(0,0,0,220);
    g.addColorStop(0, last>=0?'rgba(0,212,170,0.25)':'rgba(255,61,113,0.2)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    chartInst2.current = new Chart(ctx, {
      type:'line',
      data:{
        labels: equityCurve.map(p=>p.label),
        datasets:[{
          label:'Nettó eredmény ($)',
          data: equityCurve.map(p=>p.net),
          borderColor: color, backgroundColor: g,
          borderWidth:2, pointRadius:equityCurve.length>40?0:3,
          pointHoverRadius:5, fill:true, tension:0.08,
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:ctx=>`Nettó: $${n(ctx.parsed.y,2)}`}},
        },
        scales:{
          x:{ticks:{color:'rgba(255,255,255,0.4)',font:{size:10},maxTicksLimit:12},grid:{color:'rgba(255,255,255,0.04)'}},
          y:{ticks:{color:'rgba(255,255,255,0.5)',font:{size:11},callback:v=>`$${n(v,0)}`},grid:{color:'rgba(255,255,255,0.06)'}},
        }
      }
    });
    return ()=>{ if(chartInst2.current){chartInst2.current.destroy();chartInst2.current=null;} };
  },[equityCurve]);

  return (
    <div className="page">
      <div className="page-header">
        <h1 className="page-title">💼 Üzleti Tracker</h1>
        <div className="page-actions" style={{display:'flex',gap:8}}>
          <button className="btn-secondary" onClick={()=>{ setEditSubId(null); setSubForm({name:'',amount:'',cycle:'Havi',active:true,note:''}); setShowSubForm(v=>!v); setShowForm(false); }}>+ Előfizetés</button>
          <button className="btn-primary"   onClick={()=>{ setEditId(null); setForm({date:new Date().toISOString().split('T')[0],category:'Challenge vásárlás',amount:'',note:''}); setShowForm(v=>!v); setShowSubForm(false); }}>+ Tranzakció</button>
        </div>
      </div>

      {/* KPI */}
      <div className="kpi-grid" style={{marginBottom:16}}>
        <div className="kpi"><div className="kpi-label">Összes bevétel</div><div className="kpi-value" style={{color:'var(--green)'}}>${n(totalIncome,2)}</div></div>
        <div className="kpi"><div className="kpi-label">Összes kiadás</div><div className="kpi-value" style={{color:'var(--red)'}}>${n(totalExpense,2)}</div></div>
        <div className="kpi"><div className="kpi-label">Nettó eredmény</div><div className="kpi-value" style={{color:netResult>=0?'var(--green)':'var(--red)'}}>{netResult>=0?'+':''}{n(netResult,2)}</div></div>
        <div className="kpi"><div className="kpi-label">Havi előf. költ.</div><div className="kpi-value" style={{color:'var(--yellow)'}}>${n(monthlySubCost,2)}</div></div>
      </div>

      {/* Transaction modal */}
      {showForm && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:500,
          display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}}
          onClick={e=>{if(e.target===e.currentTarget){setShowForm(false);setEditId(null);}}}>
          <div style={{background:'var(--surface)',borderRadius:16,border:'1px solid var(--border)',
            width:'100%',maxWidth:480,maxHeight:'90vh',overflowY:'auto',position:'relative',padding:'28px 24px'}}>
            <button onClick={()=>{setShowForm(false);setEditId(null);}}
              style={{position:'absolute',top:14,right:14,background:'var(--surface2)',
                border:'none',borderRadius:7,width:32,height:32,cursor:'pointer',
                color:'var(--text-2)',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            <div style={{fontSize:16,fontWeight:700,marginBottom:18}}>{editId?'✏ Tranzakció szerkesztése':'+ Új tranzakció'}</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
              <div className="form-group"><label>Dátum</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
              <div className="form-group"><label>Kategória</label>
                <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
                  {BIZ_CATS.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="form-group"><label>Összeg ($)</label><input type="number" step="0.01" min="0" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} placeholder="0.00"/></div>
              <div className="form-group"><label>Megjegyzés</label><input type="text" value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} placeholder="Opcionális..."/></div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn-primary" onClick={saveEntry}>Mentés</button>
              <button className="btn-secondary" onClick={()=>{setShowForm(false);setEditId(null);}}>Mégse</button>
            </div>
          </div>
        </div>
      )}

      {/* Subscription modal */}
      {showSubForm && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:500,
          display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}}
          onClick={e=>{if(e.target===e.currentTarget){setShowSubForm(false);setEditSubId(null);}}}>
          <div style={{background:'var(--surface)',borderRadius:16,border:'1px solid var(--border)',
            width:'100%',maxWidth:480,maxHeight:'90vh',overflowY:'auto',position:'relative',padding:'28px 24px'}}>
            <button onClick={()=>{setShowSubForm(false);setEditSubId(null);}}
              style={{position:'absolute',top:14,right:14,background:'var(--surface2)',
                border:'none',borderRadius:7,width:32,height:32,cursor:'pointer',
                color:'var(--text-2)',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            <div style={{fontSize:16,fontWeight:700,marginBottom:18}}>{editSubId?'✏ Előfizetés szerkesztése':'+ Új előfizetés'}</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
              <div className="form-group"><label>Neve</label><input type="text" value={subForm.name} onChange={e=>setSubForm(f=>({...f,name:e.target.value}))} placeholder="pl. Topstep, The Analyst..."/></div>
              <div className="form-group"><label>Számlázási ciklus</label>
                <select value={subForm.cycle} onChange={e=>setSubForm(f=>({...f,cycle:e.target.value}))}>
                  {SUB_CYCLES.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="form-group"><label>Összeg ($)</label><input type="number" step="0.01" min="0" value={subForm.amount} onChange={e=>setSubForm(f=>({...f,amount:e.target.value}))} placeholder="0.00"/></div>
              <div className="form-group"><label>Megjegyzés</label><input type="text" value={subForm.note} onChange={e=>setSubForm(f=>({...f,note:e.target.value}))} placeholder="Mire való..."/></div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              <button className="btn-primary" onClick={saveSub}>Mentés</button>
              <button className="btn-secondary" onClick={()=>{setShowSubForm(false);setEditSubId(null);}}>Mégse</button>
              <label style={{display:'flex',alignItems:'center',gap:6,marginLeft:8,fontSize:13,color:'var(--text-2)',cursor:'pointer'}}>
                <input type="checkbox" checked={subForm.active} onChange={e=>setSubForm(f=>({...f,active:e.target.checked}))} style={{accentColor:'var(--accent)'}}/>
                Aktív előfizetés
              </label>
            </div>
          </div>
        </div>
      )}

      {/* Subscriptions list */}

// ── EXPORT ───────────────────────────────────────────────────────────────────
function Export({ trades, showToast }) {
  const exportXLSX = () => {
    if (!trades.length) { alert('Nincs exportálható adat.'); return; }
    const stats = calcStats(trades);
    const strategy = loadStrategy();
    const wb = XLSX.utils.book_new();

    // Sheet 1: trades
    const allAccounts = loadAccounts();
    const acctMap = Object.fromEntries(allAccounts.map(a=>[a.id, a.name||a.id]));
    const rows = trades.filter(t=>!t.isNoTrade).map(t=>{
      const tpStr = (t.tpLevels||[])
        .filter(tp=>tp.price).map((tp,i)=>`TP${i+1}: ${tp.price} (${tp.contracts}c)${tp.hit?' ✓':''}`).join(' | ');
      const accountNames = (t.accountPositions||[]).map(p=>acctMap[p.accountId]||p.accountId).filter(Boolean).join(', ');
      const timeStr = [t.entryTime, t.exitTime].filter(Boolean).join(' → ');
      return {
        'Dátum': t.date,
        'Account': accountNames,
        'Instrument': t.instrument||'',
        'Irány': t.direction||'',
        'Bias szöveg': BIAS_LABELS[t.bias||3]||'',
        'Setup Osztály': t.setupClass||'',
        'Entry Ár': t.entryPrice||'',
        'TP Szintek': tpStr,
        'Entry / Exit Idő': timeStr,
        'Contracts': t.contracts||'',
        'P&L ($)': t.pnl||'',
        'Tervezett R:R': t.plannedRR||'',
        'Tényleges R:R': t.actualRR||'',
        'Eredmény': t.result||'',
        'Safety Protocol': t.safetyProtocol?.enabled?'Igen':'Nem',
        'Safety - Fele pozíció': t.safetyProtocol?.halfPosition?'Igen':'',
        'Safety - Max 1:1 RR': t.safetyProtocol?.maxOneToOne?'Igen':'',
        'Safety megjegyzés': t.safetyProtocol?.notes||'',
        'Hibák': (t.mistakes||[]).join(', '),
        'Érzelem előtte': t.emotionBefore||'',
        'Érzelem közben': t.emotionDuring||'',
        'Érzelem utána': t.emotionAfter||'',
        'Megjegyzések': t.notes||'',
      };
    });
    const ws1 = XLSX.utils.json_to_sheet(rows);
    ws1['!cols'] = Object.keys(rows[0]).map(k=>({wch:Math.max(k.length+2,16)}));
    XLSX.utils.book_append_sheet(wb, ws1, 'Trade Napló');

    // Sheet 2: summary
    if (stats) {
      const pf = stats.profitFactor===Infinity?'∞':parseFloat(stats.profitFactor).toFixed(2);
      const sumRows = [
        ['Mutató','Érték'],
        ['Total Trades',stats.total], ['Win / Loss / BE',`${stats.wins} / ${stats.losses} / ${stats.bes}`],
        ['Win Rate (excl BE %)',stats.winRate.toFixed(2)], ['Win Chance (incl BE %)',stats.winChance.toFixed(2)],
        ['Total P&L ($)',parseFloat(stats.totalPnL).toFixed(2)],
        ['Gross Profit ($)',parseFloat(stats.grossProfit).toFixed(2)],
        ['Gross Loss ($)',parseFloat(stats.grossLoss).toFixed(2)],
        ['Profit Factor',pf], ['Átlag R:R',stats.avgRR.toFixed(2)],
        ['Átlag Win ($)',stats.avgWin.toFixed(2)], ['Átlag Loss ($)',stats.avgLoss.toFixed(2)],
        ['Expectancy ($/trade)',stats.expectancy.toFixed(2)],
        ['Max Drawdown (%)',stats.maxDDpct.toFixed(2)], ['Max Drawdown ($)',stats.maxDD.toFixed(2)],
        ['Trading napok',stats.tradingDays],
        ['Napi átlag P&L',stats.dailyAvg.toFixed(2)],
        ['Heti átlag P&L',stats.weeklyAvg.toFixed(2)],
        ['Havi átlag P&L',stats.monthlyAvg.toFixed(2)],
        [''],
        ['=== SETUP OSZTÁLYOK ===',''],
        ...stats.bySetup.flatMap(s=>[
          [`Osztály ${s.class} — Trades`,s.total],
          [`Osztály ${s.class} — Win Rate`,s.winRate+'%'],
          [`Osztály ${s.class} — P&L`,'$'+s.pnl],
          [`Osztály ${s.class} — PF`,s.pf],
        ]),
        [''],
        ['=== INSTRUMENT ===',''],
        ...stats.byInst.flatMap(s=>[
          [`${s.instrument} — Win Rate`,s.winRate+'%'],
          [`${s.instrument} — P&L`,'$'+s.pnl],
        ]),
        [''],
        ['=== NAP SZERINTI ===',''],
        ...stats.byDay.filter(d=>d.total>0).flatMap(d=>[
          [`${d.day} — P&L`,'$'+d.pnl],
          [`${d.day} — Win Rate`,d.winRate+'%'],
        ]),
      ];
      const ws2 = XLSX.utils.aoa_to_sheet(sumRows);
      ws2['!cols'] = [{wch:34},{wch:20}];
      XLSX.utils.book_append_sheet(wb, ws2, 'Összesítő');

      // Sheet 3: equity
      const eqRows = stats.equityCurve.map((p,i)=>({
        'Nap #':i+1, 'Dátum':p.label, 'Equity ($)':p.equity, 'Drawdown (%)':p.dd.toFixed(2)
      }));
      const ws3 = XLSX.utils.json_to_sheet(eqRows);
      XLSX.utils.book_append_sheet(wb, ws3, 'Equity Görbe');
    }

    // Sheet 4: strategy
    if (strategy) {
      const ws4 = XLSX.utils.aoa_to_sheet([['Trading Stratégia'],[''],  ...strategy.split('\n').map(l=>[l])]);
      ws4['!cols'] = [{wch:80}];
      XLSX.utils.book_append_sheet(wb, ws4, 'Stratégia');
    }

    XLSX.writeFile(wb, `trading_journal_${new Date().toISOString().split('T')[0]}.xlsx`);
    showToast(`✓ Exportálva: ${trades.length} bejegyzés · ${strategy?'4':'3'} munkalap`);
  };

  const exportJSON = () => {
    const rawBiz = loadBizEntries();
    const businessEntries = rawBiz.map(e => {
      const isInc = BIZ_CAT_TYPES[e.category] === 'income';
      return {
        ...e,
        amount: Math.abs(parseFloat(e.amount) || 0),
        _type: isInc ? 'income' : 'expense',
      };
    });
    const payload = {
      trades,
      strategy:        loadStrategy(),
      account:         loadAccount(),
      accounts:        loadAccounts(),
      businessEntries,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tj_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    showToast('✓ JSON backup exportálva (trades + számlák + üzleti adatok)');
  };

  const importJSON = e => {
    const file=e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        let data = JSON.parse(ev.target.result);
        let importedTrades = Array.isArray(data) ? data : (data.trades || []);
        const importedStrategy = data.strategy || '';
        const importedAccount  = data.account  || null;
        const importedAccounts = Array.isArray(data.accounts) ? data.accounts : null;
        const importedBiz      = Array.isArray(data.businessEntries) ? data.businessEntries : null;
        if (!Array.isArray(importedTrades)) throw new Error();
        const acctCount = importedAccounts ? importedAccounts.length : 0;
        const bizCount  = importedBiz ? importedBiz.length : 0;
        if (confirm(`${importedTrades.length} trade + ${acctCount} számla + ${bizCount} üzleti bejegyzés importálása. Folytatod?`)) {
          const exist = loadTrades();
          const ids = new Set(exist.map(t=>t.id));
          const merged = [...exist, ...importedTrades.filter(t=>!ids.has(t.id))];
          saveTrades(merged);
          if (importedStrategy) saveStrategy(importedStrategy);
          if (importedAccount)  saveAccount(importedAccount);
          if (importedAccounts) saveAccounts(importedAccounts);
          if (importedBiz) {
            const cleanBiz = importedBiz.map(e => ({ ...e, amount: Math.abs(parseFloat(e.amount) || 0) }));
            cleanBiz.forEach(e => { delete e._type; });
            saveBizEntries(cleanBiz);
          }
          window.location.reload();
        }
      } catch { alert('Érvénytelen JSON fájl.'); }
    };
    r.readAsText(file);
    e.target.value = '';
  };

  const aiPrompt = `Csatolom a trading naplóm Excel exportját, elemezd a következőket:

1. Milyen mintázat van a vesztes és nyertes trade-jeim között? (Hibák, érzelmek, bias elemzés, setup osztály, irány)
2. Számlaonként (Account oszlop szerint) bontsd le a teljesítményt: melyik számlán milyen P&L, win rate és átlag R:R alakult ki? Van-e szignifikáns különbség a számlák között, és mi magyarázhatja?
3. Bias pontosság elemzése: az adott napon rögzített bias (irányvártam) mennyire egyezett a piac tényleges mozgásával? Vizsgáld meg, hogy bullish/bearish bias esetén a nyertes és vesztes trade-ek hogyan oszlanak el – mikor érdemes és mikor nem érdemes a biasra támaszkodni?
4. Honnan lehet előre látni, hogy mennyire éri meg megnyitni a pozíciót? (setup osztály, bias erőssége, érzelmek, napszak)
5. Mik a legfontosabb fejlesztési területek a statisztikák alapján?
6. Adj konkrét, cselekvésre alkalmas javaslatot minden azonosított gyengeségre.`;

  return (
    <div className="page">
      <div className="page-header"><h1 className="page-title">Export / Import</h1></div>
      <div className="export-grid">
        <div className="export-card">
          <div className="export-icon">📊</div>
          <h3>Excel Export</h3>
          <p>Trade napló + statisztikák + equity görbe + stratégia. AI elemzésre optimalizálva.</p>
          <button className="btn-primary" onClick={exportXLSX}>↓ Excel Letöltése</button>
        </div>
        <div className="export-card">
          <div className="export-icon">💾</div>
          <h3>JSON Backup</h3>
          <p>Teljes adatbázis + stratégia mentése. Visszatölthető.</p>
          <button className="btn-secondary" onClick={exportJSON}>↓ JSON Backup</button>
        </div>
        <div className="export-card">
          <div className="export-icon">📥</div>
          <h3>Import</h3>
          <p>Tölts vissza egy korábbi JSON backupot. Merge-ölve lesz a meglévőkkel.</p>
          <label className="btn-secondary" style={{cursor:'pointer'}}>
            ↑ JSON Import
            <input type="file" accept=".json" onChange={importJSON} style={{display:'none'}}/>
          </label>
        </div>
      </div>
      <div className="stat-block" style={{marginTop:8}}>
        <h3>AI Elemzési Prompt – Másold be Claude-ba</h3>
        <div className="code-block" style={{marginTop:10}}>{aiPrompt}</div>
      </div>
    </div>
  );
}

function SetPasswordScreen({ onDone }) {
  const [pw,      setPw]      = useState('');
  const [pw2,     setPw2]     = useState('');
  const [loading, setLoading] = useState(false);
  const [err,     setErr]     = useState('');
  const [success, setSuccess] = useState('');

  const IS = { width:'100%', padding:'10px 14px', background:'var(--surface2)',
    border:'1px solid var(--border)', borderRadius:8, color:'var(--text)',
    fontSize:14, fontFamily:'var(--mono)', outline:'none', boxSizing:'border-box' };

  const handle = async (e) => {
    e.preventDefault();
    if (pw !== pw2) { setErr('A két jelszó nem egyezik'); return; }
    if (pw.length < 6) { setErr('Legalább 6 karakter szükséges'); return; }
    const sb = getSB(); if (!sb) return;
    setLoading(true); setErr('');
    try {
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) { setErr(error.message); setLoading(false); return; }
      setSuccess('Jelszó sikeresen megváltoztatva!');
      setTimeout(() => onDone(), 1500);
    } catch(e2) { setErr('Hiba: ' + e2.message); setLoading(false); }
  };

  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--bg)'}}>
      <div style={{width:360,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:16,padding:'36px 32px'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:28}}>
          <div style={{width:42,height:42,background:'var(--accent)',borderRadius:10,display:'flex',
            alignItems:'center',justifyContent:'center',fontFamily:'var(--mono)',fontWeight:600,fontSize:14,color:'#000'}}>TJ</div>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>Új jelszó beállítása</div>
            <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text-3)'}}>Trading Journal</div>
          </div>
        </div>
        <form onSubmit={handle}>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:'var(--text-3)',marginBottom:5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px'}}>Új jelszó</div>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} required placeholder="••••••••" style={IS}/>
          </div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:11,color:'var(--text-3)',marginBottom:5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px'}}>Jelszó megerősítése</div>
            <input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} required placeholder="••••••••" style={IS}/>
          </div>
          {err     && <div style={{fontSize:12,color:'var(--red)',marginBottom:12,background:'rgba(255,61,113,0.1)',borderRadius:6,padding:'8px 12px'}}>{err}</div>}
          {success && <div style={{fontSize:12,color:'var(--green)',marginBottom:12,background:'rgba(0,230,118,0.1)',borderRadius:6,padding:'8px 12px'}}>{success}</div>}
          <button type="submit" disabled={loading}
            style={{width:'100%',padding:'11px 0',borderRadius:8,border:'none',cursor:loading?'not-allowed':'pointer',
              fontWeight:700,fontSize:14,
              background:loading?'var(--surface2)':'var(--accent)',color:loading?'var(--text-3)':'#000'}}>
            {loading ? '⟳ Mentés...' : 'Jelszó megváltoztatása'}
          </button>
        </form>
      </div>
    </div>
  );
}

function AuthScreen({ onLogin }) {
  const [mode,    setMode]    = useState('login');
  const [email,   setEmail]   = useState('');
  const [pw,      setPw]      = useState('');
  const [err,     setErr]     = useState('');
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState('');
  const [sbUrl,   setSbUrl]   = useState(()=>localStorage.getItem(SB_URL_OVERRIDE_KEY)||'');

  const saveUrl = () => {
    const trimmed = sbUrl.trim().replace(/\/$/, '');
    if (!trimmed.startsWith('https://')) { setErr('Az URL https://-vel kell kezdődjön'); return false; }
    localStorage.setItem(SB_URL_OVERRIDE_KEY, trimmed);
    _sb = null; // reset cached client
    return true;
  };

  const handle = async (e) => {
    e.preventDefault();
    if (!getSBUrl()) { if (!saveUrl()) return; }
    const sb = getSB();
    if (!sb) { setErr('Nem sikerült csatlakozni a Supabase-hez. Ellenőrizd az URL-t.'); return; }
    setLoading(true); setErr(''); setSuccess('');
    try {
      if (mode === 'login') {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
        if (error) { setErr(error.message); setLoading(false); return; }
        onLogin(data.user);
      } else if (mode === 'register') {
        const { data, error } = await sb.auth.signUp({ email, password: pw });
        if (error) { setErr(error.message); setLoading(false); return; }
        if (data.user && !data.session) {
          setSuccess('Ellenőrizd az e-mail fiókod a megerősítő linkért!');
          setLoading(false); return;
        }
        if (data.session) onLogin(data.user);
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
        if (error) { setErr(error.message); setLoading(false); return; }
        setSuccess('Jelszó-visszaállító e-mail elküldve!');
        setLoading(false);
      }
    } catch(e2) { setErr('Hiba: ' + e2.message); setLoading(false); }
  };

  const IS = { width:'100%', padding:'10px 14px', background:'var(--surface2)',
    border:'1px solid var(--border)', borderRadius:8, color:'var(--text)',
    fontSize:14, fontFamily:'var(--mono)', outline:'none', boxSizing:'border-box' };

  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--bg)'}}>
      <div style={{width:360,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:16,padding:'36px 32px'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:28}}>
          <div style={{width:42,height:42,background:'var(--accent)',borderRadius:10,display:'flex',
            alignItems:'center',justifyContent:'center',fontFamily:'var(--mono)',fontWeight:600,fontSize:14,color:'#000'}}>TJ</div>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>Trading Journal</div>

          </div>

        {/* Mode tabs */}
        <div style={{display:'flex',gap:3,marginBottom:22,background:'var(--surface2)',borderRadius:8,padding:3}}>
