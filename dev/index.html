              style={{flex:1,padding:'7px 0',borderRadius:6,border:'none',cursor:'pointer',fontSize:12,fontWeight:700,
                background:mode===m?'var(--accent)':'transparent',color:mode===m?'#000':'var(--text-3)'}}>
              {l}
            </button>
          ))}
        </div>
        <form onSubmit={handle}>
          {/* Project URL – csak ha nincs konfigurálva */}
          {!getSBUrl() && (
            <div style={{marginBottom:14,background:'rgba(0,212,170,0.06)',border:'1px solid rgba(0,212,170,0.2)',borderRadius:8,padding:'12px 14px'}}>
              <div style={{fontSize:11,color:'var(--accent)',marginBottom:5,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px'}}>
                Supabase Project URL
              </div>
              <input type="url" value={sbUrl} onChange={e=>setSbUrl(e.target.value)} required
                placeholder="https://abcdefgh.supabase.co" style={IS}/>
              <div style={{fontSize:10,color:'var(--text-3)',marginTop:5}}>
                Supabase → Settings → General → Reference ID
              </div>
            </div>
          )}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:'var(--text-3)',marginBottom:5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px'}}>E-mail</div>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="email@pelda.com" style={IS}/>
          </div>
          {mode !== 'reset' && (
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,color:'var(--text-3)',marginBottom:5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px'}}>Jelszó</div>
              <input type="password" value={pw} onChange={e=>setPw(e.target.value)} required placeholder="••••••••" style={IS}/>
            </div>
          )}
          {err     && <div style={{fontSize:12,color:'var(--red)',marginBottom:12,background:'rgba(255,61,113,0.1)',borderRadius:6,padding:'8px 12px'}}>{err}</div>}
          {success && <div style={{fontSize:12,color:'var(--green)',marginBottom:12,background:'rgba(0,230,118,0.1)',borderRadius:6,padding:'8px 12px'}}>{success}</div>}
          <button type="submit" disabled={loading}
            style={{width:'100%',padding:'11px 0',borderRadius:8,border:'none',cursor:loading?'not-allowed':'pointer',
              fontWeight:700,fontSize:14,marginBottom:12,
              background:loading?'var(--surface2)':'var(--accent)',color:loading?'var(--text-3)':'#000'}}>
            {loading?'⟳ Folyamatban...':mode==='login'?'Bejelentkezés':mode==='register'?'Regisztráció':'Jelszó visszaállítás'}
          </button>
        </form>
        {mode==='login'&&(
          <div style={{textAlign:'center'}}>
            <button onClick={()=>{setMode('reset');setErr('');setSuccess('');}}
              style={{background:'none',border:'none',color:'var(--text-3)',fontSize:12,cursor:'pointer',textDecoration:'underline'}}>
              Elfelejtett jelszó
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ── SYNC INDICATOR ────────────────────────────────────────────────────────────
function SyncIndicator() {
  const [state, setSt] = useState(_syncState);
  useEffect(() => onSyncChange(setSt), []);
  if (!isSBConfigured()) return null;
  const cfg = {
    ok:      { color:'var(--accent)',  sym:'●', lbl:'Szinkronizálva' },
    syncing: { color:'var(--yellow)',  sym:'⟳', lbl:'Szinkronizálás...' },
    error:   { color:'var(--red)',     sym:'●', lbl:'Szinkron hiba' },
    offline: { color:'var(--text-3)', sym:'●', lbl:'Offline' },
    pending: { color:'#ff9100',        sym:'○', lbl:'Nincs szinkronizálva' },
  }[state] || { color:'var(--text-3)', sym:'●', lbl:state };
  return (
    <div style={{padding:'5px 16px 8px',display:'flex',alignItems:'center',gap:6,fontSize:10,
      color:cfg.color,fontFamily:'var(--mono)',letterSpacing:'0.3px'}}>
      <span style={{fontSize:state==='syncing'?13:8}}>{cfg.sym}</span>
      <span>{cfg.lbl}</span>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [trades,      setTrades]      = useState(loadTrades);
  const [acct,        setAcctState]   = useState(loadAccount);
  const [view,        setView]        = useState('dashboard');
  const [editing,     setEditing]     = useState(null);
  const [toast,       setToast]       = useState('');
  const [user,         setUser]         = useState(null);
  const [authChecked,  setAuthChecked]  = useState(!isSBConfigured());
  const [recoveryMode, setRecoveryMode] = useState(false);
  const [sidebarOpen,  setSidebarOpen]  = useState(false);
  const firstRender = useRef(true);

  // Save trades — de csak valódi változásnál, nem az első renderelésnél
  useEffect(() => {
    if (firstRender.current) { firstRender.current = false; return; }
    saveTrades(trades);
  }, [trades]);

  // ── Cloud auth + sync ──
  useEffect(() => {
    const sb = getSB();
    if (!sb) { setAuthChecked(true); return; }
    let cancelled = false;

    // 5 másodperces biztonsági timeout
    const safetyTimer = setTimeout(() => {
      if (!cancelled) { console.warn('[TJ] auth timeout'); setAuthChecked(true); }
    }, 5000);

    // getSession() = gyors localStorage olvasás; getUser() = szerveres validálás
    const doInit = async () => {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (cancelled) return;
        if (session) {
          const { data: { user: liveUser }, error: uErr } = await sb.auth.getUser();
          if (cancelled) return;
          if (!uErr && liveUser) {
            setUser(liveUser);
            try {
              const changed = await pullFromCloud();
              if (changed && !cancelled) { window.location.reload(); return; }
            } catch(e) { console.warn('[TJ] pullFromCloud error', e); }
          } else {
            Object.keys(localStorage)
              .filter(k => k.includes('supabase') || k.includes('sb-') || k === 'tj_sb_session')
              .forEach(k => localStorage.removeItem(k));
          }
        }
      } catch(e) {
        console.warn('[TJ] auth error', e);
      }
      if (!cancelled) { clearTimeout(safetyTimer); setAuthChecked(true); }
    };
    doInit();

    const { data: listener } = sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        setAuthChecked(true); setRecoveryMode(true);
      }
      if (event === 'SIGNED_OUT') { setUser(null); }
    });

    const handleVis = () => {
      if (document.visibilityState === 'visible') {
        pullFromCloud().then(c => { if (c) window.location.reload(); }).catch(()=>{});
      }
    };
    document.addEventListener('visibilitychange', handleVis);
    return () => {
      cancelled = true;
      clearTimeout(safetyTimer);
      listener?.subscription?.unsubscribe();
      document.removeEventListener('visibilitychange', handleVis);
    };
  }, []);

  const handleLogout = () => {
    // Töröljük az összes Supabase auth adatot és töltjük újra az oldalt
    Object.keys(localStorage)
      .filter(k => k.includes('supabase') || k.includes('sb-') || k === 'tj_sb_session')
      .forEach(k => localStorage.removeItem(k));
    const sb = getSB();
    if (sb) sb.auth.signOut().catch(() => {});
    window.location.reload();
  };

  // Re-read account settings whenever the account page might have saved
  const refreshAcct = () => setAcctState(loadAccount());

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(''),3000); };

  const onSave = t => {
    setTrades(prev => {
      const idx = prev.findIndex(x=>x.id===t.id);
      if (idx>=0) { const n=[...prev]; n[idx]=t; return n; }
      return [...prev, t];
    });
    setEditing(null);
    setView('journal');
    showToast(editing ? '✓ Mentve' : t.isNoTrade ? '✓ No Trade nap rögzítve' : '✓ Trade rögzítve');
  };

  const onDelete = id => { setTrades(prev=>prev.filter(t=>t.id!==id)); showToast('Trade törölve'); };
  const onEdit   = t  => { setEditing(t); setView('addTrade'); };

  const sc           = parseFloat(acct.startingCapital) || 0;
  const goal         = parseFloat(acct.goalBalance)     || 0;
  const maxDailyLoss = parseFloat(acct.maxDailyLoss)    || 0;
  const maxTotalLoss = parseFloat(acct.maxTotalLoss)    || 0;
  const stats = useMemo(()=>calcStats(trades, sc), [trades, sc]);
  // Sidebar equity/P&L: funded + live only
  const sidebarFlStats = useMemo(() => {
    const flIds = new Set(loadAccounts().filter(a=>a.type==='funded'||a.type==='live').map(a=>a.id));
    const flTr = trades.filter(t=>!t.isNoTrade).reduce((acc,t)=>{
      const flPos=(t.accountPositions||[]).filter(p=>flIds.has(p.accountId));
      if(!flPos.length) return acc;
      const pnl=flPos.reduce((s,p)=>s+(p.pnl!==undefined&&p.pnl!==''?parseFloat(p.pnl)||0:parseFloat(t.pnl)||0),0);
      acc.push({...t,pnl:String(pnl)}); return acc;
    },[]);
    return calcStats(flTr, sc);
  }, [trades, sc]);

  const icoAccount = <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>;

  const icoPayout = <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>;
  const icoBiz    = <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>;

  const navItems = [
    { id:'dashboard', label:'Dashboard',    icon:Ico.dashboard },
    { id:'journal',   label:'Trade-ek',      icon:Ico.list },
    { id:'calendar',  label:'Naptár',       icon:Ico.calendar },
    { id:'stats',     label:'Statisztikák', icon:Ico.stats },
    { id:'payouts',   label:'Kifizetések',  icon:icoPayout },
    { id:'business',  label:'Üzleti',       icon:icoBiz },
    { id:'account',   label:'Fiók & Stratégia', icon:icoAccount },
    { id:'montecarlo',label:'Szimuláció',   icon:Ico.montecarlo },
    { id:'export',    label:'Export',       icon:Ico.export },
  ];

  // Auth gate
  if (!authChecked) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--bg)'}}>
      <div style={{color:'var(--accent)',fontFamily:'var(--mono)',fontSize:14}}>⟳ Betöltés...</div>
    </div>
  );
  if (recoveryMode) return (
    <SetPasswordScreen onDone={() => { setRecoveryMode(false); }}/>
  );
  if (isSBConfigured() && !user) return (
    <AuthScreen onLogin={u => { setUser(u); setAuthChecked(true); }}/>
  );

  const allNavItems = [
    { id:'dashboard', label:'Dashboard' },
    { id:'journal',   label:'Trade-ek' },
    { id:'calendar',  label:'Naptár' },
    { id:'stats',     label:'Statisztikák' },
    { id:'montecarlo',label:'Szimuláció' },
    { id:'payouts',   label:'Kifizetések' },
    { id:'business',  label:'Üzleti' },
    { id:'account',   label:'Fiók & Stratégia' },
    { id:'export',    label:'Export' },
  ];
  const currentLabel = allNavItems.find(n => n.id === view)?.label || '';
  const closeSidebar = () => setSidebarOpen(false);

  const icoHamburger = (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  );
  const icoClose = (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  );

  return (
    <div className="app">
      {/* Mobile top header */}
      <div className="mobile-header">
        <button className="hamburger-btn" onClick={()=>setSidebarOpen(o=>!o)}>
          {sidebarOpen ? icoClose : icoHamburger}
        </button>
        <div className="brand-mark" style={{width:28,height:28,borderRadius:7,fontSize:11,flexShrink:0}}>TJ</div>
        <div className="mobile-header-title">{currentLabel}</div>
      </div>
      {/* Overlay */}
      <div className={`mobile-overlay${sidebarOpen?' visible':''}`} onClick={closeSidebar}/>
      <nav className={`sidebar${sidebarOpen?' mobile-open':''}`}>
        <div className="brand">
          <div className="brand-mark">TJ</div>
          <div>
            <div className="brand-name">Trading Journal</div>
            <div className="brand-sub">SPX500 · NAS100</div>
          </div>
        </div>
        <div className="nav-section">
          {navItems.map(item=>(
            <button key={item.id}
              className={`nav-btn ${view===item.id?'active':''}`}
              onClick={()=>{ setView(item.id); if(item.id!=='addTrade') setEditing(null); if(item.id==='account') refreshAcct(); closeSidebar(); }}>
              {item.icon}<span>{item.label}</span>
            </button>
          ))}
        </div>
        <div className="sidebar-stats">
          {(()=>{
            const allAccts = loadAccounts();
            const flAccts  = allAccts.filter(a=>(a.type==='funded'||a.type==='live') && a.status==='active');
            const flIds    = new Set(flAccts.map(a=>a.id));
            // P&L: sum per-account progress for each FL account
            const flPnLSum = flAccts.reduce((sum,acct)=>{
              const p = calcAccountProgress(trades, acct);
              return sum + (p.totalPnL||0);
            }, 0);
            // Equity: sum currentEquity of all FL accounts
            const flEqSum = flAccts.reduce((sum,acct)=>{
              const p = calcAccountProgress(trades, acct);
              return sum + (p.currentEquity||0);
            }, 0);
            const realTrades = trades.filter(t=>!t.isNoTrade);
            const cleanTrades = realTrades.filter(t=>!t.isRuleBreak);
            const cWins = cleanTrades.filter(t=>t.result==='Win').length;
            const cLoss = cleanTrades.filter(t=>t.result==='Loss').length;
            const cDec  = cWins+cLoss;
            const cleanWR = cDec>0 ? (cWins/cDec*100) : null;
            return (<>
              <div className="ss-row">
                <span className="ss-label">Trade-ek</span>
                <span className="ss-val">{realTrades.length}</span>
              </div>
              <div className="ss-row">
                <span className="ss-label">Clean WR</span>
                <span className="ss-val" style={{color:cleanWR==null?'var(--text-3)':cleanWR>=50?'var(--green)':'var(--red)'}}>
                  {cleanWR!=null?`${cleanWR.toFixed(0)}%`:'–'}
                </span>
              </div>
              <div className="ss-row">
                <span className="ss-label">F/L P&L</span>
                <span className="ss-val" style={{color:flPnLSum>=0?'var(--green)':'var(--red)'}}>
                  {flAccts.length>0?`$${pnlFmt(flPnLSum)}`:'–'}
                </span>
              </div>
              {flAccts.length>0 && (
                <div className="ss-row">
                  <span className="ss-label">F/L Eq.</span>
                  <span className="ss-val" style={{color:'var(--text)'}}>
                    ${n(flEqSum,0)}
                  </span>
                </div>
              )}
            </>);
          })()}
        </div>
        {/* Cloud sync status + logout */}
        <div style={{borderTop:'1px solid var(--border)',paddingTop:8,paddingBottom:8}}>
          <SyncIndicator/>
          {isSBConfigured() && user && (
            <div style={{padding:'4px 16px 6px'}}>
              <div style={{fontSize:10,color:'var(--text-3)',fontFamily:'var(--mono)',marginBottom:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                {user.email}
              </div>
              <button onClick={handleLogout}
                style={{width:'100%',padding:'6px 0',borderRadius:6,border:'1px solid var(--border)',
                  background:'transparent',color:'var(--text-3)',fontSize:11,fontWeight:600,cursor:'pointer',fontFamily:'var(--sans)'}}>
                Kijelentkezés
              </button>
            </div>
          )}
        </div>
      </nav>

      <main className="main">
        {view==='dashboard' && <Dashboard trades={trades} goal={goal} startingCapital={sc}
            maxDailyLoss={maxDailyLoss} maxTotalLoss={maxTotalLoss}
            onGoToStats={(from,to)=>{
              localStorage.setItem('tj_stats_from', from||'');
              localStorage.setItem('tj_stats_to',   to||'');
              setView('stats');
            }}/>}
        {view==='addTrade'  && <TradeForm init={editing} onSave={onSave}
          onCancel={editing?()=>{setEditing(null);setView('journal');}:null}
          trades={trades}/>}
        {view==='journal'   && <Journal trades={trades} onEdit={onEdit} onDelete={onDelete} onSave={onSave}/>}
        {view==='calendar'  && <CalendarView trades={trades}/>}
        {view==='stats'     && <Statistics trades={trades} startingCapital={sc}/>}
        {view==='account'   && <AccountPage trades={trades} showToast={msg=>{ showToast(msg); refreshAcct(); }}/>}
        {view==='export'    && <Export trades={trades} showToast={showToast}/>}
        {view==='montecarlo'&& <div className="page"><MonteCarloSim trades={trades}/></div>}
        {view==='payouts'   && <PayoutTracker trades={trades}/>}
        {view==='business'  && <BusinessTracker showToast={showToast}/>}
      </main>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

(function() {
  if (localStorage.getItem('tj_biz_fix_v1')) return;
  try {
    const raw = localStorage.getItem('tj_business');
    if (raw) {
      const entries = JSON.parse(raw);
      let changed = false;
      const fixed = entries.map(e => {
        if (e.category === 'Egyéb bevétel' &&
            e.note && e.note.toLowerCase().includes('fedezethiány')) {
          changed = true;
          return { ...e, category: 'Egyéb kiadás',
            note: e.note.replace(' (ellenőrizd a kategóriát!)', '').trim() };
        }
        return e;
      });
      if (changed) {
        const v = JSON.stringify(fixed);
        localStorage.setItem('tj_business', v);
        queueSync('business', v);
      }
    }
  } catch(e) {}
  localStorage.setItem('tj_biz_fix_v1', '1');
})();
