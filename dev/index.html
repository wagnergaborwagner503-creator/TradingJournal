// ── TRADE FORM ──────────────────────────────────────────────────────────────
const emptyTrade = (trades=[]) => ({
  id: uid(),
  date: new Date().toISOString().split('T')[0],
  instrument: 'MNQ',
  direction: 'Long',
  bias: 3,
  setupClass: 'A',
  isNoTrade: false,
  entryPrice:'', exitPrice:'', entryTime:'', exitTime:'',
  stopLoss:'',
  tpLevels: Array(5).fill(null).map(()=>({price:'', contracts:'', hit:false})),
  contracts:'',
  pnl:'', plannedRR:'', actualRR:'', result:'Win',
  isRuleBreak: false,
  mistakes:[], notes:'',
  accountPositions: [],
  emotionBefore:'', emotionDuring:'', emotionAfter:'',
  safetyProtocol:{ enabled:false, halfPosition:false, maxOneToOne:false, notes:'' },
  startingBalance: '',
});

function TradeForm({ init, onSave, onCancel, trades }) {
  const [f, setF] = useState(()=> init ? {...emptyTrade(trades), ...init,
    tpLevels: init.tpLevels || Array(5).fill(null).map(()=>({price:'', contracts:'', hit:false})),
    safetyProtocol: init.safetyProtocol || { enabled:false, halfPosition:false, maxOneToOne:false, notes:'' },
    accountPositions: init.accountPositions || [],
  } : emptyTrade(trades));

  const set = (k, v) => setF(prev => {
    let next = {...prev, [k]: v};
    if (['entryPrice','stopLoss','tpLevels'].includes(k)) {
      next = recalcFromTP(next);
    }
    return next;
  });

  const setTP = (idx, field, value) => {
    const tpLevels = f.tpLevels.map((tp,i) => i===idx ? {...tp, [field]:value} : tp);
    setF(prev => recalcFromTP({...prev, tpLevels}));
  };

  const setSP = (k, v) => setF(prev => ({...prev, safetyProtocol:{...prev.safetyProtocol, [k]:v}}));

  const allAccounts = loadAccounts().filter(a => a.status === 'active');

  const toggleAccountPos = (accountId, checked) => {
    set('accountPositions', checked
      ? [...(f.accountPositions||[]), { accountId, contracts:'', entryPrice:'', stopLoss:'', pnl:'' }]
      : (f.accountPositions||[]).filter(p => p.accountId !== accountId)
    );
  };
  const updateAccountPos = (accountId, field, value) => {
    setF(prev => {
      const newPos = (prev.accountPositions||[]).map(p =>
        p.accountId === accountId ? {...p, [field]: value} : p
      );
      const next = {...prev, accountPositions: newPos};
      // When any account PnL changes: sum all account PnLs → global pnl
      if (field === 'pnl') {
        const total = newPos.reduce((s,p) => s + (parseFloat(p.pnl)||0), 0);
        next.pnl = newPos.some(p=>p.pnl!==''&&p.pnl!==undefined) ? String(Math.round(total*100)/100) : '';
      }
      return next;
    });
  };
  const copyMainToAccountPos = (accountId) => {
    const totalCont = (f.tpLevels||[]).reduce((s,tp)=>s+(parseFloat(tp.contracts)||0),0);
    set('accountPositions', (f.accountPositions||[]).map(p =>
      p.accountId === accountId ? {
        ...p,
        contracts:  totalCont ? String(totalCont) : p.contracts,
        entryPrice: f.entryPrice || p.entryPrice,
        stopLoss:   f.stopLoss   || p.stopLoss,
        pnl:        f.pnl        || p.pnl,
      } : p
    ));
  };

  const tog = (k, val) => setF(prev => ({
    ...prev,
    [k]: prev[k].includes(val) ? prev[k].filter(x=>x!==val) : [...prev[k], val]
  }));

  const handleSave = () => {
    if (!f.date) { alert('Dátum kötelező.'); return; }
    let save = {...f};
    // Auto-negative PnL for losses
    if (!save.isNoTrade && save.result==='Loss' && save.pnl) {
      const p = parseFloat(save.pnl);
      if (!isNaN(p)) save.pnl = (-Math.abs(p)).toString();
    }
    onSave(save);
  };

  const Tgl = ({field, val, colorClass}) => (
    <button className={`toggle-btn ${f[field]===val?(colorClass||'on-accent'):''}`}
      onClick={()=>set(field,val)}>{val}</button>
  );

  // TP R multiples
  const ep = parseFloat(f.entryPrice);
  const sl = parseFloat(f.stopLoss);
  const riskUnit = (ep && sl && ep!==sl) ? Math.abs(ep-sl) : 0;
  const filledTPs = f.tpLevels.filter(tp => tp.price && parseFloat(tp.price));

  // Auto-compute P&L from hit TPs + instrument point value
  const pv = getPointValue(f.instrument);
  const autoPnL = React.useMemo(() => {
    if (!pv || !ep || !f.direction) return null;
    const dirMult = f.direction === 'Long' ? 1 : -1;
    const hitTPs = (f.tpLevels||[]).filter(tp => tp.price && tp.contracts && parseFloat(tp.price) && parseFloat(tp.contracts) && tp.hit);
    if (hitTPs.length > 0) {
      const val = hitTPs.reduce((sum, tp) => {
        return sum + (parseFloat(tp.price) - ep) * dirMult * parseFloat(tp.contracts) * pv;
      }, 0);
      return Math.round(val * 100) / 100;
    }
    // Loss: compute from SL
    if (sl && ep !== sl) {
      const allCont = (f.tpLevels||[]).reduce((s,tp)=>s+(parseFloat(tp.contracts)||0),0) || parseFloat(f.contracts)||0;
      if (allCont > 0) {
        const val = (sl - ep) * dirMult * allCont * pv;
        return Math.round(val * 100) / 100;
      }
    }
    return null;
  }, [f.instrument, f.direction, f.entryPrice, f.stopLoss, f.tpLevels, f.contracts, pv]);

  const applyAutoPnL = () => { if (autoPnL !== null) set('pnl', String(autoPnL)); };

  return (
    <div className="page">
      <div className="page-header">
        <h1 className="page-title">{init?'Trade Szerkesztése':'Új Trade Rögzítése'}</h1>
        {onCancel && <div className="page-actions"><button className="btn-ghost" onClick={onCancel}>{Ico.x} Mégse</button></div>}
      </div>

      {/* No Trade toggle */}
      <div style={{marginBottom:20}}>
        <label className="checkbox-label" style={{fontSize:14, fontWeight:600}}>
          <input type="checkbox" checked={f.isNoTrade} onChange={e=>set('isNoTrade',e.target.checked)}/>
          No Trade nap (nincs megnyitott pozíció)
        </label>
      </div>

      {/* Date always visible */}
      <div style={{marginBottom:16, maxWidth:260}}>
        <div className="form-group">
          <label>Dátum *</label>
          <input type="date" value={f.date} onChange={e=>set('date',e.target.value)}/>
        </div>
      </div>

      {/* Notes – always visible, at top */}
      <div className="form-section">
        <label>Megjegyzések / Gondolatmenet</label>
        <textarea className="notes-field" value={f.notes}
          onChange={e=>set('notes',e.target.value)}
          placeholder={f.isNoTrade
            ? "Miért nem nyitottam pozíciót? Mit láttam a piacon? Milyen volt a setup? Miért vártam ki..."
            : "Trade thesis, megfigyelések, tanulságok, piaci kontextus, gazdaságpolitikai megjegyzések..."}
          rows={4}/>
      </div>

      {/* Safety Protocol – at top, only for real trades */}
      {!f.isNoTrade && (
        <div className="safety-box" style={{marginBottom:16}}>
          <div className="safety-header">
            <span style={{color:'var(--yellow)'}}>{Ico.shield}</span>
            <label className="checkbox-label" style={{fontWeight:700, color:'var(--yellow)'}}>
              <input type="checkbox" checked={f.safetyProtocol.enabled}
                onChange={e=>setSP('enabled',e.target.checked)}
                style={{accentColor:'var(--yellow)'}}/>
              Safety Protocol Nap
            </label>
          </div>
          {f.safetyProtocol.enabled && (
            <div className="safety-opts">
              <label className="safety-opt">
                <input type="checkbox" checked={f.safetyProtocol.halfPosition}
                  onChange={e=>setSP('halfPosition',e.target.checked)}/>
                Fele akkora pozíció méret
              </label>
              <label className="safety-opt">
                <input type="checkbox" checked={f.safetyProtocol.maxOneToOne}
                  onChange={e=>setSP('maxOneToOne',e.target.checked)}/>
                Max 1:1 RR a cél
              </label>
              <div className="form-group" style={{marginTop:4}}>
                <label>Megjegyzés / Szabály</label>
                <input type="text" value={f.safetyProtocol.notes}
                  onChange={e=>setSP('notes',e.target.value)}
                  placeholder="Pl: Tegnap nagy loss után, óvatos nap..."/>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Bias slider */}
      <div className="form-section">
        <label>Piaci Bias</label>
        <div className="bias-toggle">
          {[1,2,3,4,5].map(v => (
            <button key={v} className="bias-btn"
              style={f.bias===v ? {borderColor:BIAS_COLORS[v], background:`${BIAS_COLORS[v]}18`, color:BIAS_COLORS[v]} : {}}
              onClick={()=>set('bias',v)}>
              {BIAS_LABELS[v]}
            </button>
          ))}
        </div>
      </div>

      {f.isNoTrade && (
        <div className="notrade-banner">
          📵 No Trade nap — csak dátum, bias és megjegyzés szükséges
        </div>
      )}

      {!f.isNoTrade && (<>
        <div className="section-divider"><span>Trade Adatok</span></div>

        {/* Row 1 */}
        <div className="form-grid">
          <div className="form-group">
            <label>Instrument</label>
            <select value={f.instrument} onChange={e=>set('instrument',e.target.value)}>
              {INSTRUMENTS.map(i=><option key={i}>{i}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label>Contracts / Size</label>
            <input type="number" step="0.01" min="0" value={f.contracts}
              onChange={e=>set('contracts',e.target.value)} placeholder="1"/>
          </div>
          <div className="form-group">
            <label>Entry Idő</label>
            <input type="time" value={f.entryTime} onChange={e=>set('entryTime',e.target.value)}/>
          </div>
          <div className="form-group">
            <label>Exit Idő</label>
            <input type="time" value={f.exitTime} onChange={e=>set('exitTime',e.target.value)}/>
          </div>
        </div>

        {/* Toggles */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:20}}>
          <div className="form-group">
            <label>Irány</label>
            <div className="toggle-group">
              <Tgl field="direction" val="Long"  colorClass="on-green"/>
              <Tgl field="direction" val="Short" colorClass="on-red"/>
            </div>
          </div>
          <div className="form-group">
            <label>Setup Osztály</label>
            <div className="toggle-group">
              {SETUPS.map(c=>{
                const s=setupStyle(c);
                const active=f.setupClass===c;
                return (
                  <button key={c} className="toggle-btn"
                    style={active?{borderColor:s.border, background:s.bg, color:s.color}:{}}
                    onClick={()=>set('setupClass',c)}>{c}</button>
                );
              })}
            </div>
          </div>
        </div>

        {/* Prices */}
        <div className="form-grid-3">
          <div className="form-group">
            <label>Entry Ár</label>
            <input type="number" step="0.01" value={f.entryPrice}
              onChange={e=>set('entryPrice',e.target.value)} placeholder="5200.50"/>
          </div>
          <div className="form-group">
            <label>Stop Loss</label>
            <input type="number" step="0.01" value={f.stopLoss}
              onChange={e=>set('stopLoss',e.target.value)} placeholder="5190.00"/>
          </div>
          <div className="form-group">
            <label>P&L ($)
              {autoPnL !== null && (
                <button onClick={applyAutoPnL}
                  style={{marginLeft:8,padding:'2px 8px',background:'rgba(0,212,170,0.12)',
                    border:'1px solid rgba(0,212,170,0.35)',borderRadius:5,
                    color:'var(--accent)',fontSize:10,cursor:'pointer',fontWeight:700,fontFamily:'var(--mono)'}}>
                  ↻ Auto: {pnlFmt(autoPnL)}
                </button>
              )}
            </label>
            <input type="number" step="0.01" value={f.pnl}
              onChange={e=>set('pnl',e.target.value)} placeholder={pv > 0 ? 'auto-számítva' : '725'}/>
            {pv > 0 && (
              <div style={{fontSize:10,color:'var(--text-3)',marginTop:2,fontFamily:'var(--mono)'}}>
                Point érték: ${n(pv,2)}/pont · {f.instrument}
              </div>
            )}
          </div>
        </div>

        {/* TP Levels */}
        <div className="form-section">
          <label>TP Szintek <span className="auto-label">AUTO RR</span></label>
          <div className="tp-section">
            <div className="tp-header">
              <span>TP</span>
              <span>Ár</span>
              <span>Contracts</span>
              <span style={{textAlign:'center'}}>R Szint</span>
              <span style={{textAlign:'center'}}>Elért</span>
            </div>
            {f.tpLevels.map((tp, idx) => {
              const tpPrice = parseFloat(tp.price);
              const rMult = (riskUnit && tpPrice) ? (Math.abs(tpPrice-ep)/riskUnit).toFixed(1)+'R' : '–';
              const hasFill = tp.price && tp.contracts;
              return (
                <div key={idx} className="tp-row">
                  <span className="tp-label">TP{idx+1}</span>
                  <input className="tp-input" type="number" step="0.01"
                    value={tp.price} onChange={e=>setTP(idx,'price',e.target.value)}
                    placeholder="5240.00"/>
                  <input className="tp-input" type="number" step="1" min="0"
                    value={tp.contracts} onChange={e=>setTP(idx,'contracts',e.target.value)}
                    placeholder="1"/>
                  <div className="tp-rr">{rMult}</div>
                  <div className="tp-check">
                    {hasFill && (
                      <input type="checkbox" checked={tp.hit}
                        onChange={e=>setTP(idx,'hit',e.target.checked)}/>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{display:'flex', gap:20, fontFamily:'var(--mono)', fontSize:11, color:'var(--text-3)'}}>
            <span>Tervezett R:R: <strong style={{color:'var(--accent)'}}>{f.plannedRR||'–'}</strong></span>
            <span>Tényleges R:R: <strong style={{color:'var(--green)'}}>{f.actualRR||'–'}</strong></span>
          </div>
        </div>

        {/* Account Linking */}
        {allAccounts.length > 0 && (
          <div className="form-section">
            <label>Számlák <span style={{fontSize:11,color:'var(--text-3)',fontWeight:400}}>(melyik számlán nyitottad meg – per-számla adatok)</span></label>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:6}}>
              {allAccounts.map(acct => {
                const pos = (f.accountPositions||[]).find(p => p.accountId === acct.id);
                const checked = !!pos;
                const tCol = acct.type==='challenge'?'var(--accent)':acct.type==='live'?'rgba(180,130,255,0.9)':'rgba(100,200,255,0.9)';
                const tLbl = acct.type==='challenge'?'Challenge':acct.type==='live'?'Live':'Funded';
                return (
                  <div key={acct.id} style={{
                    background:checked?'rgba(0,212,170,0.05)':'transparent',
                    border:`1px solid ${checked?'rgba(0,212,170,0.25)':'var(--border)'}`,
                    borderRadius:8,padding:'8px 12px',transition:'all 0.15s'}}>
                    {/* Account header row */}
                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:checked?10:0}}>
                      <input type="checkbox" checked={checked}
                        onChange={e=>toggleAccountPos(acct.id, e.target.checked)}
                        style={{width:16,height:16,accentColor:'var(--accent)',cursor:'pointer'}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:600,color:'var(--text)'}}>{acct.name}</div>
                        <div style={{fontSize:10,color:'var(--text-3)'}}>
                          <span style={{color:tCol,fontWeight:700,marginRight:6}}>{tLbl}</span>
                          ${n(acct.startCapital,0)} · {acct.startDate}
                        </div>
                      </div>
                      {checked && (
                        <button onClick={()=>copyMainToAccountPos(acct.id)}
                          title="Másolás a fő trade adatokból"
                          style={{padding:'4px 10px',background:'rgba(0,212,170,0.1)',border:'1px solid rgba(0,212,170,0.3)',
                            borderRadius:6,color:'var(--accent)',fontSize:11,cursor:'pointer',fontWeight:600,
                            whiteSpace:'nowrap'}}>
                          ⧉ Másol főből
                        </button>
                      )}
                    </div>
                    {/* Per-account fields */}
                    {checked && (() => {
                      const acctEp = parseFloat(pos.entryPrice) || ep;
                      const acctSl = parseFloat(pos.stopLoss)   || sl;
                      const acctConts = parseFloat(pos.contracts)||0;
                      const acctDirMult = f.direction === 'Long' ? 1 : -1;
                      const acctHitTPs = (f.tpLevels||[]).filter(tp => tp.price && parseFloat(tp.price) && tp.hit);
                      let acctAutoPnL = null;
                      if (pv > 0 && acctEp && acctConts > 0) {
                        if (acctHitTPs.length > 0) {
                          acctAutoPnL = Math.round(acctHitTPs.reduce((s,tp) =>
                            s + (parseFloat(tp.price) - acctEp) * acctDirMult * acctConts * pv, 0) * 100) / 100;
                        } else if (acctSl && acctEp !== acctSl) {
                          acctAutoPnL = Math.round((acctSl - acctEp) * acctDirMult * acctConts * pv * 100) / 100;
                        }
                      }
                      // Prev equity for this account (excluding current trade)
                      const prevEq = calcAccountProgress(trades.filter(t=>t.id!==f.id), acct).currentEquity
                        || parseFloat(acct.startCapital) || 0;
                      const curPnl = parseFloat(pos.pnl);
                      const newBalVal = pos.pnl !== '' && pos.pnl !== undefined && !isNaN(curPnl)
                        ? String(Math.round((prevEq + curPnl) * 100) / 100)
                        : '';
                      const inputStyle = {width:'100%',background:'var(--surface)',border:'1px solid var(--border)',
                        borderRadius:6,padding:'5px 8px',color:'var(--text)',fontSize:12,textAlign:'center'};
                      return (
                        <div>
                          <div style={{display:'grid',gridTemplateColumns:'repeat(5,minmax(0,1fr))',gap:6}}>
                            {[
                              {k:'contracts', label:'Contracts', step:'1',   ph:'1'},
                              {k:'entryPrice',label:'Entry ($)', step:'0.01',ph:'5200.50'},
                              {k:'stopLoss',  label:'Stop ($)',  step:'0.01',ph:'5190.00'},
                            ].map(({k,label,step,ph})=>(
                              <div key={k} style={{textAlign:'center'}}>
                                <div style={{fontSize:9,color:'var(--text-3)',marginBottom:2,
                                  textTransform:'uppercase',letterSpacing:'0.5px'}}>{label}</div>
                                <input type="number" step={step} value={pos[k]||''}
                                  onChange={e=>updateAccountPos(acct.id,k,e.target.value)}
                                  style={inputStyle} placeholder={ph}/>
                              </div>
                            ))}
                            {/* P&L */}
                            <div style={{textAlign:'center'}}>
                              <div style={{fontSize:9,color:'var(--text-3)',marginBottom:2,
                                textTransform:'uppercase',letterSpacing:'0.5px'}}>P&L ($)</div>
                              <input type="number" step="0.01" value={pos.pnl||''}
                                onChange={e=>updateAccountPos(acct.id,'pnl',e.target.value)}
                                style={inputStyle} placeholder="0.00"/>
                            </div>
                            {/* Új egyenleg – syncs with P&L */}
                            <div style={{textAlign:'center'}}>
                              <div style={{fontSize:9,color:'var(--accent)',marginBottom:2,
                                textTransform:'uppercase',letterSpacing:'0.5px',fontWeight:700}}>Új egyenleg ($)</div>
                              <input type="number" step="0.01"
                                value={newBalVal}
                                onChange={e=>{
                                  const nb = parseFloat(e.target.value);
                                  updateAccountPos(acct.id,'pnl', isNaN(nb)?'':String(Math.round((nb-prevEq)*100)/100));
                                }}
                                style={{...inputStyle,border:'1px solid rgba(0,212,170,0.35)',color:'var(--accent)'}}
                                placeholder={n(prevEq,2)}/>
                              <div style={{fontSize:9,marginTop:2,color:'var(--text-3)',fontFamily:'var(--mono)'}}>
                                előző: ${n(prevEq,2)}
                              </div>
                            </div>
                          </div>
                          {acctAutoPnL !== null && (
                            <div style={{marginTop:5,display:'flex',alignItems:'center',gap:6}}>
                              <span style={{fontSize:10,color:'var(--text-3)',fontFamily:'var(--mono)'}}>Auto P&L:</span>
                              <button onClick={()=>updateAccountPos(acct.id,'pnl',String(acctAutoPnL))}
                                style={{padding:'2px 8px',background:'rgba(0,212,170,0.1)',border:'1px solid rgba(0,212,170,0.3)',
                                  borderRadius:5,color:'var(--accent)',fontSize:10,cursor:'pointer',fontWeight:700,fontFamily:'var(--mono)'}}>
                                ↻ {pnlFmt(acctAutoPnL)}
                              </button>
                            </div>
                          )}
                        </div>
                      );
                    })()}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Result */}
        <div className="form-section">
          <label>Eredmény</label>
          <div className="toggle-group">
            <Tgl field="result" val="Win"  colorClass="on-green"/>
            <Tgl field="result" val="Loss" colorClass="on-red"/>
            <Tgl field="result" val="BE"   colorClass="on-yellow"/>
          </div>
          {f.result==='Win' && filledTPs.length>0 &&
            <div style={{marginTop:8, fontFamily:'var(--mono)', fontSize:11, color:'var(--green)'}}>
              ✓ Jelöld be fent melyik TP szint lett elérve (Elért checkbox)
            </div>}
          {f.result==='Loss' && f.pnl && parseFloat(f.pnl)>0 &&
            <div style={{marginTop:8, fontFamily:'var(--mono)', fontSize:11, color:'var(--red)'}}>
              ℹ️ Loss eredménynél a P&L automatikusan negatív lesz mentéskor
            </div>}
        </div>

        {/* Rule break */}
        <div className="form-section">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <button
              onClick={()=>set('isRuleBreak',!f.isRuleBreak)}
              style={{
                padding:'6px 14px',borderRadius:6,border:'none',cursor:'pointer',
                fontWeight:700,fontSize:12,letterSpacing:'0.4px',
                background: f.isRuleBreak ? 'rgba(255,61,113,0.18)' : 'var(--surface2)',
                color: f.isRuleBreak ? 'var(--red)' : 'var(--text-3)',
                boxShadow: f.isRuleBreak ? '0 0 0 1px rgba(255,61,113,0.5)' : '0 0 0 1px var(--border)',
              }}>
              {f.isRuleBreak ? '⚠ Rule Break' : 'Rule Break?'}
            </button>
            {f.isRuleBreak && (
              <span style={{fontSize:11,color:'var(--red)',opacity:0.8}}>
                Ez a trade nem számít bele a tiszta statisztikákba
              </span>
            )}
          </div>
        </div>

        {/* Mistakes */}
        <div className="form-section">
          <label>Hibák</label>
          <div className="tag-grid">
            {MISTAKES.map(m=>(
              <button key={m} className={`tag-btn ${f.mistakes.includes(m)?'tm':''}`}
                onClick={()=>tog('mistakes',m)}>{m}</button>
            ))}
          </div>
        </div>

        {/* Emotions */}
        <div className="form-section">
          <label>Érzelmek</label>
          <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14}}>
            {[['emotionBefore','Trade előtt'],['emotionDuring','Trade közben'],['emotionAfter','Trade után']].map(([field,lbl])=>(
              <div className="form-group" key={field}>
                <label>{lbl}</label>
                <select value={f[field]} onChange={e=>set(field,e.target.value)}>
                  <option value="">–</option>
                  {EMOTIONS.map(e=><option key={e}>{e}</option>)}
                </select>
              </div>
            ))}
          </div>
        </div>
      </>)}

      <div className="form-actions">
        {onCancel && <button className="btn-secondary" onClick={onCancel}>Mégse</button>}
        <button className="btn-primary" onClick={handleSave}>
          {init ? 'Mentés' : f.isNoTrade ? 'No Trade Nap Mentése' : 'Trade Rögzítése'}
        </button>
      </div>
    </div>
  );
}

// ── JOURNAL ──────────────────────────────────────────────────────────────────
function Journal({ trades, onEdit, onDelete, onSave }) {
  const [fil, setFil] = useState({inst:'',result:'',setup:'',from:'',to:''});
  const [sort, setSort] = useState({k:'date',d:'desc'});
  const [modalOpen,   setModalOpen]   = useState(false);
  const [modalTrade,  setModalTrade]  = useState(null);
  const setF = (k,v)=>setFil(p=>({...p,[k]:v}));

  const handleModalSave = t => { onSave(t); setModalOpen(false); setModalTrade(null); };
  const handleModalEdit = t => { setModalTrade(t); setModalOpen(true); };

  const rows = useMemo(()=>{
    return trades
      .filter(t=>{
        if (fil.inst   && !t.isNoTrade && t.instrument!==fil.inst) return false;
        if (fil.result && t.result!==fil.result) return false;
        if (fil.setup  && !t.isNoTrade && t.setupClass!==fil.setup) return false;
        if (fil.from   && t.date<fil.from) return false;
        if (fil.to     && t.date>fil.to)   return false;
        return true;
      })
      .sort((a,b)=>{
        let av=a[sort.k]??'', bv=b[sort.k]??'';
        if (['pnl','actualRR','entryPrice','exitPrice'].includes(sort.k)){av=parseFloat(av)||0;bv=parseFloat(bv)||0;}
        if (av<bv) return sort.d==='asc'?-1:1;
        if (av>bv) return sort.d==='asc'?1:-1;
        return 0;
      });
  },[trades,fil,sort]);

  const togSort = k => setSort(p=>p.k===k?{k,d:p.d==='asc'?'desc':'asc'}:{k,d:'desc'});
  const totalPnL = rows.filter(t=>!t.isNoTrade).reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const SH = ({k,l}) => <th onClick={()=>togSort(k)}>{l} {sort.k===k&&<span>{sort.d==='asc'?'↑':'↓'}</span>}</th>;

  return (
    <div className="page">
      {modalOpen && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}}
          onClick={e=>{if(e.target===e.currentTarget){setModalOpen(false);setModalTrade(null);}}}>
          <div style={{background:'var(--surface)',borderRadius:16,border:'1px solid var(--border)',
            width:'100%',maxWidth:720,maxHeight:'90vh',overflowY:'auto',position:'relative'}}>
            <button onClick={()=>{setModalOpen(false);setModalTrade(null);}}
              style={{position:'absolute',top:14,right:14,zIndex:1,background:'var(--surface2)',
                border:'none',borderRadius:7,width:32,height:32,cursor:'pointer',
                color:'var(--text-2)',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            <TradeForm init={modalTrade} onSave={handleModalSave}
              onCancel={()=>{setModalOpen(false);setModalTrade(null);}} trades={trades}/>
          </div>
        </div>
      )}
      <div className="page-header">
        <h1 className="page-title">Trade-ek</h1>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span className="count-badge">{rows.length} / {trades.length}</span>
          <button className="btn-primary" style={{padding:'6px 14px',fontSize:13}}
            onClick={()=>{setModalTrade(null);setModalOpen(true);}}>+ Új Trade</button>
        </div>
      </div>
      <div className="filter-bar">
        <select value={fil.inst} onChange={e=>setF('inst',e.target.value)}>
          <option value="">Minden Instrument</option>
          {INSTRUMENTS.map(i=><option key={i}>{i}</option>)}
        </select>
        <select value={fil.result} onChange={e=>setF('result',e.target.value)}>
          <option value="">Minden Eredmény</option>
          {RESULTS.map(r=><option key={r}>{r}</option>)}
        </select>
        <select value={fil.setup} onChange={e=>setF('setup',e.target.value)}>
          <option value="">Minden Setup</option>
          {SETUPS.map(c=><option key={c}>Osztály {c}</option>)}
        </select>
        <input type="date" value={fil.from} onChange={e=>setF('from',e.target.value)}/>
        <input type="date" value={fil.to}   onChange={e=>setF('to',e.target.value)}/>
        <button className="btn-ghost" onClick={()=>setFil({inst:'',result:'',setup:'',from:'',to:''})}>Törlés</button>
      </div>
      {rows.length===0 ? <div className="empty"><p>Nincs megjelenítendő trade.</p></div> : (<>
        <div className="table-wrap">
          <table className="trade-table">
            <thead><tr>
              <SH k="date" l="Dátum"/>
              <SH k="direction" l="Irány"/>
              <SH k="setupClass" l="Setup"/>
              <th>Bias</th>
              <SH k="actualRR" l="R:R"/>
              <SH k="pnl" l="P&L"/>
              <SH k="result" l="Eredmény"/>
              <th>Safety</th>
              <th></th>
            </tr></thead>
            <tbody>
              {rows.map(t=>(
                <tr key={t.id} className={t.isNoTrade?'notrade-row':''}>
                  <td>{t.date}</td>
                  <td>{!t.isNoTrade&&<span className={`dir-badge ${t.direction==='Long'?'long':'short'}`}>{t.direction}</span>}</td>
                  <td>{!t.isNoTrade&&<SetupBadge cls={t.setupClass}/>}</td>
                  <td><BiasDisplay value={t.bias}/></td>
                  <td style={{fontFamily:'var(--mono)',fontSize:12}}>{t.actualRR?n(t.actualRR):'–'}</td>
                  <td className={t.isNoTrade?'':(t.result==='BE'?'c-yellow':(parseFloat(t.pnl)||0)>0?'c-green':(parseFloat(t.pnl)||0)<0?'c-red':'')} style={{fontWeight:600}}>
                    {!t.isNoTrade&&(t.pnl!==''&&t.pnl!==null&&t.pnl!==undefined)?`$${pnlFmt(t.pnl)}`:'–'}
                  </td>
                  <td>{t.isNoTrade?'–':<span className={`result-badge ${t.result?.toLowerCase()}`}>{t.result}</span>}</td>
                  <td>
                    {!t.isNoTrade&&t.safetyProtocol?.enabled&&<span style={{color:'var(--yellow)',fontSize:14}} title="Safety Protocol">🛡️</span>}
                    {!t.isNoTrade&&t.isRuleBreak&&<span style={{background:'rgba(255,61,113,0.15)',color:'var(--red)',fontSize:10,fontWeight:700,borderRadius:4,padding:'1px 5px',marginLeft:2}} title="Rule Break">RB</span>}
                  </td>
                  <td>
                    <div style={{display:'flex',gap:4}}>
                      <button className="icon-btn" onClick={()=>handleModalEdit(t)}>{Ico.edit}</button>
                      <button className="icon-btn del" onClick={()=>{if(confirm('Törlöd?'))onDelete(t.id)}}>{Ico.trash}</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="table-footer">
          {rows.length} bejegyzés · Szűrt P&L:&nbsp;
          <strong className={totalPnL>=0?'c-green':'c-red'}>${pnlFmt(totalPnL)}</strong>
        </div>
      </>)}
    </div>
  );
}

// ── DAY CARD RENDERER (shared) ───────────────────────────────────────────────
function DayCardContent({ trades, date, cardRef }) {
  const dayTrades = trades.filter(t => t.date === date && !t.isNoTrade);
  const noTradeDay = trades.some(t => t.date === date && t.isNoTrade);
  const dayBias = (trades.find(t => t.date === date)?.bias) || 3;

  const totalPnL   = dayTrades.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const wins       = dayTrades.filter(t=>t.result==='Win').length;
  const losses     = dayTrades.filter(t=>t.result==='Loss').length;
  const bes        = dayTrades.filter(t=>t.result==='BE').length;
  const avgRR      = dayTrades.length>0
    ? (dayTrades.reduce((s,t)=>s+(parseFloat(t.actualRR)||0),0)/dayTrades.length).toFixed(2) : null;
  const instruments = [...new Set(dayTrades.map(t=>t.instrument))];
  const directions  = [...new Set(dayTrades.map(t=>t.direction))];
  const setupClasses= [...new Set(dayTrades.map(t=>t.setupClass).filter(Boolean))];
  const hasSafety   = dayTrades.some(t=>t.safetyProtocol?.enabled);

  const pnlClass = totalPnL>0?'dc-pnl-pos':totalPnL<0?'dc-pnl-neg':'dc-pnl-zero';
  const overallResult = dayTrades.length===0 ? null : totalPnL>0?'Win':totalPnL<0?'Loss':'BE';
  const resultBadgeClass = overallResult==='Win'?'dc-result-win':overallResult==='Loss'?'dc-result-loss':'dc-result-be';

  const fmtDate = (d) => new Date(d+'T12:00:00').toLocaleDateString('hu-HU',{year:'numeric',month:'long',day:'numeric'});

  if (!dayTrades.length && !noTradeDay) return null;

  if (noTradeDay && !dayTrades.length) {
    return (
      <div ref={cardRef} className="dc-card">
        <div className="dc-card-header">
          <div className="dc-logo"><div className="dc-logo-mark">TJ</div><div className="dc-logo-text">Trading Journal</div></div>
          <div className="dc-date-badge">{fmtDate(date)}</div>
        </div>
        <div className="dc-badges">
          <span className="dc-badge dc-badge-bias" style={{color:BIAS_COLORS[dayBias]}}>{BIAS_LABELS[dayBias]}</span>
        </div>
        <div style={{textAlign:'center',padding:'20px 0',color:'var(--accent)',fontWeight:700,fontSize:16}}>📵 NO TRADE NAP</div>
        <div className="dc-card-footer"><span className="dc-footer-tag">trading-journal · {date}</span><div className="dc-footer-dot"/></div>
      </div>
    );
  }

  return (
    <div ref={cardRef} className="dc-card">
      <div className="dc-card-header">
        <div className="dc-logo"><div className="dc-logo-mark">TJ</div><div className="dc-logo-text">Trading Journal</div></div>
        <div className="dc-date-badge">{fmtDate(date)}</div>
      </div>
      <div className="dc-badges">
        {instruments.map(i=><span key={i} className="dc-badge dc-badge-inst">{i}</span>)}
        {directions.map(d=><span key={d} className={`dc-badge ${d==='Long'?'dc-badge-long':'dc-badge-short'}`}>{d}</span>)}
        <span className="dc-badge dc-badge-bias" style={{color:BIAS_COLORS[dayBias]}}>{BIAS_LABELS[dayBias]}</span>
        {setupClasses.map(s=><span key={s} className="dc-badge dc-badge-setup">Setup {s}</span>)}
        {hasSafety && <span className="dc-badge dc-badge-safety">🛡 Safety</span>}
      </div>
      <div style={{marginBottom:4,fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--text-3)'}}>Napi P&L</div>
      <div className={`dc-pnl-value ${pnlClass}`} style={{marginBottom:10}}>
        {pnlFmt(totalPnL)}
      </div>
      <div className="dc-result-row">
        {overallResult && <span className={`dc-result-badge ${resultBadgeClass}`}>{overallResult}</span>}
      </div>
      <div className="dc-stats-row">
        <div className="dc-stat"><span className="dc-stat-label">Trades</span><span className="dc-stat-value">{dayTrades.length}</span></div>
        <div className="dc-stat">
          <span className="dc-stat-label">W / L / BE</span>
          <span className="dc-stat-value">
            <span style={{color:'var(--green)'}}>{wins}</span>
            {' / '}<span style={{color:'var(--red)'}}>{losses}</span>
            {' / '}<span style={{color:'var(--yellow)'}}>{bes}</span>
          </span>
        </div>
        <div className="dc-stat">
          <span className="dc-stat-label">Win Rate</span>
          <span className="dc-stat-value" style={{color:wins>losses?'var(--green)':wins<losses?'var(--red)':'var(--yellow)'}}>
            {dayTrades.length>0?Math.round(wins/dayTrades.length*100):0}%
          </span>
        </div>
        <div className="dc-stat" style={{textAlign:'center',background:'rgba(0,212,170,0.06)',border:'1px solid rgba(0,212,170,0.18)',borderRadius:7,padding:'4px 6px'}}>
          <span className="dc-stat-label" style={{color:'var(--accent)'}}>Act. R:R</span>
          <span className="dc-stat-value" style={{color:avgRR&&parseFloat(avgRR)>0?'var(--accent)':'var(--text-3)'}}>
            {avgRR&&parseFloat(avgRR)>0 ? n(avgRR,2)+'R' : '–'}
          </span>
        </div>
      </div>
      {dayTrades.length>0 && (<>
        <div className="dc-divider"/>
        <div className="dc-trades-list">
          {dayTrades.map((t,i)=>{
            const filledTPs = (t.tpLevels||[]).filter(tp=>tp.price && parseFloat(tp.price));
            const trPnl = parseFloat(t.pnl)||0;
            return (
              <div key={t.id} style={{background:'rgba(255,255,255,0.03)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 14px',marginBottom:0}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:filledTPs.length?8:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,fontSize:11}}>
                    <span style={{color:'var(--text-3)',fontSize:10}}>#{i+1}</span>
                    <span className="dc-badge dc-badge-inst" style={{fontSize:10,padding:'2px 7px'}}>{t.instrument}</span>
                    <span className={`dc-badge ${t.direction==='Long'?'dc-badge-long':'dc-badge-short'}`} style={{fontSize:10,padding:'2px 7px'}}>{t.direction}</span>
                    {t.setupClass && <span style={{fontSize:10,color:'var(--text-3)'}}>Setup {t.setupClass}</span>}
                    {t.actualRR && <span style={{fontSize:10,color:'var(--accent)'}}>{n(t.actualRR,1)}R</span>}
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    {t.result==='BE' && <span style={{fontSize:11,fontWeight:700,color:'var(--yellow)',background:'rgba(255,215,64,0.12)',border:'1px solid rgba(255,215,64,0.35)',borderRadius:5,padding:'1px 7px'}}>BE</span>}
                    <span style={{fontSize:13,fontWeight:700,color:trPnl>=0?'var(--green)':'var(--red)'}}>
                      {pnlFmt(trPnl)}
                    </span>
                  </div>
                </div>
                {filledTPs.length>0 && (
                  <div style={{display:'flex',flexDirection:'column',gap:3,marginTop:6,paddingTop:6,borderTop:'1px solid rgba(255,255,255,0.06)'}}>
                    {filledTPs.map((tp,ti)=>{
                      const isBE = t.result==='BE';
                      return (
                        <div key={ti} style={{display:'flex',alignItems:'center',gap:8,fontSize:11,fontFamily:'var(--mono)'}}>
                          <span style={{color:'var(--text-3)',minWidth:32}}>TP{ti+1}</span>
                          <span style={{color:'var(--text-2)'}}>{parseFloat(tp.price).toLocaleString('en-US',{minimumFractionDigits:2})}</span>
                          {tp.contracts && <span style={{color:'var(--text-3)'}}>× {tp.contracts}</span>}
                          {isBE
                            ? <span style={{marginLeft:'auto',color:'var(--yellow)',fontWeight:700}}>BE</span>
                            : tp.hit
                              ? <span style={{marginLeft:'auto',color:'var(--green)',fontWeight:700}}>✓</span>
                              : <span style={{marginLeft:'auto',color:'var(--text-3)'}}>✗</span>
                          }
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </>)}
      <div className="dc-card-footer"><span className="dc-footer-tag">trading-journal · {date}</span><div className="dc-footer-dot"/></div>
    </div>
  );
}

// ── RANGE RECAP CARD ─────────────────────────────────────────────────────────
function RangeCardContent({ trades, from, to, cardRef, selectedAcctIds=[] }) {
  const allAccountsCard = React.useMemo(() => loadAccounts().filter(a=>a.status==='active'), []);
  const rangeTrades = trades
    .filter(t => {
      if (t.isNoTrade) return false;
      if (t.date < from || t.date > to) return false;
      // If specific accounts are selected, only show trades linked to those accounts
      if (selectedAcctIds.length > 0) {
        return (t.accountPositions||[]).some(p => selectedAcctIds.includes(p.accountId));
      }
      return true;
    })
    .sort((a,b) => {
      const ka = a.date + 'T' + (a.entryTime||'00:00');
      const kb = b.date + 'T' + (b.entryTime||'00:00');
      return ka.localeCompare(kb);
    });

  // Total P&L = sum of selected account-specific P&Ls, or global if no filter
  const totalPnL  = rangeTrades.reduce((s,t)=>{
    if (selectedAcctIds.length > 0) {
      const acctPnls = (t.accountPositions||[])
        .filter(p => selectedAcctIds.includes(p.accountId))
        .map(p => parseFloat(p.pnl)||0);
      return s + (acctPnls.length > 0 ? acctPnls.reduce((a,b)=>a+b,0) : (parseFloat(t.pnl)||0));
    }
    return s + effectiveTradePnL(t);
  }, 0);
  const wins      = rangeTrades.filter(t=>t.result==='Win').length;
  const losses    = rangeTrades.filter(t=>t.result==='Loss').length;
  const bes       = rangeTrades.filter(t=>t.result==='BE').length;
  const decisive  = wins + losses;
  const winRate   = decisive>0 ? Math.round(wins/decisive*100) : 0;
  const rrVals    = rangeTrades.filter(t=>t.actualRR).map(t=>parseFloat(t.actualRR));
  const avgRR     = rrVals.length>0 ? (rrVals.reduce((s,v)=>s+v,0)/rrVals.length) : null;
  const planVals  = rangeTrades.filter(t=>t.plannedRR).map(t=>parseFloat(t.plannedRR));
  const avgPlanRR = planVals.length>0 ? (planVals.reduce((s,v)=>s+v,0)/planVals.length) : null;
  // Per-account breakdown for recap card
  const acctBreakdown = React.useMemo(()=>{
    const result = [];
    allAccountsCard.forEach(acct=>{
      const linked = rangeTrades.filter(t=>(t.accountPositions||[]).some(p=>p.accountId===acct.id));
      if (!linked.length) return;
      const acctPnl = linked.reduce((s,t)=>{
        const pos=(t.accountPositions||[]).find(p=>p.accountId===acct.id);
        return s+(parseFloat(pos?.pnl)||0);
      },0);
      if (acctPnl !== 0 || linked.length > 0) result.push({ id:acct.id, name:acct.name, type:acct.type, pnl:acctPnl, trades:linked.length });
    });
    return result;
  }, [allAccountsCard, rangeTrades]);

  const isSingleDay = from===to;
  const fmtDate = (d) => new Date(d+'T12:00:00').toLocaleDateString('hu-HU',{year:'numeric',month:'long',day:'numeric'});
  const fmtDateShort = (d) => new Date(d+'T12:00:00').toLocaleDateString('hu-HU',{month:'short',day:'numeric'});

  const pnlColor = totalPnL>0?'var(--green)':totalPnL<0?'var(--red)':'var(--yellow)';

  const tpSummary = (t) => {
    const levels = (t.tpLevels||[]).filter(tp => tp.price && parseFloat(tp.price));
    if (levels.length === 0) {
      return t.result==='BE'
        ? <span style={{background:'rgba(255,215,64,0.15)',border:'1px solid rgba(255,215,64,0.4)',borderRadius:4,padding:'1px 6px',color:'var(--yellow)',fontWeight:700,fontSize:10}}>BE</span>
        : <span style={{color:'var(--text-3)'}}>–</span>;
    }
    const isBE = t.result === 'BE';
    const hitCount = levels.filter(tp=>tp.hit).length;
    const beInserted = isBE && hitCount < levels.length;
    const tags = [];
    let beShown = false;
    levels.forEach((tp, i) => {
      if (tp.hit) {
        tags.push(
          <span key={`tp${i}`} style={{background:'rgba(0,230,118,0.13)',border:'1px solid rgba(0,230,118,0.35)',
            borderRadius:4,padding:'1px 6px',color:'var(--green)',fontWeight:700,fontSize:10,whiteSpace:'nowrap'}}>
            TP{i+1} ✓
          </span>
        );
      } else {
        if (beInserted && !beShown) {
          beShown = true;
          tags.push(
            <span key="be" style={{background:'rgba(255,215,64,0.13)',border:'1px solid rgba(255,215,64,0.4)',
              borderRadius:4,padding:'1px 6px',color:'var(--yellow)',fontWeight:700,fontSize:10,whiteSpace:'nowrap'}}>
              BE
            </span>
          );
        }
        tags.push(
          <span key={`tp${i}x`} style={{background:'rgba(0,188,212,0.1)',border:'1px solid rgba(0,188,212,0.3)',
            borderRadius:4,padding:'1px 6px',color:'#4dd0e1',fontWeight:700,fontSize:10,whiteSpace:'nowrap'}}>
            TP{i+1} ✗
          </span>
        );
      }
    });
    if (isBE && !beShown) {
      tags.push(
        <span key="be-end" style={{background:'rgba(255,215,64,0.13)',border:'1px solid rgba(255,215,64,0.4)',
          borderRadius:4,padding:'1px 6px',color:'var(--yellow)',fontWeight:700,fontSize:10,whiteSpace:'nowrap'}}>
          BE
        </span>
      );
    }
    return <span style={{display:'inline-flex',gap:3,flexWrap:'wrap',alignItems:'center'}}>{tags}</span>;
  };

  const resultColor = (r) => r==='Win'?'var(--green)':r==='Loss'?'var(--red)':'var(--yellow)';

  return (
    <div ref={cardRef} className="dc-card" style={{width:950, maxWidth:'100%'}}>
      {/* Header */}
      <div className="dc-card-header">
        <div className="dc-logo">
          <div className="dc-logo-mark">TJ</div>
          <div className="dc-logo-text">Trading Journal</div>
        </div>
        <div className="dc-date-badge">
          {isSingleDay ? fmtDate(from) : `${fmtDate(from)} – ${fmtDate(to)}`}
        </div>
      </div>

      {rangeTrades.length===0 ? (
        <div style={{textAlign:'center',padding:'28px 0',color:'var(--text-3)',fontFamily:'var(--mono)'}}>
          Nincs trade ebben az időszakban.
        </div>
      ) : (<>

        {/* ── Summary KPI bar ── */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:0,marginBottom:18,
          background:'rgba(255,255,255,0.03)',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
          {[
            { label:'Total P&L',   value: pnlFmt(totalPnL),  color: pnlColor, big:true },
            { label:'Plan RR',     value: avgPlanRR!=null ? n(avgPlanRR,2)+'R' : '–', color:'var(--text-2)' },
            { label:'Act RR',      value: avgRR!=null ? n(avgRR,2)+'R' : '–',         color:'var(--accent)' },
            { label:'Trades',      value: rangeTrades.length,                          color:'var(--text)' },
            { label:'Win/Loss/BE', value: `${wins}/${losses}/${bes}`,                 color:'var(--text)' },
            { label:'Win Rate',    value: decisive>0?`${winRate}%`:'–',               color: winRate>=50?'var(--green)':'var(--red)' },
          ].map(({label,value,color,big},i)=>(
            <div key={label} style={{
              padding:'12px 14px',
              borderRight: i<5 ? '1px solid var(--border)' : 'none',
              textAlign:'center',
            }}>
              <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.7px',
                color:'var(--text-3)',marginBottom:5}}>{label}</div>
              <div style={{fontFamily:'var(--mono)',fontWeight:700,
                fontSize: big?20:15, color}}>{value}</div>
            </div>
          ))}
        </div>

        {/* ── Per-account breakdown ── */}
        {acctBreakdown.length > 0 && (
          <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:16}}>
            {acctBreakdown.map(a=>{
              const tColor=a.type==='challenge'?'var(--accent)':a.type==='funded'?'rgba(100,200,255,0.9)':'rgba(180,130,255,0.9)';
              const tRGB=a.type==='challenge'?'0,212,170':a.type==='funded'?'100,200,255':'180,130,255';
              return (
                <div key={a.id} style={{display:'flex',alignItems:'center',gap:8,
                  background:`rgba(${tRGB},0.07)`,border:`1px solid rgba(${tRGB},0.25)`,
                  borderRadius:8,padding:'7px 12px',flex:'1 1 160px',minWidth:140}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.6px',
                      color:tColor,marginBottom:2}}>{a.type==='challenge'?'Challenge':a.type==='funded'?'Funded':'Live'}</div>
                    <div style={{fontSize:11,fontWeight:600,color:'var(--text)',marginBottom:2,
                      whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:130}}>{a.name}</div>
                    <div style={{fontSize:9,color:'var(--text-3)'}}>{a.trades} trade</div>
                  </div>
                  <div style={{fontFamily:'var(--mono)',fontSize:16,fontWeight:700,
                    color:a.pnl>=0?'var(--green)':'var(--red)',whiteSpace:'nowrap'}}>
                    {pnlFmt(a.pnl)}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── Trade table ── */}
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontFamily:'var(--mono)',fontSize:11}}>
            <thead>
              <tr style={{borderBottom:'1px solid var(--border)'}}>
                {['Dátum','Asset','Dir','Bias','Setup','Plan R','Act R','TPs','P&L','Eredmény','Számlák'].map(h=>(
                  <th key={h} style={{padding:'6px 8px',textAlign:'left',fontSize:10,fontWeight:600,
                    textTransform:'uppercase',letterSpacing:'0.6px',color:'var(--text-3)',whiteSpace:'nowrap'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rangeTrades.map((t,i)=>{
                const pnl = parseFloat(t.pnl)||0;
                return (
                  <tr key={t.id} style={{borderBottom:'1px solid rgba(26,37,53,0.7)',
                    background: i%2===0?'transparent':'rgba(255,255,255,0.015)'}}>
                    <td style={{padding:'7px 8px',color:'var(--text-3)',whiteSpace:'nowrap'}}>
                      {isSingleDay ? (t.entryTime||'–') : fmtDateShort(t.date)}
                    </td>
                    <td style={{padding:'7px 8px',fontWeight:600,color:'var(--text)'}}>
                      {t.instrument}

                    <td style={{padding:'7px 8px'}}>
                      <span style={{
                        color: t.direction==='Long'?'var(--green)':'var(--red)',

                      }}>{t.direction==='Long'?'▲ L':'▼ S'}</span>
                    </td>
                    <td style={{padding:'7px 8px'}}>
                      <span style={{color:BIAS_COLORS[t.bias||3],fontSize:10}}>
                        {BIAS_LABELS[t.bias||3]}
                      </span>
                    </td>
                    <td style={{padding:'7px 8px',textAlign:'center'}}>
                      {t.setupClass
                        ? <span style={{background:'rgba(122,147,176,0.12)',border:'1px solid rgba(122,147,176,0.25)',
                            borderRadius:4,padding:'2px 6px',color:'var(--text-2)',fontWeight:700}}>{t.setupClass}</span>
                        : <span style={{color:'var(--text-3)'}}>–</span>
                      }
                    </td>
                    <td style={{padding:'7px 8px',color:'var(--text-3)',textAlign:'right'}}>
                      {t.plannedRR ? n(t.plannedRR,2)+'R' : '–'}
                    </td>
                    <td style={{padding:'7px 8px',color:'var(--accent)',textAlign:'right'}}>
                      {t.actualRR ? n(t.actualRR,2)+'R' : '–'}
                    </td>
                    <td style={{padding:'7px 8px',textAlign:'center'}}>
                      {tpSummary(t)}
                    </td>
                    <td style={{padding:'7px 8px',textAlign:'right',fontWeight:700,
                      color: pnl>0?'var(--green)':pnl<0?'var(--red)':'var(--yellow)'}}>
                      {pnlFmt(pnl)}
                    </td>
                    <td style={{padding:'7px 8px',textAlign:'center'}}>
                      <span style={{
                        display:'inline-block',padding:'2px 8px',borderRadius:4,fontSize:10,fontWeight:700,
                        color: resultColor(t.result),
                        background: t.result==='Win'?'rgba(0,230,118,0.12)':t.result==='Loss'?'rgba(255,61,113,0.12)':'rgba(255,215,64,0.12)',
                        border: `1px solid ${t.result==='Win'?'rgba(0,230,118,0.3)':t.result==='Loss'?'rgba(255,61,113,0.3)':'rgba(255,215,64,0.3)'}`,
                      }}>{t.result}</span>
                    </td>
                    <td style={{padding:'7px 8px'}}>
                      {(t.accountPositions||[]).length > 0 ? (
                        <div style={{display:'flex',flexDirection:'column',gap:2}}>
                          {(t.accountPositions||[]).map(pos=>{
                            const acct2 = allAccountsCard.find(a=>a.id===pos.accountId);
                            if (!acct2) return null;
                            const posP = parseFloat(pos.pnl)||0;
                            return (
                              <div key={pos.accountId} style={{whiteSpace:'nowrap',fontSize:9}}>
                                <span style={{color:'var(--text-3)'}}>{acct2.name.length>10?acct2.name.slice(0,10)+'…':acct2.name}</span>
                                {pos.pnl!==''&&<span style={{marginLeft:4,fontWeight:700,
                                  color:posP>=0?'var(--green)':'var(--red)'}}>{pnlFmt(posP)}</span>}
                              </div>
                            );
                          })}
                        </div>
                      ) : <span style={{color:'var(--text-3)'}}>–</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </>)}

      {/* Footer */}
      <div className="dc-card-footer" style={{marginTop:14}}>
        <span className="dc-footer-tag">trading-journal · {isSingleDay?from:`${from} → ${to}`}</span>
        <div className="dc-footer-dot"/>
      </div>
    </div>
  );
}

// ── CALENDAR ─────────────────────────────────────────────────────────────────
function CalendarView({ trades }) {
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  const allAccounts = React.useMemo(() => loadAccounts().filter(a => a.status === 'active'), []);
  const [cur, setCur] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const [cardFrom, setCardFrom] = useState(todayStr);
  const [cardTo,   setCardTo]   = useState(todayStr);
  const [showCard, setShowCard] = useState(false);
  const [cardAcctFilter, setCardAcctFilter] = useState([]); // empty = all accounts
  const cardRef = useRef(null);
  const year  = cur.getFullYear();
  const month = cur.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const rawFirst = new Date(year, month, 1).getDay();
  const firstDow = (rawFirst + 6) % 7;

  // Compute stats for ANY date (used for boundary days from prev/next month)
  const computeDayStats = useCallback((dateStr, dayTrades) => {
    const realTrades = dayTrades.filter(t=>!t.isNoTrade);
    const noTrade    = dayTrades.some(t=>t.isNoTrade);
    const pnl = realTrades.reduce((s,t)=>s+effectiveTradePnL(t),0);
    const wins   = realTrades.filter(t=>t.result==='Win').length;
    const losses = realTrades.filter(t=>t.result==='Loss').length;
    const allBE  = realTrades.length>0 && realTrades.every(t=>t.result==='BE');
    const bias= dayTrades[0]?.bias || 3;
    const dirs= [...new Set(realTrades.map(t=>t.direction))];
    const rrVals=realTrades.filter(t=>t.actualRR&&t.result!=='BE').map(t=>parseFloat(t.actualRR));
    const avgRR = rrVals.length>0 ? rrVals.reduce((s,v)=>s+v,0)/rrVals.length : null;
    const safety= realTrades.some(t=>t.safetyProtocol?.enabled);
    const acctData = {};
    allAccounts.forEach(acct => {
      const linked = realTrades.filter(t => (t.accountPositions||[]).some(p => p.accountId === acct.id));
      if (linked.length > 0) {
        const acctPnl  = linked.reduce((s,t)=>{ const pos=(t.accountPositions||[]).find(p=>p.accountId===acct.id); return s+(parseFloat(pos?.pnl)||0); }, 0);
        const acctCont = linked.reduce((s,t)=>{ const pos=(t.accountPositions||[]).find(p=>p.accountId===acct.id); return s+(parseFloat(pos?.contracts)||0); }, 0);
        acctData[acct.id] = { name: acct.name, pnl: acctPnl, contracts: acctCont };
      }
    });
    let cls='';
    if (!realTrades.length && noTrade) cls='day-notrade';
    else if (realTrades.length) {
      if (allBE) cls='day-be';
      else if (pnl>0) cls='day-win';
      else if (pnl<0) cls='day-loss';
      else cls='day-be';
    }
    return { pnl, wins, losses, allBE, bias, dirs, avgRR, safety, hasNoTrade:noTrade, count:realTrades.length, cls, acctData };
  }, [allAccounts]);

  // Build a map of ALL trades by date string (for boundary days)
  const allByDate = useMemo(()=>{
    const map = {};
    trades.forEach(t => {
      if (!map[t.date]) map[t.date] = [];
      map[t.date].push(t);
    });
    return map;
  },[trades]);

  const byDate = useMemo(()=>{
    const map = {};
    Object.entries(allByDate).forEach(([date, ts]) => {
      const d = new Date(date);
      if (d.getFullYear()===year && d.getMonth()===month) map[date] = ts;
    });
    return map;
  },[allByDate, year, month]);

  const dailyStats = useMemo(()=>{
    const ds = {};
    Object.entries(allByDate).forEach(([date, dayTrades]) => {
      ds[date] = computeDayStats(date, dayTrades);
    });
    return ds;
  },[allByDate, computeDayStats]);

  const monthlyTotal = useMemo(()=>
    Object.entries(dailyStats)
      .filter(([date])=>{ const d=new Date(date); return d.getFullYear()===year&&d.getMonth()===month; })
      .reduce((s,[,d])=>s+(d.pnl||0),0)
  ,[dailyStats, year, month]);

  // Build weeks: fill boundary slots with prev/next month days
  const prevMonthDays = new Date(year, month, 0).getDate(); // last day of prev month
  const toDateStr = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const toMonthDateStr = d => toDateStr(year, month, d);

  // Each cell: { dateStr, day, isCurrentMonth }
  const cells = [];
  // Fill start of first week with prev month days
  const prevYear = month===0 ? year-1 : year;
  const prevMonth = month===0 ? 11 : month-1;
  for (let i=0; i<firstDow; i++) {
    const d = prevMonthDays - firstDow + 1 + i;
    cells.push({ dateStr: toDateStr(prevYear, prevMonth, d), day: d, isCurrentMonth: false });
  }
  for (let d=1; d<=daysInMonth; d++) {
    cells.push({ dateStr: toMonthDateStr(d), day: d, isCurrentMonth: true });
  }
  // Fill end of last week with next month days
  const nextYear = month===11 ? year+1 : year;
  const nextMonth = month===11 ? 0 : month+1;
  const remaining = cells.length % 7 === 0 ? 0 : 7 - (cells.length % 7);
  for (let d=1; d<=remaining; d++) {
    cells.push({ dateStr: toDateStr(nextYear, nextMonth, d), day: d, isCurrentMonth: false });
  }

  const weeks = [];
  for (let i=0; i<cells.length; i+=7) weeks.push(cells.slice(i,i+7));

  // Weekly P&L includes boundary days (but monthly total doesn't)
  const weeklyPnL = weeks.map(wk =>
    wk.reduce((sum, cell) => sum + (dailyStats[cell.dateStr]?.pnl || 0), 0)
  );
  const dayHeaders = ['H','K','Sze','Cs','P','Szo','V'];

  const downloadCard = async () => {
    const el = cardRef.current;
    if (!el || typeof html2canvas === 'undefined') { alert('html2canvas nem elérhető.'); return; }
    try {
      const canvas = await html2canvas(el, { scale:2, backgroundColor:'#0a1018', useCORS:true, logging:false });
      const a = document.createElement('a');
      const label = cardFrom===cardTo ? cardFrom : `${cardFrom}_${cardTo}`;
      a.download = `recap_${label}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    } catch(e) { alert('Hiba: '+e.message); }
  };

  return (
    <div className="page">
      <div className="cal-nav">
        <button className="btn-ghost" onClick={()=>setCur(new Date(year, month-1, 1))}>{Ico.chev_l} Előző</button>
        <div style={{textAlign:'center'}}>
          <div className="cal-nav-title">{HU_MONTHS[month]} {year}</div>
          <div style={{fontFamily:'var(--mono)', fontSize:13, marginTop:5}}>
            Havi eredmény:&nbsp;
            <span className={`cal-monthly-total ${monthlyTotal>=0?'c-green':'c-red'}`}>${pnlFmt(monthlyTotal)}</span>
          </div>
        </div>
        <button className="btn-ghost" onClick={()=>setCur(new Date(year, month+1, 1))}>Következő {Ico.chev_r}</button>
      </div>

      <div className="cal-grid-header">
        {dayHeaders.map(h=><div key={h} className="cal-day-header">{h}</div>)}
      </div>

      {weeks.map((wk, wi) => (
        <div key={wi} className="cal-grid" style={{marginBottom:5}}>
          {wk.map((cell, di) => {
            const { dateStr, day, isCurrentMonth } = cell;
            const ds = dailyStats[dateStr];
            const isToday = dateStr===todayStr;
            const isWeekend = di>=5;
            const fadeStyle = !isCurrentMonth ? {opacity:0.28, pointerEvents:'none'} : {};
            const cls = ['cal-day', isCurrentMonth?(ds?.cls||''):'', isToday?'today':'', !ds&&isWeekend&&isCurrentMonth?'weekend':''].filter(Boolean).join(' ');
            const isSunday = di===6;
            const wPnL = weeklyPnL[wi];
            return (
              <div key={di} className={cls} style={fadeStyle}>
                <div className="cal-date" style={!isCurrentMonth?{color:'var(--text-3)'}:{}}>{day}</div>
                {ds && (<>
                  {ds.count>0 && (
                    <div className={`cal-pnl ${ds.pnl>=0?'c-green':'c-red'}`}>${pnlFmt(ds.pnl)}</div>
                  )}
                  {ds.hasNoTrade && ds.count===0 && (
                    <div style={{color:'var(--text-3)', fontSize:11, fontFamily:'var(--mono)'}}>NT</div>
                  )}
                  {isCurrentMonth && ds.acctData && Object.keys(ds.acctData).length > 0 && (
                    <div className="cal-day-acct-data" style={{marginTop:2}}>
                      {Object.values(ds.acctData).map((a,ai)=>(
                        <div key={ai} style={{fontFamily:'var(--mono)',fontSize:9,
                          color:a.pnl>=0?'rgba(0,230,118,0.8)':'rgba(255,61,113,0.8)',
                          whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                          {a.name.length>8?a.name.slice(0,8)+'…':a.name}: {a.pnl>=0?'+':''}{n(a.pnl,2)}
                          {a.contracts>0?` ×${a.contracts}`:''}
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="cal-meta">
                    <span className="cal-bias-dot" style={{background:BIAS_COLORS[ds.bias]}}/>
                    {ds.dirs.length>0 && (
                      <span style={{color:ds.dirs[0]==='Long'?'var(--green)':'var(--red)'}}>
                        {ds.dirs.map(d=>d==='Long'?'L':'S').join('/')}
                      </span>
                    )}
                    {ds.avgRR!=null && <span style={{marginLeft:3}}>· {ds.avgRR.toFixed(1)}R</span>}
                    {ds.safety && <span style={{color:'var(--yellow)',marginLeft:3}}>🛡</span>}
                    {ds.count>1 && <span style={{marginLeft:3, color:'var(--text-3)'}}>×{ds.count}</span>}
                  </div>
                </>)}
                {isSunday && isCurrentMonth && wPnL!==0 && (
                  <div className={`cal-week-inline ${wPnL>=0?'c-green':'c-red'}`}>
                    {wPnL<0?'-':''}${pnlFmt(Math.abs(wPnL))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}

      {/* ── RECAP KÁRTYA SZEKCIÓ ── */}
      <div className="cal-card-section">
        <div className="cal-card-title">{Ico.card} &nbsp;Recap Kártya</div>
        <div className="cal-card-controls">
          <div className="form-group" style={{margin:0}}>
            <label>Kezdő dátum</label>
            <input type="date" value={cardFrom} onChange={e=>{ setCardFrom(e.target.value); setShowCard(false); }}
              style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'8px 12px',color:'var(--text)',fontFamily:'var(--mono)',fontSize:13,outline:'none'}}/>
          </div>
          <div className="form-group" style={{margin:0}}>
            <label>Záró dátum</label>
            <input type="date" value={cardTo} onChange={e=>{ setCardTo(e.target.value); setShowCard(false); }}
              style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'8px 12px',color:'var(--text)',fontFamily:'var(--mono)',fontSize:13,outline:'none'}}/>
          </div>
          {/* Account filter */}
          {allAccounts.length > 0 && (
            <div className="form-group" style={{margin:0}}>
              <label>Számlák szűrője</label>
              <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:2}}>
                <button
                  className={`toggle-btn ${cardAcctFilter.length===0?'on-accent':''}`}
                  onClick={()=>setCardAcctFilter([])}>Összes</button>
                {allAccounts.map(a=>{
                  const sel = cardAcctFilter.includes(a.id);
                  const tC = a.type==='challenge'?'on-accent':a.type==='funded'?'on-yellow':'on-orange';
                  return (
                    <button key={a.id}
                      className={`toggle-btn ${sel?tC:''}`}
                      onClick={()=>setCardAcctFilter(prev=>
                        prev.includes(a.id)?prev.filter(x=>x!==a.id):[...prev,a.id]
                      )}>
                      {a.name.length>12?a.name.slice(0,12)+'…':a.name}
                    </button>
                  );
                })}
              </div>
            </div>
          )}
          <button className="btn-primary" style={{marginTop:18}} onClick={()=>setShowCard(true)}>
            {Ico.card} Kártya megjelenítése
          </button>
          {showCard && (<>
            <button className="btn-secondary" style={{marginTop:18}} onClick={downloadCard}>
              {Ico.download} PNG letöltés
            </button>
            <button className="btn-ghost" style={{marginTop:18}} onClick={()=>setShowCard(false)}>
              {Ico.x} Bezárás
            </button>
          </>)}
        </div>

        {showCard && (
          <div className="cal-cards-grid">
            <RangeCardContent trades={trades} from={cardFrom} to={cardTo} cardRef={cardRef} selectedAcctIds={cardAcctFilter}/>
          </div>
        )}
      </div>
    </div>
  );
}

// ── STATISTICS ─────────────────────────────────────────────────────────────
function Statistics({ trades, startingCapital }) {
  const sc = parseFloat(startingCapital) || 0;
  const allAccounts = useMemo(()=>loadAccounts(), []);

  // ── Filters (localStorage-ból töltjük be, mentjük vissza) ──
  const [fSetups,    setFSetups]    = useState(()=>{ try{return JSON.parse(localStorage.getItem('tj_sf_setups')||'[]');}catch{return [];} });
  const [fResult,    setFResult]    = useState(()=> localStorage.getItem('tj_sf_result')||'all');
  const [fFrom,      setFFrom]      = useState(()=> localStorage.getItem('tj_stats_from')||'');
  const [fTo,        setFTo]        = useState(()=> localStorage.getItem('tj_stats_to')||'');
  const [fDirection, setFDirection] = useState(()=> localStorage.getItem('tj_sf_dir')||'');
  const [fInstrument,setFInstrument]= useState(()=> localStorage.getItem('tj_sf_inst')||'');
  const [fAccount,   setFAccount]   = useState(()=> localStorage.getItem('tj_sf_acct')||'');

  useEffect(()=>{ localStorage.setItem('tj_sf_setups', JSON.stringify(fSetups)); }, [fSetups]);
  useEffect(()=>{ localStorage.setItem('tj_sf_result', fResult);     }, [fResult]);
  useEffect(()=>{ localStorage.setItem('tj_stats_from', fFrom);      }, [fFrom]);
  useEffect(()=>{ localStorage.setItem('tj_stats_to',   fTo);        }, [fTo]);
  useEffect(()=>{ localStorage.setItem('tj_sf_dir',  fDirection);    }, [fDirection]);
  useEffect(()=>{ localStorage.setItem('tj_sf_inst', fInstrument);   }, [fInstrument]);
  useEffect(()=>{ localStorage.setItem('tj_sf_acct', fAccount);      }, [fAccount]);

  const filteredTrades = useMemo(()=>{
    let t = trades.filter(r=>!r.isNoTrade);
    if (fSetups.length)    t = t.filter(r=>fSetups.includes(r.setupClass));
    if (fResult==='clean') t = t.filter(r=>!r.isRuleBreak);
    if (fResult==='rb')    t = t.filter(r=>r.isRuleBreak);
    if (fFrom)             t = t.filter(r=>r.date>=fFrom);
    if (fTo)               t = t.filter(r=>r.date<=fTo);
    if (fDirection)        t = t.filter(r=>r.direction===fDirection);
    if (fInstrument)       t = t.filter(r=>r.instrument===fInstrument);
    if (fAccount)          t = t.filter(r=>(r.accountPositions||[]).some(p=>p.accountId===fAccount));
    return t;
  },[trades,fSetups,fResult,fFrom,fTo,fDirection,fInstrument,fAccount]);

  const isFiltered = !!(fSetups.length||fResult!=='all'||fFrom||fTo||fDirection||fInstrument||fAccount);

  const s = useMemo(()=>calcStats(filteredTrades, sc),[filteredTrades, sc]);
  const real = useMemo(()=>filteredTrades,[filteredTrades]);

  // Per-account and per-type stats
  const acctStats = useMemo(()=>{
    const result = [];
    allAccounts.forEach(acct => {
      const linked = real.filter(t=>(t.accountPositions||[]).some(p=>p.accountId===acct.id));
      if (linked.length === 0) return;
      const byDate2={};
      linked.forEach(t=>{
        const pos=(t.accountPositions||[]).find(p=>p.accountId===acct.id);
        byDate2[t.date]=(byDate2[t.date]||0)+(parseFloat(pos?.pnl)||0);
      });
      const days2 = Object.values(byDate2);
      const totalPnL2 = days2.reduce((sv,v)=>sv+v,0);
      const dailyAvg2 = days2.length>0?totalPnL2/days2.length:0;
      const wkMap={}; Object.keys(byDate2).forEach(d=>{const wk=getISOWeek(d);wkMap[wk]=(wkMap[wk]||0)+byDate2[d];});
      const wkVals=Object.values(wkMap);
      const weeklyAvg2=wkVals.length>0?wkVals.reduce((sv,v)=>sv+v,0)/wkVals.length:0;
      const moMap={}; Object.keys(byDate2).forEach(d=>{const mo=d.slice(0,7);moMap[mo]=(moMap[mo]||0)+byDate2[d];});
      const moVals=Object.values(moMap);
      const monthlyAvg2=moVals.length>0?moVals.reduce((sv,v)=>sv+v,0)/moVals.length:0;
      result.push({ id:acct.id, name:acct.name, type:acct.type, trades:linked.length, totalPnL:totalPnL2, dailyAvg:dailyAvg2, weeklyAvg:weeklyAvg2, monthlyAvg:monthlyAvg2 });
    });
    return result;
  }, [allAccounts, real]);

  // Best/worst by account type
  const byTypeHighlights = useMemo(()=>{
    const types = ['challenge','funded','live'];
    return types.map(type=>{
      const typeAcctIds = allAccounts.filter(a=>a.type===type).map(a=>a.id);
      if (typeAcctIds.length===0) return null;
      const typeTrades = real.filter(t=>(t.accountPositions||[]).some(p=>typeAcctIds.includes(p.accountId)));
      if (!typeTrades.length) return null;
      const best2  = typeTrades.reduce((b,t)=>(!b||parseFloat(t.pnl)>parseFloat(b.pnl))?t:b,null);
      const worst2 = typeTrades.reduce((w,t)=>(!w||parseFloat(t.pnl)<parseFloat(w.pnl))?t:w,null);
      return { type, best:best2, worst:worst2, count:typeTrades.length };
    }).filter(Boolean);
  }, [allAccounts, real]);

  const allInstruments = useMemo(()=>[...new Set(trades.filter(t=>!t.isNoTrade).map(t=>t.instrument).filter(Boolean))],[trades]);

  if (!s && !isFiltered) return <div className="page"><div className="empty"><p>Nincs elég adat.</p></div></div>;
  const pf = s ? (s.profitFactor===Infinity?'∞':n(s.profitFactor)) : '–';
  return (
    <div className="page">
      <div className="page-header"><h1 className="page-title">Részletes Statisztikák</h1>
        {isFiltered && <span style={{fontSize:11,color:'var(--accent)',fontWeight:600}}>● Szűrt nézet</span>}
      </div>

      {/* ── FILTER BAR ── */}
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,
        padding:'12px 16px',marginBottom:18,display:'flex',flexWrap:'wrap',gap:10,alignItems:'flex-end'}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',
          letterSpacing:'0.7px',width:'100%',marginBottom:4}}>Szűrők</div>

        {/* Setup osztály */}
        <div>
          <div style={{fontSize:10,color:'var(--text-3)',marginBottom:3,fontWeight:600}}>Setup</div>
          <div style={{display:'flex',gap:4}}>
            {SETUPS.map(s2=>{
              const on = fSetups.includes(s2);
              const st = SETUP_STYLE[s2]||SETUP_STYLE['A'];
