// ── MONTE CARLO SIMULATION ───────────────────────────────────────────────────
function MonteCarloSim({ trades }) {
  const [mode,      setMode]      = useState('historical');
  // Historical params
  const [hFrom,     setHFrom]     = useState('');
  const [hTo,       setHTo]       = useState('');
  const [hCap,      setHCap]      = useState('10000');
  // Manual params
  const [mCap,      setMCap]      = useState('10000');
  const [mWR,       setMWR]       = useState('55');
  const [mRR,       setMRR]       = useState('1.5');
  const [mRisk,     setMRisk]     = useState('100');
  const [riskMode,  setRiskMode]  = useState('fixed');
  // Shared
  const [tpw,       setTpw]       = useState('5');
  const [horizon,   setHorizon]   = useState('52');
  const [numSims,   setNumSims]   = useState(1000);
  const [ruinPct,   setRuinPct]   = useState('20');
  const [result,    setResult]    = useState(null);
  const [running,   setRunning]   = useState(false);
  const chartRef  = useRef(null);
  const chartInst = useRef(null);

  const HORIZONS = [{l:'1 hét',w:1},{l:'1 hó',w:4},{l:'3 hó',w:13},{l:'6 hó',w:26},
                    {l:'1 év',w:52},{l:'2 év',w:104},{l:'3 év',w:156},{l:'5 év',w:260}];

  const sampleTrades = useMemo(()=>{
    const real = trades.filter(t=>!t.isNoTrade&&!t.isRuleBreak);
    if (!hFrom&&!hTo) return real;
    return real.filter(t=>(!hFrom||t.date>=hFrom)&&(!hTo||t.date<=hTo));
  },[trades,hFrom,hTo]);

  const histPnLs = useMemo(()=>sampleTrades.map(t=>effectiveTradePnL(t)),[sampleTrades]);

  const autoTpw = useMemo(()=>{
    // BE trade-eket nem számoljuk bele az átlag trade/hét kalkulációba
    const decisive = sampleTrades.filter(t=>t.result==='Win'||t.result==='Loss');
    if (decisive.length<2) return null;
    const dates=[...new Set(decisive.map(t=>t.date))].sort();
    if (dates.length<2) return null;
    const weeks=((new Date(dates[dates.length-1])-new Date(dates[0]))/86400000+1)/7;
    return weeks>0 ? (decisive.length/weeks).toFixed(1) : null;
  },[sampleTrades]);

  const runSim = useCallback(()=>{
    const weeks   = Math.max(1, parseFloat(horizon)||52);
    const tpwVal  = Math.max(1, parseFloat(tpw)||5);
    const simCnt  = Math.min(Math.max(100, numSims), 10000);
    const totalN  = Math.round(weeks*tpwVal);
    const ruin    = Math.max(1, Math.min(99, parseFloat(ruinPct)||20));
    const cap     = parseFloat(mode==='historical'?hCap:mCap)||10000;
    const wr      = Math.min(0.99, Math.max(0.01, (parseFloat(mWR)||55)/100));
    const rr      = Math.max(0.1, parseFloat(mRR)||1.5);
    const riskVal = Math.max(0.01, parseFloat(mRisk)||100);
    const ruinFloor = cap*(1-ruin/100);

    if (mode==='historical'&&histPnLs.length<3){alert('Legalább 3 clean trade szükséges!');return;}
    setRunning(true);
    setTimeout(()=>{
      const allFinals=[], allMaxDDs=[], ruinHit=[], yr1Vals=[];
      const yr1Step = Math.round(52*tpwVal);
      const samplePaths=[];

      for (let s=0;s<simCnt;s++){
        let eq=cap, peak=cap, maxDD=0, ruined=false;
        const path=[cap];
        for (let i=0;i<totalN;i++){
          const risk = riskMode==='percent'
            ? Math.max(0.01, eq * riskVal / 100)
            : riskVal;
          const tr = mode==='historical'
            ? histPnLs[Math.floor(Math.random()*histPnLs.length)]
            : (Math.random()<wr ? risk*rr : -risk);
          eq+=tr;
          path.push(Math.round(eq*100)/100);
          if(eq>peak) peak=eq;
          const dd=peak-eq; if(dd>maxDD) maxDD=dd;
          if(!ruined&&eq<=ruinFloor) ruined=true;
        }
        allFinals.push(eq);
        allMaxDDs.push(maxDD);
        ruinHit.push(ruined?1:0);
        if(yr1Step>0&&yr1Step<=totalN) yr1Vals.push(path[yr1Step]);
        if(s<100) samplePaths.push(path);
      }

      // Percentile bands (from 100 sample paths)
      const p5b=[],p50b=[],p95b=[];
      for(let i=0;i<=totalN;i++){
        const col=samplePaths.map(p=>p[i]).sort((a,b)=>a-b);
        p5b.push(col[Math.floor(col.length*0.05)]??col[0]);
        p50b.push(col[Math.floor(col.length*0.50)]??col[0]);
        p95b.push(col[Math.floor(col.length*0.95)]??col[col.length-1]);
      }
      const srt=[...allFinals].sort((a,b)=>a-b);
      const median  =srt[Math.floor(simCnt*0.50)]??0;
      const p5Final =srt[Math.floor(simCnt*0.05)]??0;
      const p95Final=srt[Math.floor(simCnt*0.95)]??0;
      const avgDD   =allMaxDDs.reduce((s,v)=>s+v,0)/simCnt;
      const worstDD =Math.max(...allMaxDDs);
      const pProfit =allFinals.filter(v=>v>cap).length/simCnt*100;
      const pRuin   =ruinHit.reduce((s,v)=>s+v,0)/simCnt*100;
      let yr1Median=null;
      if(yr1Vals.length>0){const y=[...yr1Vals].sort((a,b)=>a-b);yr1Median=y[Math.floor(y.length*0.5)]??null;}
      setResult({samplePaths,p5b,p50b,p95b,median,p5Final,p95Final,
        avgDD,worstDD,pProfit,pRuin,yr1Median,cap,weeks,N:totalN,M:simCnt,ruin,tpwVal});
      setRunning(false);
    },20);
  },[mode,histPnLs,hCap,mCap,mWR,mRR,mRisk,riskMode,tpw,horizon,numSims,ruinPct]);

  useEffect(()=>{
    if(!result||!chartRef.current) return;
    if(chartInst.current) chartInst.current.destroy();
    const ctx=chartRef.current.getContext('2d');
    const tpwV=result.tpwVal||5;
    // Build sparse X labels showing time milestones
    const milestones={0:'Start'};
    [[4,'1 hó'],[13,'3 hó'],[26,'6 hó'],[52,'1 év'],[104,'2 év'],[156,'3 év'],[260,'5 év']]
      .forEach(([wk,lbl])=>{const idx=Math.round(wk*tpwV);if(idx<=result.N)milestones[idx]=lbl;});
    milestones[result.N]='Vége';
    const labels=Array.from({length:result.N+1},(_,i)=>milestones[i]||'');
    const datasets=[
      ...result.samplePaths.slice(0,50).map((p,i)=>({
        data:p,borderColor:'rgba(120,140,170,0.09)',backgroundColor:'transparent',
        borderWidth:1,pointRadius:0,tension:0,fill:false,label:i===0?'Szimulációk':'',
      })),
      {data:result.p95b,borderColor:'rgba(0,230,118,0.75)',backgroundColor:'transparent',
       borderWidth:2,borderDash:[5,3],pointRadius:0,tension:0.1,fill:false,label:'95%'},
      {data:result.p50b,borderColor:'rgba(0,212,170,1)',backgroundColor:'transparent',
       borderWidth:2.5,pointRadius:0,tension:0.1,fill:false,label:'Medián'},
      {data:result.p5b,borderColor:'rgba(255,61,113,0.75)',backgroundColor:'transparent',

    ];
    chartInst.current=new Chart(ctx,{
      type:'line',data:{labels,datasets},
      options:{responsive:true,maintainAspectRatio:false,animation:false,
        plugins:{legend:{labels:{color:'rgba(255,255,255,0.6)',
          filter:i=>!!i.text&&i.text!=='Szimulációk'&&i.text!=='',font:{size:11}}}},
        scales:{
          x:{ticks:{color:'rgba(255,255,255,0.35)',maxTicksLimit:10,
            callback:(v,i)=>labels[i]||''},grid:{color:'rgba(255,255,255,0.04)'}},

  const IS={background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:6,

  return (

            <div style={{display:'flex',alignItems:'center',gap:4}}>
              <input type="number" min="5" max="90" value={ruinPct} onChange={e=>setRuinPct(e.target.value)} style={{...IS,width:58}}/>
              <span style={{fontSize:11,color:'var(--text-3)'}}>% drawdown</span>

          <button onClick={runSim} disabled={running}
            style={{padding:'8px 24px',borderRadius:8,border:'none',cursor:running?'not-allowed':'pointer',
              fontWeight:700,fontSize:13,alignSelf:'flex-end',

        {/* Results */}
        {result&&(()=>{
          const {cap,median,p5Final,p95Final,avgDD,worstDD,pProfit,pRuin,yr1Median,ruin,M:M2,N:N2,weeks}=result;
          const ret=(v)=>((v-cap)/cap*100);
          const retStr=(v)=>(ret(v)>=0?'+':'')+ret(v).toFixed(1)+'%';
          const ddPct=(dd)=>(dd/cap*100).toFixed(1)+'%';
          const ruinColor=pRuin<5?'var(--green)':pRuin<15?'var(--yellow)':'var(--red)';
          const kpis=[
            {l:'Medián végeredmény',     v:'$'+n(cap+ret(median)>0?median:median,0), v2:retStr(median),     c:median>=cap?'var(--green)':'var(--red)'},
            {l:'Legjobb eset (95%)',     v:'$'+n(p95Final,0),                        v2:retStr(p95Final),   c:'var(--accent)'},
            {l:'Legrosszabb eset (5%)',  v:'$'+n(p5Final,0),                         v2:retStr(p5Final),    c:p5Final>=cap?'var(--green)':'var(--red)'},
            {l:'Átlag max DD',          v:'-$'+n(avgDD,0),                          v2:'-'+ddPct(avgDD),   c:'var(--yellow)'},
            {l:'Legrosszabb DD',        v:'-$'+n(worstDD,0),                        v2:'-'+ddPct(worstDD), c:'rgba(255,61,113,0.85)'},
            {l:'P(Profit)',             v:pProfit.toFixed(1)+'%',                   v2:'',                  c:pProfit>50?'var(--green)':'var(--red)'},
            {l:'P(Ruin) <'+ruin+'% DD', v:pRuin.toFixed(1)+'%',                    v2:'',                  c:ruinColor},
          ];
          if(yr1Median!==null) kpis.push(
            {l:'1 éves medián',         v:'$'+n(yr1Median,0),                       v2:retStr(yr1Median),  c:yr1Median>=cap?'var(--green)':'var(--red)'}
          );
          return(<>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:8,marginBottom:16}}>

                  <div style={{fontFamily:'var(--mono)',fontSize:15,fontWeight:700,color:c}}>{v}</div>
                  {v2&&<div style={{fontFamily:'var(--mono)',fontSize:11,color:c,opacity:0.7,marginTop:1}}>{v2}</div>}
                </div>
              ))}
            </div>
            <div style={{position:'relative',height:280}}><canvas ref={chartRef}/></div>
            <div style={{marginTop:8,fontSize:10,color:'var(--text-3)',textAlign:'center',fontFamily:'var(--mono)'}}>
              {M2} szimuláció · {N2} trade · {weeks} hét · bootstrap (visszatevéssel, clean trades)
            </div>
          </>);
        })()}
      </div>
    </div>
  );
}

// ── ACCOUNT PAGE ─────────────────────────────────────────────────────────────
function calcAccountProgress(trades, account) {
  const sc      = parseFloat(account.startCapital) || 0;
  const mllV    = parseFloat(account.mll)  || 0;
  const mdllV   = parseFloat(account.mdll) || 0;
  const target  = parseFloat(account.targetBalance) || 0;
  const minTD   = parseInt(account.minTradingDays) || 0;
  const minDP   = parseFloat(account.minDailyProfit) || 0;
  const consPct = parseFloat(account.consistencyRule) || 0;

  // Payouts (funded only)
  const payouts = ((account.payouts||[]).map(p=>({...p,amount:parseFloat(p.amount)||0}))
    .filter(p=>p.amount>0&&p.date)
    .sort((a,b)=>a.date.localeCompare(b.date)));
  const totalPayouts = payouts.reduce((s,p)=>s+p.amount,0);

  // Payout rules (funded)
  const payMinDays   = parseInt(account.payMinDays)||5;
  const payMinAmount = parseFloat(account.payMinAmount)||200;
  const payMaxAmount = parseFloat(account.payMaxAmount)||1500;
  const payIntervalDays = parseInt(account.payIntervalDays)||14;
  const payConsistencyPct = parseFloat(account.payConsistencyPct)||40;

  const linkedTrades = trades.filter(t =>
    !t.isNoTrade && (t.accountPositions||[]).some(p => p.accountId === account.id)
  );
  const byDate = {};
  if (linkedTrades.length > 0) {
    // New-style: use per-account P&L from accountPositions
    linkedTrades.forEach(t => {
      const pos = (t.accountPositions||[]).find(p => p.accountId === account.id);
      const pnl = parseFloat(pos?.pnl) || 0;
      byDate[t.date] = (byDate[t.date]||0) + pnl;
    });
  } else {
    // Legacy fallback: only for trades that have NO accountPositions at all
    // (old trades before the multi-account system was added).
    // Trades that DO have accountPositions but just not this account → skip them.
    trades.filter(t =>
      !t.isNoTrade &&
      (!account.startDate || t.date >= account.startDate) &&
      (!t.accountPositions || t.accountPositions.length === 0)
    ).forEach(t => { byDate[t.date] = (byDate[t.date]||0) + (parseFloat(t.pnl)||0); });
  }
  const dailyArr = Object.entries(byDate).map(([date,pnl])=>({date,pnl})).sort((a,b)=>a.date.localeCompare(b.date));

  // Build combined event list: trading days + payouts (payouts after trades on same day)
  const allEvents = [
    ...dailyArr.map(d=>({date:d.date,value:d.pnl,isPayout:false})),
    ...payouts.map(p=>({date:p.date,value:-p.amount,isPayout:true,payoutId:p.id,payoutAmount:p.amount}))
  ].sort((a,b)=>a.date.localeCompare(b.date)||(a.isPayout?1:-1));

  const totalPnL      = dailyArr.reduce((s,d)=>s+d.pnl, 0);
  const grossEquity   = sc + totalPnL;  // without payouts
  const currentEquity = grossEquity - totalPayouts; // after payouts
  const tradingDays   = dailyArr.length;
  const worstDay      = dailyArr.length ? Math.min(...dailyArr.map(d=>d.pnl)) : 0;
  const bestDay       = dailyArr.length ? Math.max(...dailyArr.map(d=>d.pnl)) : 0;
  const latestDayPnL  = dailyArr.length ? dailyArr[dailyArr.length-1].pnl : 0;
  const latestDate    = dailyArr.length ? dailyArr[dailyArr.length-1].date : null;

  // Day-by-day simulation with payouts; MLL floor capped at sc
  let runEq        = sc;
  let mllFloorCur  = mllV  > 0 ? sc - mllV  : null;
  let mdllFloorCur = mdllV > 0
    ? Math.max(sc - mdllV, mllFloorCur !== null ? mllFloorCur : -Infinity)
    : null;

  let mllBreached  = false;
  let mdllBreached = false;

  // Prepend starting capital as the first point (day 0)
  const startLabel = account.startDate ? account.startDate.slice(5) : 'Start';
  const equityHistory = [{
    label: startLabel, equity: sc,
    fullDate: account.startDate || '', isPayout: false, payoutAmount: 0
  }];
  const mllHistory  = mllV  > 0 ? [mllFloorCur] : [];
  const mdllHistory = mdllV > 0 ? [mdllFloorCur] : [];
  const trackTarget = target > sc && (consPct > 0 || (account.type === 'funded' && payConsistencyPct > 0));
  const targetHistory = trackTarget ? [target] : [];
  let runBestSincePay = 0;
  let runBaseEqForPay = sc;

  allEvents.forEach(ev => {
    const dayMll  = mllFloorCur;
    const dayMdll = mdllFloorCur;

    runEq += ev.value;

    if (!ev.isPayout) {
      if (mllV  > 0 && dayMll  !== null && runEq <= dayMll)  mllBreached  = true;
      if (mdllV > 0 && dayMdll !== null && runEq <= dayMdll) mdllBreached = true;
    } else {
      // After payout, also check MLL breach
      if (mllV > 0 && dayMll !== null && runEq <= dayMll) mllBreached = true;
    }

    equityHistory.push({
      label: ev.date.slice(5),
      equity: Math.round(runEq * 100) / 100,
      fullDate: ev.date,
      isPayout: ev.isPayout,
      payoutAmount: ev.payoutAmount || 0,
    });
    if (mllV  > 0) mllHistory.push(dayMll);
    if (mdllV > 0) mdllHistory.push(dayMdll);
    if (trackTarget) {
      if (!ev.isPayout) {
        if (ev.value > 0) runBestSincePay = Math.max(runBestSincePay, ev.value);
        const payConsMin = (account.type === 'funded' && payConsistencyPct > 0 && runBestSincePay > 0)
          ? runBestSincePay / (payConsistencyPct / 100) : 0;
        const genConsMin = (consPct > 0 && runBestSincePay > 0)
          ? runBestSincePay / (consPct / 100) : 0;
        const consMin = Math.max(payConsMin, genConsMin);
        const profitFromBase = Math.max(target - runBaseEqForPay, 0);
        targetHistory.push(runBaseEqForPay + Math.max(profitFromBase, consMin));
      } else {
        runBestSincePay = 0;
        runBaseEqForPay = runEq;
        targetHistory.push(target);
      }
    }

    if (!ev.isPayout) {
      // MLL only moves up, capped at sc (starting capital)
      if (mllV > 0) {
        const newFloor = Math.min(sc, Math.max(mllFloorCur, runEq - mllV));
        mllFloorCur = newFloor;
      }
      if (mdllV > 0) {
        const raw = runEq - mdllV;
        mdllFloorCur = mllFloorCur !== null ? Math.max(raw, mllFloorCur) : raw;
      }
    }
    // Payouts don't change the MLL floor (the floor stays where it was)
  });

  const isBreached = mllBreached || mdllBreached;
  const currentMllFloor  = mllFloorCur;
  const currentMdllFloor = mdllFloorCur;

  const qualDays       = dailyArr.filter(d => d.pnl > 0 && (minDP === 0 || d.pnl >= minDP));
  const tradingDaysMet = minTD === 0 || tradingDays >= minTD;
  const qualDaysMet    = account.type==='funded' ? (minTD === 0 || qualDays.length >= minTD) : tradingDaysMet;

  const consistencyActual = (totalPnL > 0 && bestDay > 0) ? (bestDay / totalPnL * 100) : 0;
  const consistencyMet    = consPct === 0 || totalPnL <= 0 || consistencyActual <= consPct;

  // Effective target: if consistency rule requires more total P&L than the configured target, raise it
  // For funded accounts: use payConsistencyPct (payout rule) based on best day since last payout
  const lastPayoutForTarget = payouts.length > 0 ? payouts[payouts.length-1] : null;
  const sincePayoutDays = lastPayoutForTarget ? dailyArr.filter(d => d.date > lastPayoutForTarget.date) : dailyArr;
  const bestDaySincePayout = sincePayoutDays.length ? Math.max(...sincePayoutDays.map(d=>d.pnl)) : 0;
  const netSincePayout = sincePayoutDays.reduce((s,d)=>s+d.pnl, 0);
  const baseEquityForPayout = currentEquity - netSincePayout; // equity at time of last payout (or start)

  const generalConsMin = (consPct > 0 && bestDay > 0) ? bestDay / (consPct / 100) : 0;
  const payoutConsMin  = (account.type === 'funded' && payConsistencyPct > 0 && bestDaySincePayout > 0)
    ? bestDaySincePayout / (payConsistencyPct / 100) : 0;
  const consistencyMinPnL = Math.max(generalConsMin, payoutConsMin);

  const configuredProfitTarget = target > sc ? target - sc : 0;
  // For payout-based consistency: min equity = base equity + min net since payout to satisfy consistency
  const payoutConsEffectiveTarget = payoutConsMin > 0 ? baseEquityForPayout + Math.max(configuredProfitTarget - (baseEquityForPayout - sc), payoutConsMin) : 0;
  const effectiveTarget = Math.max(
    target,
    generalConsMin > 0 ? sc + Math.max(configuredProfitTarget, generalConsMin) : 0,
    payoutConsEffectiveTarget
  );

  const targetProgress = (effectiveTarget > sc) ? Math.min(100, Math.max(0, (currentEquity - sc) / (effectiveTarget - sc) * 100)) : 0;
  const targetMet      = effectiveTarget > 0 && currentEquity >= effectiveTarget;

  // Payout eligibility (funded)
  let payoutEligible = false;
  let payoutEligibilityReasons = [];
  let payoutConsistencyOk = true;
  let payQualDaysList = [];
  let payHasMinDays = false;
  let payIntervalOk = true;
  let payDaysRemaining = 0;
  let payNetSincePayout = 0;
  let payBestSincePayout = 0;
  let payConsistencyPct2 = 0;
  if (account.type === 'funded') {
    payQualDaysList = dailyArr.filter(d => d.pnl > 0 && (minDP === 0 || d.pnl >= minDP));
    payHasMinDays = payQualDaysList.length >= payMinDays;
    if (!payHasMinDays) payoutEligibilityReasons.push(`Szükséges ${payMinDays} qualifying nap (${payQualDaysList.length}/${payMinDays})`);

    const lastPayout = payouts.length > 0 ? payouts[payouts.length-1] : null;
    const refDate = lastPayout ? lastPayout.date : (dailyArr.length > 0 ? dailyArr[0].date : null);
    if (refDate) {
      const daysDiff = Math.floor((new Date() - new Date(refDate+'T12:00:00')) / 86400000);
      payIntervalOk = daysDiff >= payIntervalDays;
      payDaysRemaining = payIntervalOk ? 0 : payIntervalDays - daysDiff;
      if (!payIntervalOk) payoutEligibilityReasons.push(`Várakozási idő: ${payDaysRemaining} nap van hátra`);
    }

    const sinceLastPayout = lastPayout ? dailyArr.filter(d => d.date > lastPayout.date) : dailyArr;
    payNetSincePayout = sinceLastPayout.reduce((s,d)=>s+d.pnl,0);
    payBestSincePayout = sinceLastPayout.length ? Math.max(...sinceLastPayout.map(d=>d.pnl)) : 0;
    payConsistencyPct2 = payConsistencyPct;
    payoutConsistencyOk = payNetSincePayout <= 0 || payBestSincePayout < payNetSincePayout * (payConsistencyPct/100);
    if (!payoutConsistencyOk) payoutEligibilityReasons.push(`Consistency rule: legjobb nap (${pnlFmt(payBestSincePayout)}) ≥ ${payConsistencyPct}% of profit (${pnlFmt(payNetSincePayout)})`);

    const payTargetMet = effectiveTarget <= 0 || currentEquity >= effectiveTarget;
    if (!payTargetMet) payoutEligibilityReasons.push(`Egyenleg (${pnlFmt(currentEquity)}) nem érte el a célösszeget (${pnlFmt(effectiveTarget)})`);
    payoutEligible = payHasMinDays && payIntervalOk && payoutConsistencyOk && payTargetMet;
  }

  return {
    totalPnL, grossEquity, currentEquity, totalPayouts, payouts,
    tradingDays, dailyArr, qualDays,
    worstDay, bestDay, latestDayPnL, latestDate,
    mllBreached, mdllBreached, isBreached,
    targetProgress, targetMet, tradingDaysMet, qualDaysMet,
    consistencyActual, consistencyMet,
    sc, mllV, mdllV, target, effectiveTarget, consistencyMinPnL, minTD, minDP, consPct,
    mllFloor:  mllV  > 0 ? currentMllFloor  : 0,
    mdllFloor: mdllV > 0 ? currentMdllFloor : null,
    equityHistory, mllHistory, mdllHistory, targetHistory,
    usingLinked: linkedTrades.length > 0,
    payoutEligible, payoutEligibilityReasons, payoutConsistencyOk,
    payMinDays, payMinAmount, payMaxAmount, payIntervalDays, payConsistencyPct,
    payQualDaysList, payHasMinDays, payIntervalOk, payDaysRemaining,
    payNetSincePayout, payBestSincePayout, payConsistencyPct2,
  };
}

// ── ACCOUNT EQUITY CHART ─────────────────────────────────────────────────────
function AccountEquityChart({ p }) {
  const ref  = useRef(null);
  const chart = useRef(null);
  useEffect(() => {
    if (!ref.current || !p.equityHistory?.length) return;
    if (chart.current) chart.current.destroy();
    const ctx = ref.current.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, 200);
    g.addColorStop(0, 'rgba(0,212,170,0.22)');
    g.addColorStop(1, 'rgba(0,212,170,0.0)');

    const labels = p.equityHistory.map(d => d.label);
    const equityVals = p.equityHistory.map(d => d.equity);

    const datasets = [
      { data: equityVals, borderColor: '#00d4aa', backgroundColor: g,
        borderWidth: 2, pointRadius: p.equityHistory.length > 30 ? 0 : 3,
        pointHoverRadius: 5, fill: true, tension: 0.08, label: 'Equity' }
    ];

    const allVals = [...equityVals];

    // Trailing MLL history line
    if (p.mllHistory?.length === p.equityHistory.length) {
      datasets.push({
        data: p.mllHistory,
        borderColor: 'rgba(255,61,113,0.75)', backgroundColor: 'transparent',
        borderWidth: 1.5, borderDash: [8, 4], pointRadius: 0, fill: false,
        tension: 0, label: 'MLL (trailing)'
      });
      allVals.push(...p.mllHistory.filter(v => v !== null));
    }

    // Rolling MDLL floor history
    if (p.mdllHistory?.length === p.equityHistory.length) {
      datasets.push({
        data: p.mdllHistory,
        borderColor: 'rgba(255,152,0,0.7)', backgroundColor: 'transparent',
        borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0, fill: false,
        tension: 0, label: 'MDLL limit'
      });
      allVals.push(...p.mdllHistory.filter(v => v !== null));
    }

    // Payout annotations: blue dots on payout events
    const payoutPoints = equityVals.map((v, i) =>
      p.equityHistory[i]?.isPayout ? v : null
    );
    const hasPayouts = payoutPoints.some(v => v !== null);
    if (hasPayouts) {
      datasets.push({
        data: payoutPoints,
        borderColor: 'rgba(100,180,255,0)',
        backgroundColor: 'rgba(60,160,255,0.9)',
        borderWidth: 0,
        pointRadius: payoutPoints.map(v => v !== null ? 8 : 0),
        pointHoverRadius: 10,
        pointStyle: 'triangle',
        fill: false,
        tension: 0,
        label: 'Kifizetés',
        showLine: false,
      });
    }

    // Target line: dynamic if targetHistory available, else flat effectiveTarget
    if (p.targetHistory?.length === p.equityHistory.length) {
      datasets.push({
        data: p.targetHistory,
        borderColor: 'rgba(100,200,255,0.7)', backgroundColor: 'transparent',
        borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, fill: false,
        tension: 0, label: 'Cél'
      });
      allVals.push(...p.targetHistory.filter(v => v !== null));
    } else if (p.effectiveTarget > p.sc) {
      datasets.push({
        data: labels.map(() => p.effectiveTarget),
        borderColor: 'rgba(100,200,255,0.7)', backgroundColor: 'transparent',
        borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, fill: false,
        tension: 0, label: 'Cél'
      });
      allVals.push(p.effectiveTarget);
    }

    const minV = Math.min(...allVals.filter(v => v !== null && isFinite(v)));
    const maxV = Math.max(...allVals.filter(v => v !== null && isFinite(v)));
    const pad  = Math.max((maxV - minV) * 0.1, 50);

    const hasLegend = datasets.length > 1;
    chart.current = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: hasLegend, labels: { color: '#7a93b0', font: { size: 10, family: "'IBM Plex Mono'" }, boxWidth: 20 } },
          tooltip: { backgroundColor: '#0d1520', borderColor: '#1a2535', borderWidth: 1,
            titleColor: '#7a93b0', bodyColor: '#dce8f5',
            callbacks: { label: c => ' $' + n(c.raw, 2) } }
        },
        scales: {
          x: { display: false },
          y: { min: minV - pad, max: maxV + pad, grid: { color: '#1a2535' }, border: { display: false },
            ticks: { color: '#3d5470', font: { family: "'IBM Plex Mono'", size: 9 },
              callback: v => '$' + n(v, 0) } }
        },
        interaction: { intersect: false, mode: 'index' }
      }
    });
    return () => { if (chart.current) chart.current.destroy(); };
  }, [p]);

  if (!p.equityHistory?.length) return null;
  return (
    <div style={{ margin: '14px 0 8px' }}>
      <div style={{ fontSize: 10, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.7px',
        color: 'var(--text-3)', marginBottom: 8 }}>Egyenleg görbe</div>
      <div style={{ position: 'relative', width: '100%', paddingBottom: '55%' }}>
        <canvas ref={ref} style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%' }}/>
      </div>
    </div>
  );
}

function AccountEntryCard({ account, trades, onEdit, onDelete, onPayoutSaved }) {

    saveAccountPayouts(account.id, updated);
    if (onPayoutSaved) onPayoutSaved();

  const [expanded, setExpanded] = useState(false);
  const p = calcAccountProgress(trades, account);

  const typeColor = isChal ? 'var(--accent)' : isFunded ? 'rgba(100,200,255,0.9)' : 'rgba(180,130,255,0.9)';

  const statusColor = (!isLive && account.status === 'passed') ? 'var(--green)'

      }}>

        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontFamily:'var(--mono)',fontSize:15,fontWeight:700,

  const ProgRow = ({label, pct, reached, color='var(--accent)', subLeft, subRight}) => {

    return (
    <div style={{marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:11,marginBottom:3}}>
        <span style={{color:'var(--text-3)',fontWeight:600}}>{label}</span>

            color: reached ? 'var(--green)' : color,

          background: reached ? 'linear-gradient(90deg,#00e676,#00d4aa)' : color,
          borderRadius:5,transition:'width 0.4s ease',
          boxShadow: clampedPct > 0 ? `0 0 8px ${color}` : 'none'

      </div>
    </div>
  );};

  const warnBox = (msg) => (
    <div style={{background:'rgba(255,61,113,0.1)',border:'1px solid rgba(255,61,113,0.35)',borderRadius:6,

  // ── Equity number-line track ──────────────────────────────────────────────
  const EquityTrack = () => {
    if (!p.sc) return null;
    const eq     = p.currentEquity;
    const sc2    = p.sc;
    const mllF   = p.mllV > 0 ? p.mllFloor : null;
    const tgt    = p.effectiveTarget > 0 ? p.effectiveTarget : null;
    const mdllF  = p.mdllFloor !== null && p.mdllFloor !== undefined ? p.mdllFloor : (p.mdllV > 0 ? eq - p.mdllV : null);
    const allV   = [eq, sc2, mllF, tgt, mdllF].filter(v => v !== null);
    const rawMin = Math.min(...allV), rawMax = Math.max(...allV);
    const pad    = Math.max((rawMax - rawMin) * 0.13, sc2 * 0.015);
    const tMin   = rawMin - pad, tMax = rawMax + pad, tRange = tMax - tMin;

        {[
          {l:'Egyenleg',    v:`$${n(p.currentEquity,2)}`,  c:p.totalPnL>=0?'var(--green)':'var(--red)'},
          {l:'P&L',         v:pnlFmt(p.totalPnL),           c:p.totalPnL>=0?'var(--green)':'var(--red)'},
          {l:'Kereskedési napok', v:p.tradingDays,            c:'var(--text)'},
          {l:'Legjobb nap', v:`$${n(p.bestDay,2)}`,          c:'var(--green)'},
          ...(isFunded && p.totalPayouts > 0 ? [

        ].map(({l,v,c})=>(

            borderRadius:8,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:9,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.6px',marginBottom:3}}>{l}</div>
            <div style={{fontFamily:'var(--mono)',fontSize:13,fontWeight:700,color:c}}>{v}</div>
          </div>
        ))}
      </div>
      {/* Payout summary row for funded */}
      {isFunded && p.totalPayouts > 0 && (
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'7px 10px',marginBottom:10,
          background:'rgba(60,160,255,0.07)',border:'1px solid rgba(60,160,255,0.2)',borderRadius:8,
          fontFamily:'var(--mono)',fontSize:11}}>
          <span style={{color:'rgba(100,180,255,0.9)',fontWeight:700}}>💰 Kifizetések összesen:</span>
          <span style={{fontWeight:700,color:'rgba(100,180,255,0.9)'}}>${n(p.totalPayouts,2)}</span>
          <span style={{color:'var(--text-3)'}}>·</span>
          <span style={{color:'var(--text-3)'}}>{p.payouts.length} alkalom</span>
          {p.payouts.map((py,i)=>(
            <span key={py.id||i} style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:10,color:'var(--text-3)',borderLeft:'1px solid var(--border)',paddingLeft:8}}>
              {py.date.slice(5)}: <span style={{color:'rgba(100,180,255,0.8)'}}>-${n(py.amount,2)}</span>
              {py.note && <span style={{color:'var(--text-3)',fontStyle:'italic'}}>({py.note})</span>}
              <button onClick={()=>openEditPayout(py)} title="Szerkesztés"
                style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-3)',fontSize:10,padding:'0 2px',lineHeight:1}}>✏</button>
              <button onClick={()=>deletePayout(py.id)} title="Törlés"
                style={{background:'none',border:'none',cursor:'pointer',color:'var(--red)',fontSize:10,padding:'0 2px',lineHeight:1}}>✕</button>
            </span>
          ))}
        </div>
      )}
      {/* Payout rules checklist (funded active) */}
      {isFunded && account.status==='active' && (
        <div style={{marginBottom:12,padding:'12px 14px',
          background:p.payoutEligible?'rgba(0,230,118,0.06)':'rgba(60,160,255,0.04)',
          border:`1px solid ${p.payoutEligible?'rgba(0,230,118,0.3)':'rgba(60,160,255,0.2)'}`,
          borderRadius:10}}>
          {/* Header */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',color:'rgba(100,180,255,0.8)'}}>
              💰 Kifizetési feltételek
            </span>
            <span style={{fontSize:11,fontWeight:700,
              color:p.payoutEligible?'var(--green)':'var(--text-3)',
              background:p.payoutEligible?'rgba(0,230,118,0.12)':'rgba(255,255,255,0.05)',
              border:`1px solid ${p.payoutEligible?'rgba(0,230,118,0.35)':'var(--border)'}`,
              borderRadius:5,padding:'3px 9px'}}>
              {p.payoutEligible ? '✓ Igényelhető' : '⏳ Nem igényelhető'}
            </span>
          </div>
          {/* Checklist rows */}
          {[
            p.payMinDays > 0 && {
              ok: p.payHasMinDays,
              label: `Min. Qualifying napok`,
              detail: `${p.payQualDaysList.length} / ${p.payMinDays}`,
            },
            p.payConsistencyPct2 > 0 && {
              ok: p.payoutConsistencyOk,
              label: `Consistency rule (max ${n(p.payConsistencyPct2,0)}%)`,
              detail: p.payNetSincePayout > 0
                ? `${n(p.payBestSincePayout/p.payNetSincePayout*100,1)}% jelenlegi`
                : '–',
            },
            p.payIntervalDays > 0 && {
              ok: p.payIntervalOk,
              label: `Várakozási idő (${p.payIntervalDays} nap)`,
              detail: p.payIntervalOk ? 'Letelt' : `${p.payDaysRemaining} nap van hátra`,
            },
            p.effectiveTarget > 0 && {
              ok: p.currentEquity >= p.effectiveTarget,
              label: `Célegyenleg elérve`,
              detail: `$${n(p.currentEquity,2)} / $${n(p.effectiveTarget,2)}`,
            },
          ].filter(Boolean).map((rule, i) => (
            <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'5px 0',
              borderTop: i>0 ? '1px solid rgba(255,255,255,0.04)' : 'none'}}>
              <div style={{width:22,height:22,borderRadius:5,flexShrink:0,
                background:rule.ok?'rgba(0,230,118,0.18)':'rgba(255,255,255,0.04)',
                border:`1px solid ${rule.ok?'rgba(0,230,118,0.5)':'var(--border)'}`,
                display:'flex',alignItems:'center',justifyContent:'center',
                fontSize:12,color:rule.ok?'var(--green)':'var(--text-3)',fontWeight:700}}>
                {rule.ok ? '✓' : ''}
              </div>
              <span style={{flex:1,fontSize:11,color:'var(--text-2)',fontWeight:600}}>{rule.label}</span>
              <span style={{fontFamily:'var(--mono)',fontSize:11,fontWeight:700,
                color:rule.ok?'var(--green)':'var(--text-3)'}}>
                {rule.detail}
              </span>
            </div>
          ))}
        </div>
      )}

      {/* Equity curve chart */}
      <AccountEquityChart p={p}/>

      {/* Progress bars */}
      {p.target > 0 && (
        <ProgRow label={isChal?'Célegyenleg (Challenge pass)':'Célegyenleg (Payout trigger)'}
          pct={p.targetProgress} reached={p.targetMet} color='var(--accent)'
          subRight={`$${n(p.currentEquity,2)} / $${n(p.effectiveTarget,2)}${p.effectiveTarget > p.target ? ` (cons. limit)` : ''}`}/>
      )}
      {p.mllV > 0 && (
        <ProgRow label={`Max. veszteség limit (MLL) – trailing · padló: $${n(p.mllFloor,2)}`}
          pct={Math.min(100, Math.max(0, (p.mllFloor + p.mllV - p.currentEquity) / p.mllV * 100))}
          reached={false}
          color={p.mllBreached?'var(--red)':'rgba(255,61,113,0.55)'}
          subRight={`$${n(p.mllFloor+p.mllV-p.currentEquity,2)} / $${n(p.mllV,2)} felhasználva`}/>
      )}
      {p.mdllV > 0 && (
        <ProgRow label={`MDLL – napi limit${p.latestDate?' ('+p.latestDate.slice(5)+')':''}`}
          pct={Math.min(100, Math.max(0, -p.latestDayPnL / p.mdllV * 100))}
          reached={false}
          color={p.mdllBreached?'var(--red)':p.latestDayPnL<0?'rgba(255,152,0,0.8)':'rgba(255,152,0,0.4)'}
          subRight={`${pnlFmt(p.latestDayPnL)} / limit: -$${n(p.mdllV,2)} · padló: $${p.mdllFloor!=null?n(p.mdllFloor,2):'–'}`}/>
      )}
      {(isChal || isFunded) && p.consPct > 0 && p.totalPnL > 0 && (
        <ProgRow label={`Consistency rule (max ${n(p.consPct,0)}%)`}
          pct={Math.min(100, p.consistencyActual)}
          reached={p.consistencyMet}
          color={p.consistencyMet?'rgba(0,212,170,0.7)':'var(--red)'}
          subRight={`legjobb nap: ${n(p.consistencyActual,1)}% / ${n(p.consPct,0)}% limit`}/>
      )}
      {p.minTD > 0 && (
        <div style={{marginBottom:10}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:6}}>
            <span style={{color:'var(--text-3)',fontWeight:600}}>{isChal?'Min. kereskedési napok':'Qualifying napok'}</span>
            <span style={{fontFamily:'var(--mono)',fontSize:11,
              color:(isChal?p.tradingDaysMet:p.qualDaysMet)?'var(--green)':'var(--text-3)'}}>
              {isChal?p.tradingDays:p.qualDays.length} / {p.minTD} nap
              {(isChal?p.tradingDaysMet:p.qualDaysMet)&&' ✓'}
            </span>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
            {Array.from({length:p.minTD},(_,i)=>{
              const done = i < (isChal?p.tradingDays:p.qualDays.length);
              const info = !isChal && p.qualDays[i];
              return (
                <div key={i} title={info?`${info.date}: $${n(info.pnl,2)}`:''}
                  style={{width:Math.max(16,Math.min(36,Math.floor(320/p.minTD)-4)),height:22,borderRadius:4,
                    background:done?'rgba(0,230,118,0.2)':'rgba(255,255,255,0.04)',
                    border:`1px solid ${done?'rgba(0,230,118,0.45)':'var(--border)'}`,
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:9,color:done?'var(--green)':'var(--text-3)',fontFamily:'var(--mono)',fontWeight:700
                  }}>
                  {done&&'✓'}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Payout modal */}
      {showPayoutModal && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.7)',
          zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}
          onClick={e=>e.target===e.currentTarget&&setShowPayoutModal(false)}>
          <div style={{background:'var(--surface)',border:'1px solid var(--border2)',borderRadius:14,
            padding:'24px 28px',width:400,maxWidth:'90vw'}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:16,color:'var(--text)'}}>💰 {editingPayoutId ? 'Kifizetés Szerkesztése' : 'Kifizetés Rögzítése'}</div>
            <div style={{fontSize:12,color:'var(--text-3)',fontFamily:'var(--mono)',marginBottom:14}}>
              Limit: ${n(p.payMinAmount,0)} – ${n(p.payMaxAmount,0)} · Egyenleg kifizetés után: ${n(p.currentEquity - (parseFloat(payoutForm.amount)||0),2)}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:16}}>
              <div className="form-group">
                <label>Dátum</label>
                <input type="date" value={payoutForm.date}
                  onChange={e=>setPayoutForm(pf=>({...pf,date:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>Összeg ($)</label>
                <input type="number" step="0.01" min={p.payMinAmount} max={p.payMaxAmount}
                  value={payoutForm.amount}
                  onChange={e=>setPayoutForm(pf=>({...pf,amount:e.target.value}))}
                  placeholder={`${p.payMinAmount} – ${p.payMaxAmount}`}/>
                {parseFloat(payoutForm.amount) > 0 && (parseFloat(payoutForm.amount) < p.payMinAmount || parseFloat(payoutForm.amount) > p.payMaxAmount) && (
                  <div style={{fontSize:10,color:'var(--red)',marginTop:2,fontFamily:'var(--mono)'}}>
                    Érvénytelen összeg! Min: ${n(p.payMinAmount,0)}, Max: ${n(p.payMaxAmount,0)}
                  </div>
                )}
              </div>
              <div className="form-group">
                <label>Megjegyzés (opcionális)</label>
                <input type="text" value={payoutForm.note}
                  onChange={e=>setPayoutForm(pf=>({...pf,note:e.target.value}))}
                  placeholder="pl. Havi kifizetés"/>
              </div>
            </div>
            <div style={{display:'flex',gap:10}}>
              <button className="btn-primary" onClick={()=>{
                const amt = parseFloat(payoutForm.amount);
                if (!amt || amt <= 0) { alert('Érvénytelen összeg!'); return; }
                if (!payoutForm.date) { alert('Dátum kötelező!'); return; }
                let updated;
                if (editingPayoutId) {
                  updated = (account.payouts||[]).map(py =>
                    py.id === editingPayoutId ? {...py, date: payoutForm.date, amount: amt, note: payoutForm.note} : py
                  );
                } else {
                  const newPayout = { id: uid(), date: payoutForm.date, amount: amt, note: payoutForm.note };
                  updated = [...(account.payouts||[]), newPayout];
                }
                saveAccountPayouts(account.id, updated);
                setShowPayoutModal(false);
                setEditingPayoutId(null);
                setPayoutForm({ date: new Date().toISOString().split('T')[0], amount: '', note: '' });
                if (onPayoutSaved) onPayoutSaved();
              }}>
                💰 {editingPayoutId ? 'Mentés' : 'Rögzítés'}
              </button>
              <button className="btn-secondary" onClick={()=>setShowPayoutModal(false)}>Mégse</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AccountEntryForm({ initial, onSave, onCancel }) {
  const [f, setF] = useState(() => ({
    id: uid(), type:'challenge', name:'', status:'active',
    startDate: new Date().toISOString().split('T')[0],

              desc:'Prop firm értékelési fázis – pass célokkal és szabályokkal',

              desc:'Élő funded account – kifizetési feltételek és qualifying napok',
              color:'rgba(100,200,255,0.9)', rgb:'100,200,255' },

              desc:'Saját tőkés live számla – egyedi kockázatkezelési szabályokkal',
              color:'rgba(180,130,255,0.9)', rgb:'180,130,255' },
          ].map(({v,label,icon,desc,color,rgb})=>{
            const sel = f.type === v;
            return (
              <button key={v} onClick={()=>s('type',v)} style={{
                padding:'14px',borderRadius:10,textAlign:'left',cursor:'pointer',
                border:`2px solid ${sel ? color : 'var(--border)'}`,
                background: sel ? `rgba(${rgb},0.07)` : 'rgba(255,255,255,0.02)',
                boxShadow: sel ? `0 0 18px rgba(${rgb},0.18)` : 'none',
                transition:'all 0.18s', outline:'none',
              }}>
                <div style={{fontSize:20,marginBottom:6}}>{icon}</div>
                <div style={{fontSize:12,fontWeight:700,
                  color: sel ? color : 'var(--text-2)', marginBottom:4}}>
                  {label}
                </div>
                <div style={{fontSize:10,color:'var(--text-3)',lineHeight:1.45}}>{desc}</div>
                {sel && (
                  <div style={{marginTop:8,display:'inline-flex',alignItems:'center',gap:4,
                    fontSize:10,fontWeight:700,color,
                    background:`rgba(${rgb},0.12)`,border:`1px solid rgba(${rgb},0.35)`,
                    borderRadius:5,padding:'2px 8px'}}>
                    ✓ Kiválasztva
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>

      <div className="form-grid-2">
        <div className="form-group">
          <label>Név / Azonosító</label>
          <input type="text" value={f.name} onChange={e=>s('name',e.target.value)}
            placeholder={isChallenge ? 'pl. FTMO Challenge #1' : 'pl. Apex Funded #1'}/>
        </div>
        <div className="form-group">
          <label>Státusz</label>
          <select value={f.status} onChange={e=>s('status',e.target.value)}
            style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',
              padding:'9px 12px',color:'var(--text)',fontSize:14,width:'100%'}}>
            <option value="active">Aktív</option>

          </select>

        <div className="form-group">
          <label>Kezdő dátum</label>
          <input type="date" value={f.startDate} onChange={e=>s('startDate',e.target.value)}/>
        </div>
        <div className="form-group">
          <label>Kezdő tőke ($)</label>
          <input type="number" step="0.01" value={f.startCapital} onChange={e=>s('startCapital',e.target.value)}
            placeholder="50000.00"/>
        </div>
        {/* Target balance — not for live */}
        {!isLive && (
          <div className="form-group">
            <label>{isChallenge ? 'Célegyenleg / Pass cél ($)' : 'Szükséges egyenleg kifizetéshez ($)'}</label>
            <input type="number" step="0.01" value={f.targetBalance} onChange={e=>s('targetBalance',e.target.value)}
              placeholder={isChallenge ? '53000.00' : '105000.00'}/>
          </div>

        {/* Live: profit target (optional) */}
        {isLive && (

            <input type="number" step="0.01" value={f.dailyProfitTarget||''} onChange={e=>s('dailyProfitTarget',e.target.value)}
              placeholder="500.00"/>
          </div>
        )}
        <div className="form-group">
          <label>Max. veszteség limit – MLL ($) <span style={{fontSize:10,color:'var(--text-3)'}}>teljes tőkétől</span></label>
          <input type="number" step="0.01" value={f.mll} onChange={e=>s('mll',e.target.value)}
            placeholder="2500.00"/>
        </div>
        <div className="form-group">
          <label>Max. napi veszteség – MDLL ($)</label>
          <input type="number" step="0.01" value={f.mdll} onChange={e=>s('mdll',e.target.value)}
            placeholder="1000.00"/>
        </div>
        {!isLive && (
          <div className="form-group">
            <label>{isChallenge ? 'Min. kereskedési napok' : 'Min. qualifying napok'}</label>
